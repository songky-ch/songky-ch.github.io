<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1130" viewBox="0 0 360 1130" role="img" aria-label="每一步改变什么?"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="1130" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">每一步改变什么?</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">D3 示例检索链 · 不是固定产品架构</text><rect x="20" y="90" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">切分资料</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">确定内容单元和身份</text><path d="M180 184 L180 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="232" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="260" font-size="17" fill="#243633" font-weight="600">确认权限与业务范围</text><text x="34" y="286" font-size="14" fill="#52665d" font-weight="400">合法范围内, 才比较相关性</text><path d="M95 326 L95 380" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265 326 L265 380" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="380" width="150" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="408" font-size="17" fill="#243633" font-weight="600">关键词检索</text><text x="34" y="434" font-size="14" fill="#52665d" font-weight="400">编号 / 原词</text><rect x="190" y="380" width="150" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="204" y="408" font-size="17" fill="#243633" font-weight="600">向量检索</text><text x="204" y="434" font-size="14" fill="#52665d" font-weight="400">近义 / 语义</text><path d="M95 474 L95 524" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265 474 L265 524" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="524" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="552" font-size="17" fill="#243633" font-weight="600">融合去重后的候选</text><path d="M120 618 L120 668" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="668" width="200" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="696" font-size="17" fill="#243633" font-weight="600">候选可用?</text><rect x="250" y="668" width="90" height="84" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="264" y="696" font-size="17" fill="#243633" font-weight="600">说明</text><text x="264" y="722" font-size="14" fill="#52665d" font-weight="400">空/错误</text><path d="M220 710 L250 710" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="706.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M120 752 L120 810" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="777.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="810" width="200" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="838" font-size="17" fill="#243633" font-weight="600">重排</text><rect x="250" y="810" width="90" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="264" y="838" font-size="17" fill="#243633" font-weight="600">说明</text><text x="264" y="864" font-size="14" fill="#52665d" font-weight="400">重排错误</text><path d="M220 856 L250 856" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="852.0" font-size="13" fill="#52665d" font-weight="400">错</text><path d="M120 902 L120 964" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="929.0" font-size="13" fill="#52665d" font-weight="400">成功</text><rect x="20" y="964" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="992" font-size="17" fill="#243633" font-weight="600">组织上下文</text><text x="34" y="1018" font-size="14" fill="#52665d" font-weight="400">记录最终实际保留的资料</text></g></svg>