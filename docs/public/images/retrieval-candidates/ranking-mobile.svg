<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-label="融合名次, 再比较候选"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="790" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">融合名次, 再比较候选</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">RRF 得分不是相关概率</text><rect x="20" y="90" width="150" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">关键词名次</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">1. C102</text><text x="34" y="168" font-size="14" fill="#52665d" font-weight="400">2. C101</text><rect x="190" y="90" width="150" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="204" y="118" font-size="17" fill="#243633" font-weight="600">向量名次</text><text x="204" y="144" font-size="14" fill="#52665d" font-weight="400">1. C102</text><text x="204" y="168" font-size="14" fill="#52665d" font-weight="400">2. C101</text><path d="M95 220 L95 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265 220 L265 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="280" width="320" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="308" font-size="17" fill="#243633" font-weight="600">按资料 ID 累加名次贡献</text><text x="34" y="334" font-size="14" fill="#52665d" font-weight="400">C102: 2/61 ≈ 0.03279</text><text x="34" y="358" font-size="14" fill="#52665d" font-weight="400">C101: 2/62 ≈ 0.03226</text><text x="34" y="382" font-size="14" fill="#52665d" font-weight="400">融合后按同一单元去重</text><path d="M180 410 L180 464" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="464" width="320" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="492" font-size="17" fill="#243633" font-weight="600">重排: 问题 + 已有候选</text><text x="34" y="518" font-size="14" fill="#52665d" font-weight="400">缺失资料不会凭空出现</text><path d="M180 564 L180 610" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="642" font-size="15" fill="#243633" font-weight="400">上下文预算决定实际保留哪些证据.</text><text x="24" y="700" font-size="16" fill="#243633" font-weight="400">两路名次互换时可能同分,</text><text x="24" y="734" font-size="16" fill="#243633" font-weight="400">融合并不保证判断正确.</text></g></svg>