<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-label="不要切断事实与身份"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="570" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">不要切断事实与身份</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">合成短记录 C102</text><rect x="20" y="90" width="716" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">完整记录</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">C102 / A-X / 10月20日 / 复测告警</text><rect x="20" y="270" width="330" height="156" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="298" font-size="19" fill="#243633" font-weight="600">机械切分</text><text x="34" y="324" font-size="16" fill="#52665d" font-weight="400">A: ID、对象、时间</text><text x="34" y="348" font-size="16" fill="#52665d" font-weight="400">B: 复测告警, 原因待确认</text><text x="34" y="372" font-size="16" fill="#52665d" font-weight="400">只拿到 B 无法判断范围</text><rect x="406" y="270" width="330" height="156" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="420" y="298" font-size="19" fill="#243633" font-weight="600">保留语义与元数据</text><text x="420" y="324" font-size="16" fill="#52665d" font-weight="400">短记录尽量完整</text><text x="420" y="348" font-size="16" fill="#52665d" font-weight="400">长文子片段继承身份和范围</text><text x="420" y="372" font-size="16" fill="#52665d" font-weight="400">重叠不能虚增问题数</text><path d="M200 196 L185 270" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M560 196 L571 270" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="495" font-size="16" fill="#243633" font-weight="400">片段要能独立解释, 又能追溯原记录.</text></g></svg>