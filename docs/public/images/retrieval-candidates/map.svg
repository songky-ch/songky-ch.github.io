<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1130" viewBox="0 0 760 1130" role="img" aria-label="每一步改变什么?"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="1130" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">每一步改变什么?</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">D3 示例检索链 · 不是固定产品架构</text><rect x="20" y="90" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">切分资料</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">确定内容单元和身份</text><path d="M378 184 L378 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="232" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="260" font-size="19" fill="#243633" font-weight="600">确认权限与业务范围</text><text x="34" y="286" font-size="16" fill="#52665d" font-weight="400">合法范围内, 才比较相关性</text><path d="M185 326 L185 380" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 326 L571 380" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="380" width="330" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="408" font-size="19" fill="#243633" font-weight="600">关键词检索</text><text x="34" y="434" font-size="16" fill="#52665d" font-weight="400">编号 / 原词</text><rect x="406" y="380" width="330" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="420" y="408" font-size="19" fill="#243633" font-weight="600">向量检索</text><text x="420" y="434" font-size="16" fill="#52665d" font-weight="400">近义 / 语义</text><path d="M185 474 L185 524" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 474 L571 524" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="524" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="552" font-size="19" fill="#243633" font-weight="600">融合去重后的候选</text><path d="M235 618 L235 668" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="668" width="430" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="696" font-size="19" fill="#243633" font-weight="600">候选可用?</text><rect x="540" y="668" width="196" height="84" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="554" y="696" font-size="19" fill="#243633" font-weight="600">说明</text><text x="554" y="722" font-size="16" fill="#52665d" font-weight="400">空/错误</text><path d="M450 710 L540 710" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="502.0" y="706.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M235 752 L235 810" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="777.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="810" width="430" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="838" font-size="19" fill="#243633" font-weight="600">重排</text><rect x="540" y="810" width="196" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="554" y="838" font-size="19" fill="#243633" font-weight="600">说明</text><text x="554" y="864" font-size="16" fill="#52665d" font-weight="400">重排错误</text><path d="M450 856 L540 856" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="502.0" y="852.0" font-size="13" fill="#52665d" font-weight="400">错</text><path d="M235 902 L235 964" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="929.0" font-size="13" fill="#52665d" font-weight="400">成功</text><rect x="20" y="964" width="716" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="992" font-size="19" fill="#243633" font-weight="600">组织上下文</text><text x="34" y="1018" font-size="16" fill="#52665d" font-weight="400">记录最终实际保留的资料</text></g></svg>