<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-label="不要切断事实与身份"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="720" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">不要切断事实与身份</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">合成短记录 C102</text><rect x="20" y="90" width="320" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">完整记录</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">C102 / A-X / 10月20日 / 复测告警</text><rect x="20" y="250" width="320" height="140" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="278" font-size="17" fill="#243633" font-weight="600">机械切分</text><text x="34" y="304" font-size="14" fill="#52665d" font-weight="400">A: ID、对象、时间</text><text x="34" y="328" font-size="14" fill="#52665d" font-weight="400">B: 复测告警, 原因待确认</text><text x="34" y="352" font-size="14" fill="#52665d" font-weight="400">只拿到 B, 不知道适用对象</text><path d="M180 196 L180 250" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="466" width="320" height="140" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="494" font-size="17" fill="#243633" font-weight="600">保留语义与元数据</text><text x="34" y="520" font-size="14" fill="#52665d" font-weight="400">短记录保持完整</text><text x="34" y="544" font-size="14" fill="#52665d" font-weight="400">长文子片段继承身份与范围</text><text x="34" y="568" font-size="14" fill="#52665d" font-weight="400">重叠片段不算不同问题</text><path d="M180 390 L180 466" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="424.0" font-size="13" fill="#52665d" font-weight="400">修正切分</text><text x="24" y="680" 