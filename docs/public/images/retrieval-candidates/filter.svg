<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="截断与过滤, 顺序有影响"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="620" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">截断与过滤, 顺序有影响</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">合成排名 · 本例要找 C102</text><rect x="20" y="90" width="716" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">全库模拟排名: C105 → C103 → C102 → C101</text><path d="M185 182 L185 242" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 182 L571 242" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="242" width="330" height="116" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="270" font-size="19" fill="#243633" font-weight="600">先取前 2, 再过滤</text><text x="34" y="296" font-size="16" fill="#52665d" font-weight="400">C105 客户不符</text><text x="34" y="320" font-size="16" fill="#52665d" font-weight="400">C103 日期越界</text><rect x="406" y="242" width="330" height="116" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="420" y="270" font-size="19" fill="#243633" font-weight="600">先限定合法范围</text><text x="420" y="296" font-size="16" fill="#52665d" font-weight="400">只在 C101 / C102 中检索</text><path d="M185 358 L185 420" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 358 L571 420" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="420" width="330" height="94" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="448" font-size="19" fill="#243633" font-weight="600">结果为空</text><rect x="406" y="420" width="330" height="94" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="420" y="448" font-size="19" fill="#243633" font-weight="600">有机会返回 C102</text><text x="24" y="581" font-size="16" fill="#243633" font-weight="400">集合示意, 不承诺近似检索无损; 引擎执行位置需按版本核对.</text></g></svg>