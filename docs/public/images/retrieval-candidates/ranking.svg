<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-label="融合名次, 再比较候选"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="660" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">融合名次, 再比较候选</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">RRF 得分不是相关概率</text><rect x="20" y="90" width="330" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">关键词名次</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">1. C102</text><text x="34" y="168" font-size="16" fill="#52665d" font-weight="400">2. C101</text><rect x="406" y="90" width="330" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="420" y="118" font-size="19" fill="#243633" font-weight="600">向量名次</text><text x="420" y="144" font-size="16" fill="#52665d" font-weight="400">1. C102</text><text x="420" y="168" font-size="16" fill="#52665d" font-weight="400">2. C101</text><path d="M185 220 L185 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 220 L571 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="280" width="716" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="308" font-size="19" fill="#243633" font-weight="600">按资料 ID 累加名次贡献</text><text x="34" y="334" font-size="16" fill="#52665d" font-weight="400">C102: 2/61 ≈ 0.03279</text><text x="34" y="358" font-size="16" fill="#52665d" font-weight="400">C101: 2/62 ≈ 0.03226</text><text x="34" y="382" font-size="16" fill="#52665d" font-weight="400">融合后按同一单元去重</text><path d="M378 410 L378 464" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="464" width="716" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="492" font-size="19" fill="#243633" font-weight="600">重排: 问题 + 已有候选</text><text x="34" y="518" font-size="16" fill="#52665d" font-weight="400">缺失资料不会凭空出现</text><path d="M378 564 L378 610" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="642" font-size="15" fill="#243633" font-weight="400">上下文预算决定实际保留哪些证据.</text></g></svg>