<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-label="截断与过滤, 顺序有影响"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="790" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">截断与过滤, 顺序有影响</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">合成排名 · 本例要找 C102</text><rect x="20" y="90" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">全库模拟排名</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">C105 → C103 → C102 → C101</text><path d="M180 184 L180 230" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="203.0" font-size="13" fill="#52665d" font-weight="400">先取前 2</text><rect x="20" y="230" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="258" font-size="17" fill="#243633" font-weight="600">C105 / C103</text><text x="34" y="284" font-size="14" fill="#52665d" font-weight="400">客户不符 / 日期越界</text><path d="M180 324 L180 370" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="343.0" font-size="13" fill="#52665d" font-weight="400">再过滤</text><rect x="20" y="370" width="320" height="76" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="398" font-size="17" fill="#243633" font-weight="600">结果为空</text><rect x="20" y="514" width="320" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="542" font-size="17" fill="#243633" font-weight="600">先限定合法范围</text><text x="34" y="568" font-size="14" fill="#52665d" font-weight="400">C101 / C102</text><path d="M180 614 L180 658" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="632.0" font-size="13" fill="#52665d" font-weight="400">在范围内检索</text><rect x="20" y="658" width="320" height="94" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="686" font-size="17" fill="#243633" font-weight="600">有机会返回 C102</text></g></svg>