<text x="135.0" y="1118.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">支付 → 结算</text>
<text x="135.0" y="1149.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">→ 对账</text>
<rect x="288" y="1057" width="194" height="104" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="385.0" y="1087.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">报告分批处理</text>
<text x="385.0" y="1118.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">生成中间要点</text>
<text x="385.0" y="1149.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">Map</text>
<polyline points="135,1161 135,1200" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)"/>
<polyline points="385,1161 385,1200" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="38" y="1207" width="194" height="104" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="135.0" y="1237.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">回取 D3 / D4</text>
<text x="135.0" y="1268.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">核对方向</text>
<text x="135.0" y="1299.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">时间与权限</text>
