<text x="385.0" y="1299.0" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">Reduce</text>
<polyline points="135,1311 135,1350" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)"/>
<polyline points="385,1311 385,1350" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<polygon points="135,1354.0 234.0,1408 135,1462.0 36.0,1408" fill="#fff5df" stroke="#935411" stroke-width="1.6"/>
<text x="135" y="1416.0" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">依据够吗?</text>
<polygon points="385,1354.0 484.0,1408 385,1462.0 286.0,1408" fill="#fff5df" stroke="#935411" stroke-width="1.6"/>
<text x="385" y="1416.0" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">依据够吗?</text>
<polyline points="135,1462 135,1508" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="151" y="1496" fill="#12665a" font-size="23" font-weight="650" text-anchor="start">是</text>
<polyline points="385,1462 385,1508" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="402" y="1496" fill="#12665a" font-size="23" font-weight="650" text-anchor="start">是</text>
<rect x="38" y="1515" width="194" height="90" fill="#e8f1eb" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="135.0" y="1553.5" fill="#12665a" font-size="23" font-weight="500" text-anchor="middle">潜在影响路径</text>
<text x="135.0" y="1584.5" fill="#12665a" font-size="23" font-weight="500" text-anchor="middle">不等于已宕机</text>
<rect x="288" y="1515" width="194" height="90" fill="#e8f1eb" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="385.0" y="1553.5" fill="#12665a" font-size="23" font-weight="500" text-anchor="middle">跨语料主题</text>
<text x="385.0" y="1584.5" fill="#12665a" font-size="23" font-weight="500" text-anchor="middle">不等于频次</text>
<polyline points="36,1408 8,1408 8,1808 105,1808" fill="none" stroke="#a33332" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="29" y="1689" fill="#a33332" font-size="22" font-weight="400" text-anchor="start">否: 保留已知范围</text>
<polyline points="484,1408 512,1408 512,1808 416,1808" fill="none" stroke="#a33332" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="280" y="1689" fill="#a33332" font-size="22" font-weight="400" text-anchor="start">否: 说明报告缺口</text>
<rect x="110" y="1770" width="300" height="88" fill="#f7eae6" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="1807.5" fill="#a33332" font-size="24" font-weight="500" text-anchor="middle">证据不足出口</text>
<text x="260.0" y="1838.5" fill="#a33332" font-size="24" font-weight="500" text-anchor="middle">不补造关系或结论</text>
<line x1="24" y1="1920" x2="496" y2="1920" stroke="#c8ccca" stroke-width="1.5"/>
<text x="24" y="1945" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">依据: 本文第 7 节的机制与教学案例.</text>
<text x="24" y="1972" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">两跳遍历是案例设计, 非官方固定路径.</text>
<text x="24" y="1999" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">社区聚合资料也要满足访问范围.</text>
</g></svg>