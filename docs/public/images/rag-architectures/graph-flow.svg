<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 2075" role="img" aria-labelledby="title desc"><title id="title">图关系和社区报告怎样分工?</title><desc id="desc">先看离线产物, 再选一条在线路径.|广义 GraphRAG 不强制建立社区报告.</desc>
<defs><marker id="a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#165a80" stroke-width="1.6"/></marker><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#12665a" stroke-width="1.6"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#a33332" stroke-width="1.6"/></marker></defs>
<rect width="520" height="2075" fill="#fcfbf7"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="37" fill="#165a80" font-size="18" font-weight="600" text-anchor="start">RAG / 机制讲义</text>
<text x="24" y="84" fill="#172d3d" font-size="30" font-weight="650" text-anchor="start">图关系和社区报告怎样分工?</text>
<text x="24" y="122" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">先看离线产物, 再选一条在线路径.</text>
<text x="24" y="150" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">广义 GraphRAG 不强制建立社区报告.</text>
<text x="24" y="192" fill="#165a80" font-size="25" font-weight="650" text-anchor="start">离线 / Microsoft 路线概览</text>
<rect x="24" y="220" width="472" height="80" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="269.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">原文 → 文本单元, 保留出处</text>
<polyline points="260,300 260,330" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="24" y="337" width="472" height="87" fill="#eaf2f3" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="374.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">抽取并整理实体与关系</text>
<text x="260.0" y="405.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">每条关系回到原文</text>
<polyline points="260,424 260,455" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="24" y="462" width="472" height="88" fill="#eaf2f3" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="499.5" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">图结构 → 社区分组与报告</text>
<text x="260.0" y="530.5" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">报告是生成摘要, 不是原文</text>
<text x="24" y="601" fill="#165a80" font-size="25" font-weight="650" text-anchor="start">在线 / 根据问题选择, 不是串行</text>
<rect x="24" y="627" width="472" height="76" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="674.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">问题 + 可访问的数据范围</text>
<polyline points="260,703 260,732 135,732 135,773" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<polyline points="260,732 385,732 385,773" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="24" y="779" width="222" height="970" fill="#f1f5f4" stroke="#12665a" stroke-width="1.5"/>
<rect x="274" y="779" width="222" height="970" fill="#f1f4f8" stroke="#165a80" stroke-width="1.5"/>
<text x="135" y="823" fill="#12665a" font-size="27" font-weight="650" text-anchor="middle">局部搜索</text>
<text x="385" y="823" fill="#165a80" font-size="27" font-weight="650" text-anchor="middle">全局搜索</text>
