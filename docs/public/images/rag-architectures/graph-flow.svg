<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 720" role="img" aria-labelledby="title desc"><title id="title">GraphRAG 离线与在线流程</title><desc id="desc">原文到实体关系及社区报告, 在线局部搜索和全局搜索两条路径.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#476380" stroke-width="1.7"/></marker></defs>
<rect width="1010" height="720" rx="20" fill="#f4f7fc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="35" y="48" font-size="27" font-weight="650" text-anchor="start">GraphRAG: 离线建图, 在线分局部与全局</text>
<text x="35" y="90" font-size="22" font-weight="600" text-anchor="start">离线</text>
<rect x="35" y="115" width="195" height="90" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="132.5" y="154.0" font-size="19" font-weight="500" text-anchor="middle">原文</text>
<text x="132.5" y="180.0" font-size="19" font-weight="500" text-anchor="middle">TextUnits</text>
<rect x="285" y="115" width="210" height="90" rx="12" fill="#e7f0ff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="390.0" y="154.0" font-size="19" font-weight="500" text-anchor="middle">实体与关系</text>
<text x="390.0" y="180.0" font-size="19" font-weight="500" text-anchor="middle">来源映射</text>
<rect x="555" y="115" width="180" height="90" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="645.0" y="154.0" font-size="19" font-weight="500" text-anchor="middle">图社区</text>
<text x="645.0" y="180.0" font-size="19" font-weight="500" text-anchor="middle">分组与层级</text>
<rect x="790" y="115" width="175" height="90" rx="12" fill="#fff1de" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="877.5" y="154.0" font-size="19" font-weight="500" text-anchor="middle">社区报告</text>
<text x="877.5" y="180.0" font-size="19" font-weight="500" text-anchor="middle">派生摘要</text>
<polyline points="230,160 280,160" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="495,160 550,160" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="735,160 785,160" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="270" font-size="23" font-weight="600" text-anchor="start">在线: 局部搜索</text>
<rect x="35" y="300" width="250" height="90" rx="12" fill="#e7f0ff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="160.0" y="339.0" font-size="19" font-weight="500" text-anchor="middle">问题中的实体</text>
<text x="160.0" y="365.0" font-size="19" font-weight="500" text-anchor="middle">例如: 支付服务</text>
<rect x="370" y="300" width="250" height="90" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="495.0" y="339.0" font-size="19" font-weight="500" text-anchor="middle">相关实体 / 关系</text>
<text x="495.0" y="365.0" font-size="19" font-weight="500" text-anchor="middle">关联原文与报告</text>
<rect x="705" y="300" width="260" height="90" rx="12" fill="#e9f6ef" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="835.0" y="339.0" font-size="19" font-weight="500" text-anchor="middle">过滤与上下文装载</text>
<text x="835.0" y="365.0" font-size="19" font-weight="500" text-anchor="middle">有来源的回答</text>
<polyline points="285,345 365,345" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,345 700,345" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="390,205 390,250 495,250 495,295" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="455" font-size="23" font-weight="600" text-anchor="start">在线: 全局搜索</text>
<rect x="35" y="485" width="250" height="90" rx="12" fill="#fff1de" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="160.0" y="524.0" font-size="19" font-weight="500" text-anchor="middle">选定层级</text>
<text x="160.0" y="550.0" font-size="19" font-weight="500" text-anchor="middle">社区报告范围</text>
<rect x="370" y="485" width="250" height="90" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="495.0" y="524.0" font-size="19" font-weight="500" text-anchor="middle">Map 分批处理</text>
<text x="495.0" y="550.0" font-size="19" font-weight="500" text-anchor="middle">中间要点与评分</text>
<rect x="705" y="485" width="260" height="90" rx="12" fill="#e9f6ef" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="835.0" y="524.0" font-size="19" font-weight="500" text-anchor="middle">Reduce 汇总</text>
<text x="835.0" y="550.0" font-size="19" font-weight="500" text-anchor="middle">跨语料主题回答</text>
<polyline points="285,530 365,530" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,530 700,530" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="878,205 985,205 985,470 260,470 260,480" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="640" font-size="20" font-weight="400" text-anchor="start">局部: 具体实体与关联事实. 全局: 社区报告的跨语料综合.</text>
<text x="35" y="678" font-size="20" font-weight="400" text-anchor="start">关系与报告均需追踪原文; 依赖不等于事故传播, 摘要不等于精确统计.</text>
</g></svg>