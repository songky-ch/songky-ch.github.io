<text x="385" y="868" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">Q3: 事故主题</text>
<rect x="38" y="907" width="194" height="104" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="135.0" y="952.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">定位支付实体</text>
<text x="135.0" y="983.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">查相关关系</text>
<rect x="288" y="907" width="194" height="104" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="385.0" y="952.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">选社区层级</text>
<text x="385.0" y="983.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">与报告范围</text>
