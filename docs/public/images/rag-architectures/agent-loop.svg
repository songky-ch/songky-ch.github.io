<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 700" role="img" aria-labelledby="title desc"><title id="title">Agent 检索循环</title><desc id="desc">预算检查后的检索观察循环, 以及完成和证据不足两种出口.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#476380" stroke-width="1.7"/></marker></defs>
<rect width="930" height="700" rx="20" fill="#f4f7fc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="35" y="48" font-size="27" font-weight="650" text-anchor="start">Agent 检索循环: 找证据, 查缺口, 受预算约束</text>
<rect x="290" y="85" width="320" height="70" rx="12" fill="#e7f0ff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="450.0" y="127.0" font-size="19" font-weight="500" text-anchor="middle">问题 + 来源范围 + 预算</text>
<rect x="290" y="205" width="320" height="85" rx="12" fill="#fff1de" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="450.0" y="241.5" font-size="19" font-weight="500" text-anchor="middle">检查证据是否足够</text>
<text x="450.0" y="267.5" font-size="19" font-weight="500" text-anchor="middle">选择下一步动作</text>
<polyline points="450,155 450,200" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="355" width="275" height="85" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="172.5" y="391.5" font-size="19" font-weight="500" text-anchor="middle">校验参数 / 权限 / 预算</text>
<text x="172.5" y="417.5" font-size="19" font-weight="500" text-anchor="middle">执行只读检索工具</text>
<polyline points="340,288 172,288 172,350" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="205" y="318" font-size="17" font-weight="400" text-anchor="start">继续找</text>
<rect x="35" y="510" width="275" height="85" rx="12" fill="#ffffff" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="172.5" y="546.5" font-size="19" font-weight="500" text-anchor="middle">观察结果, 记录来源</text>
<text x="172.5" y="572.5" font-size="19" font-weight="500" text-anchor="middle">更新证据和信息缺口</text>
<polyline points="172,440 172,505" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="310,552 450,552 450,293" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="465" y="460" font-size="17" font-weight="400" text-anchor="start">回到决策</text>
<rect x="610" y="355" width="255" height="85" rx="12" fill="#e9f6ef" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="737.5" y="391.5" font-size="19" font-weight="500" text-anchor="middle">证据齐全</text>
<text x="737.5" y="417.5" font-size="19" font-weight="500" text-anchor="middle">生成带出处的答案</text>
<polyline points="560,288 737,288 737,350" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="318" font-size="17" font-weight="400" text-anchor="start">任务完成</text>
<rect x="610" y="510" width="255" height="85" rx="12" fill="#fce8e6" stroke="#9cb2ca" stroke-width="1.5"/>
<text x="737.5" y="546.5" font-size="19" font-weight="500" text-anchor="middle">预算耗尽 / 无新增</text>
<text x="737.5" y="572.5" font-size="19" font-weight="500" text-anchor="middle">报告已知结果与缺口</text>
<polyline points="610,246 895,246 895,552 870,552" fill="none" stroke="#476380" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="667" font-size="19" font-weight="400" text-anchor="start">日志: 工具、参数、返回证据、预算和结束状态. 不要求暴露内部推理.</text>
</g></svg>