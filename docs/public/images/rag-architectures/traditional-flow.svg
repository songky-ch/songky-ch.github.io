<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1450" role="img" aria-labelledby="title desc"><title id="title">固定流程怎样拿到依据?</title><desc id="desc">用 Q1: 支付 E1042 的当次原因走一遍.|实线是处理, 虚线是数据交付.</desc>
<defs><marker id="a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#165a80" stroke-width="1.6"/></marker><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#12665a" stroke-width="1.6"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#a33332" stroke-width="1.6"/></marker></defs>
<rect width="520" height="1450" fill="#fcfbf7"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="37" fill="#165a80" font-size="18" font-weight="600" text-anchor="start">RAG / 机制讲义</text>
<text x="24" y="84" fill="#172d3d" font-size="30" font-weight="650" text-anchor="start">固定流程怎样拿到依据?</text>
<text x="24" y="122" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">用 Q1: 支付 E1042 的当次原因走一遍.</text>
<text x="24" y="150" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">实线是处理, 虚线是数据交付.</text>
<text x="24" y="194" fill="#165a80" font-size="26" font-weight="650" text-anchor="start">离线 / 先把资料准备好</text>
<rect x="24" y="215" width="472" height="480" fill="#f1f4f3" stroke="#a6b6bc" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="92" y="240" width="336" height="75" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="286.5" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">D1 原文 + 版本 + 位置</text>
<polyline points="260,315 260,345" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="92" y="350" width="336" height="85" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="386.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">解析与分块</text>
<text x="260.0" y="417.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">保留错误码和原文出处</text>
<polyline points="260,435 260,465" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="92" y="470" width="336" height="75" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="516.5" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">把片段编码为向量</text>
<polyline points="260,545 260,575" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="92" y="580" width="336" height="85" fill="#eaf2f3" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="616.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">向量索引 + 片段标识</text>
<text x="260.0" y="647.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">原文仍能按标识取回</text>
<text x="24" y="748" fill="#165a80" font-size="26" font-weight="650" text-anchor="start">在线 / 同一个问题按顺序走</text>
<rect x="24" y="775" width="472" height="85" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="811.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">Q1 编码 → 限定范围检索</text>
<text x="260.0" y="842.0" fill="#172d3d" font-size="25" font-weight="500" text-anchor="middle">取回候选 → 选入上下文</text>
<polyline points="428,620 485,620 485,810" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)" stroke-dasharray="7 5"/>
<polyline points="260,860 260,910" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<polygon points="260,913.5 455.0,976 260,1038.5 65.0,976" fill="#fff5df" stroke="#935411" stroke-width="1.6"/>
<text x="260" y="969.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">证据能支持</text>
<text x="260" y="998.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">当次根因吗?</text>
<polyline points="145,1002 132,1068" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="66" y="1060" fill="#12665a" font-size="24" font-weight="650" text-anchor="start">是</text>
<polyline points="375,1002 388,1068" fill="none" stroke="#a33332" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="420" y="1060" fill="#a33332" font-size="24" font-weight="650" text-anchor="start">否</text>
<rect x="24" y="1080" width="225" height="112" fill="#e8f1eb" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="136.5" y="1129.5" fill="#12665a" font-size="25" font-weight="500" text-anchor="middle">生成答案</text>
<text x="136.5" y="1160.5" fill="#12665a" font-size="25" font-weight="500" text-anchor="middle">引用 D1</text>
<rect x="272" y="1080" width="224" height="112" fill="#f7eae6" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="384.0" y="1129.5" fill="#a33332" font-size="25" font-weight="500" text-anchor="middle">报告已知范围</text>
<text x="384.0" y="1160.5" fill="#a33332" font-size="25" font-weight="500" text-anchor="middle">说明缺失证据</text>
<rect x="24" y="1225" width="472" height="107" fill="#fff6df" stroke="#935411" stroke-width="1.5"/>
<text x="42" y="1263" fill="#935411" font-size="24" font-weight="650" text-anchor="start">若 D1 丢失, 按次序查:</text>
<text x="42" y="1300" fill="#172d3d" font-size="23" font-weight="400" text-anchor="start">原文解析 → 候选召回 → 上下文裁剪</text>
<line x1="24" y1="1355" x2="496" y2="1355" stroke="#c8ccca" stroke-width="1.5"/>
<text x="24" y="1380" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">依据: 本文第 3 节. 判定是教学输出要求,</text>
<text x="24" y="1407" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">不声称所有固定 RAG 都内置此项检查.</text>
</g></svg>