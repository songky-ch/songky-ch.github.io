<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1785" role="img" aria-labelledby="title desc"><title id="title">检索智能体怎样交付证据?</title><desc id="desc">按时间从上往下读.|实线是调用, 虚线是资料或证据返回.</desc>
<defs><marker id="a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#165a80" stroke-width="1.6"/></marker><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#12665a" stroke-width="1.6"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#a33332" stroke-width="1.6"/></marker></defs>
<rect width="520" height="1785" fill="#fcfbf7"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="37" fill="#165a80" font-size="18" font-weight="600" text-anchor="start">RAG / 机制讲义</text>
<text x="24" y="84" fill="#172d3d" font-size="30" font-weight="650" text-anchor="start">检索智能体怎样交付证据?</text>
<text x="24" y="122" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">按时间从上往下读.</text>
<text x="24" y="150" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">实线是调用, 虚线是资料或证据返回.</text>
<text x="64" y="205" fill="#165a80" font-size="24" font-weight="650" text-anchor="middle">上层</text>
<line x1="64" y1="225" x2="64" y2="1515" stroke="#9aabb2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="260" y="205" fill="#165a80" font-size="24" font-weight="650" text-anchor="middle">检索智能体</text>
<line x1="260" y1="225" x2="260" y2="1515" stroke="#9aabb2" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="456" y="205" fill="#165a80" font-size="24" font-weight="650" text-anchor="middle">资料工具</text>
<line x1="456" y1="225" x2="456" y2="1515" stroke="#9aabb2" stroke-width="1.5" stroke-dasharray="5 5"/>
<polyline points="64,285 253,285" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="162" y="253" fill="#172d3d" font-size="22" font-weight="500" text-anchor="middle">需求 / 范围</text>
<text x="162" y="318" fill="#172d3d" font-size="22" font-weight="400" text-anchor="middle">调用预算</text>
<polyline points="260,385 449,385" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="358" y="354" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">搜索 E1042</text>
<polyline points="456,475 267,475" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)" stroke-dasharray="7 5"/>
<text x="358" y="446" fill="#12665a" font-size="22" font-weight="500" text-anchor="middle">D1 路径与位置</text>
<polyline points="260,575 449,575" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="358" y="545" fill="#172d3d" font-size="23" font-weight="500" text-anchor="middle">打开 D1 原文</text>
<polyline points="456,665 267,665" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)" stroke-dasharray="7 5"/>
<text x="358" y="636" fill="#12665a" font-size="23" font-weight="500" text-anchor="middle">日期 / 根因</text>
<text x="358" y="704" fill="#12665a" font-size="23" font-weight="400" text-anchor="middle">版本 / 出处</text>
<rect x="24" y="750" width="472" height="114" fill="#eaf2f3" stroke="#165a80" stroke-width="1.5"/>
<text x="42" y="789" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">若原文还有关键引用, 继续查阅.</text>
<text x="42" y="830" fill="#172d3d" font-size="23" font-weight="400" text-anchor="start">先检查预算, 再搜索或打开下一份.</text>
<polygon points="260,916.0 445.0,977 260,1038.0 75.0,977" fill="#fff5df" stroke="#935411" stroke-width="1.6"/>
<text x="260" y="970.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">原文和出处齐全,</text>
<text x="260" y="999.5" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">足以回答这次需求吗?</text>
<polyline points="260,1038 260,1080" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="277" y="1071" fill="#165a80" font-size="24" font-weight="650" text-anchor="start">否</text>
<polygon points="260,1089.0 425.0,1145 260,1201.0 95.0,1145" fill="#fff5df" stroke="#935411" stroke-width="1.6"/>
<text x="260" y="1153.0" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">还有预算与可查线索?</text>
<polyline points="95,1145 17,1145 17,385 253,385" fill="none" stroke="#165a80" stroke-width="2.2" marker-end="url(#a0)" stroke-dasharray="7 5"/>
<text x="31" y="1096" fill="#165a80" font-size="22" font-weight="600" text-anchor="start">是: 继续查</text>
<polyline points="260,1201 260,1243" fill="none" stroke="#a33332" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="277" y="1234" fill="#a33332" font-size="24" font-weight="650" text-anchor="start">否</text>
<rect x="108" y="1250" width="304" height="85" fill="#f7eae6" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="1286.0" fill="#a33332" font-size="24" font-weight="500" text-anchor="middle">不足证据包</text>
<text x="260.0" y="1317.0" fill="#a33332" font-size="24" font-weight="500" text-anchor="middle">已有原文 + 明确缺口</text>
<polyline points="108,1292 64,1292" fill="none" stroke="#a33332" stroke-width="2.2" marker-end="url(#a2)" stroke-dasharray="7 5"/>
<polyline points="445,977 499,977 499,1470 417,1470" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="456" y="1058" fill="#12665a" font-size="24" font-weight="650" text-anchor="start">是</text>
<rect x="108" y="1428" width="304" height="85" fill="#e8f1eb" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="1464.0" fill="#12665a" font-size="24" font-weight="500" text-anchor="middle">充分证据包</text>
<text x="260.0" y="1495.0" fill="#12665a" font-size="24" font-weight="500" text-anchor="middle">原文 + 位置 + 来源</text>
<polyline points="108,1470 64,1470" fill="none" stroke="#12665a" stroke-width="2.2" marker-end="url(#a1)" stroke-dasharray="7 5"/>
<rect x="24" y="1550" width="472" height="101" fill="#fff" stroke="#b3b9bb" stroke-width="1.5"/>
<text x="260.0" y="1594.0" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">上层核对证据后生成最终回答.</text>
<text x="260.0" y="1625.0" fill="#172d3d" font-size="24" font-weight="500" text-anchor="middle">检索智能体的摘要不冒充原文.</text>
<line x1="24" y1="1685" x2="496" y2="1685" stroke="#c8ccca" stroke-width="1.5"/>
<text x="24" y="1710" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">依据: 本文第 6 节的教学职责划分.</text>
<text x="24" y="1737" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">实际搜索工具内部仍可使用索引.</text>
</g></svg>