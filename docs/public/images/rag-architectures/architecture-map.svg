<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1100" role="img" aria-labelledby="title desc"><title id="title">先看分工, 再选组合</title><desc id="desc">这五个名字回答的是不同问题.|四行表示职责, 不是四个执行步骤.</desc>
<defs><marker id="a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#165a80" stroke-width="1.6"/></marker><marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#12665a" stroke-width="1.6"/></marker><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#a33332" stroke-width="1.6"/></marker></defs>
<rect width="520" height="1100" fill="#fcfbf7"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="37" fill="#165a80" font-size="18" font-weight="600" text-anchor="start">RAG / 机制讲义</text>
<text x="24" y="84" fill="#172d3d" font-size="30" font-weight="650" text-anchor="start">先看分工, 再选组合</text>
<text x="24" y="122" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">这五个名字回答的是不同问题.</text>
<text x="24" y="150" fill="#4b5d69" font-size="22" font-weight="400" text-anchor="start">四行表示职责, 不是四个执行步骤.</text>
<rect x="24" y="168" width="5" height="132" fill="#165a80" stroke="#165a80" stroke-width="1.5"/>
<text x="46" y="200" fill="#165a80" font-size="25" font-weight="650" text-anchor="start">01</text>
<text x="99" y="200" fill="#172d3d" font-size="27" font-weight="650" text-anchor="start">流程由谁决定?</text>
<text x="46" y="246" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">传统 RAG: 代码规定先检索后生成</text>
<text x="46" y="280" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">Agentic RAG: 模型按观察选下一步</text>
<line x1="46" y1="310" x2="496" y2="310" stroke="#c8ccca" stroke-width="1.5"/>
<rect x="24" y="333" width="5" height="132" fill="#12665a" stroke="#12665a" stroke-width="1.5"/>
<text x="46" y="365" fill="#12665a" font-size="25" font-weight="650" text-anchor="start">02</text>
<text x="99" y="365" fill="#172d3d" font-size="27" font-weight="650" text-anchor="start">资料怎样找回来?</text>
<text x="46" y="411" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">混合检索: 关键词 + 向量</text>
<text x="46" y="445" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">同一批资料, 两路结果再融合</text>
<line x1="46" y1="475" x2="496" y2="475" stroke="#c8ccca" stroke-width="1.5"/>
<rect x="24" y="498" width="5" height="132" fill="#165a80" stroke="#165a80" stroke-width="1.5"/>
<text x="46" y="530" fill="#165a80" font-size="25" font-weight="650" text-anchor="start">03</text>
<text x="99" y="530" fill="#172d3d" font-size="27" font-weight="650" text-anchor="start">谁负责把证据找全?</text>
<text x="46" y="576" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">Agent-as-retriever: 检索智能体</text>
<text x="46" y="610" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">向上层交付原文, 出处和已知缺口</text>
<line x1="46" y1="640" x2="496" y2="640" stroke="#c8ccca" stroke-width="1.5"/>
<rect x="24" y="663" width="5" height="132" fill="#12665a" stroke="#12665a" stroke-width="1.5"/>
<text x="46" y="695" fill="#12665a" font-size="25" font-weight="650" text-anchor="start">04</text>
<text x="99" y="695" fill="#172d3d" font-size="27" font-weight="650" text-anchor="start">知识怎样组织?</text>
<text x="46" y="741" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">GraphRAG: 实体, 关系和原文</text>
<text x="46" y="775" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">Microsoft 路线另有社区与报告</text>
<line x1="46" y1="805" x2="496" y2="805" stroke="#c8ccca" stroke-width="1.5"/>
<rect x="24" y="865" width="472" height="135" fill="#eaf2f3" stroke="#165a80" stroke-width="1.5"/>
<text x="42" y="904" fill="#165a80" font-size="26" font-weight="650" text-anchor="start">一个可组合的例子</text>
<text x="42" y="945" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">智能体控制 → 调用混合 / 图检索</text>
<text x="42" y="979" fill="#172d3d" font-size="24" font-weight="400" text-anchor="start">缺原文时 → 请检索智能体补证据</text>
<line x1="24" y1="1015" x2="496" y2="1015" stroke="#c8ccca" stroke-width="1.5"/>
<text x="24" y="1040" fill="#4b5d69" font-size="21" font-weight="400" text-anchor="start">本文第 1 节的教学分层, 不代表升级顺序.</text>
</g></svg>