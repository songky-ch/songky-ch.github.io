<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="Deep Agents: 创建对象与执行任务分两步">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="1000" height="650" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">Deep Agents: 创建对象与执行任务分两步</text>
<rect x="36" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">创建阶段</text>
<text x="48" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">create_deep_agent</text>
<text x="48" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">装配工具、文件与摘要</text>
<text x="48" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">按配置加入技能与记忆</text>
<text x="48" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">以及中断处理</text>
<path d="M318,270 L362,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="362" y="145" width="282" height="250" fill="#f0ede5" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="374" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">得到可执行对象</text>
<text x="374" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">create_agent</text>
<text x="374" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">传入 checkpointer 与 s</text>
<text x="374" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">tore</text>
<text x="374" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">此时不等于已执行用户任务</text>
<path d="M644,270 L688,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="688" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="700" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">执行阶段</text>
<text x="700" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">invoke(...) 等入口</text>
<text x="700" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">底层 Agent 循环调用模型</text>
<text x="700" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">与工具</text>
<text x="700" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">按观察继续, 或按状态结束</text>
<rect x="36" y="470" width="934" height="90" fill="#e9edf1" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="502" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">配置边界</text>
<text x="48" y="534" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">文件工具的权限规则, 不等于任意 Shell 命令的隔离; 后端决定真实能力.</text>
<text x="36" y="632" font-size="15" font-weight="400" fill="#617283" text-anchor="start">来源: graph.py, 固定提交 97f856d. 未画整库所有配置分支.</text>
</g></svg>