<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" role="img" aria-label="工具调用: 模型提出请求, 运行时检查并执行">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="1060" height="840" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">工具调用: 模型提出请求, 运行时检查并执行</text>
<text x="135" y="108" font-size="22" font-weight="600" fill="#142d4e" text-anchor="middle">模型</text>
<path d="M135,130 L135,745" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5"/>
<text x="430" y="108" font-size="22" font-weight="600" fill="#142d4e" text-anchor="middle">Agent 运行时</text>
<path d="M430,130 L430,745" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5"/>
<text x="710" y="108" font-size="22" font-weight="600" fill="#142d4e" text-anchor="middle">提前出口</text>
<text x="965" y="108" font-size="22" font-weight="600" fill="#142d4e" text-anchor="middle">业务服务</text>
<path d="M965,130 L965,745" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M430,170 L135,170" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="153" y="155" font-size="19" font-weight="400" fill="#142d4e" text-anchor="start">本轮资料 + 工具说明</text>
<path d="M135,235 L430,235" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="150" y="221" font-size="19" font-weight="400" fill="#142d4e" text-anchor="start">动作请求 c1 与参数</text>
<rect x="346" y="270" width="168" height="56" fill="#edf3f7" stroke="#1761a0" stroke-width="1.5"/>
<text x="358" y="302" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">校验动作</text>
<path d="M514,298 L710,298" fill="none" stroke="#a64031" stroke-width="2" marker-end="url(#a3)"/>
<text x="535" y="280" font-size="17" font-weight="400" fill="#a64031" text-anchor="start">[不允许]</text>
<rect x="710" y="270" width="315" height="88" fill="#f8ebe6" stroke="#a64031" stroke-width="1.5"/>
<text x="722" y="302" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">阻塞: 不执行</text>
<text x="722" y="334" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">后续业务结果未检查</text>
<path d="M430,326 L430,395 L710,395" fill="none" stroke="#617283" stroke-width="2" marker-end="url(#a1)"/>
<text x="460" y="380" font-size="17" font-weight="400" fill="#142d4e" text-anchor="start">[缺少审批]</text>
<rect x="710" y="362" width="315" height="70" fill="#f1ede4" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="722" y="394" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">等待审批</text>
<text x="722" y="426" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">本轮不提交, 新输入后再校验</text>
<path d="M430,326 L430,512 L965,512" fill="none" stroke="#18766e" stroke-width="2" marker-end="url(#a2)"/>
<text x="450" y="492" font-size="18" font-weight="400" fill="#18766e" text-anchor="start">[允许] 执行 c1, 携带业务操作键</text>
<path d="M965,585 L430,585" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
<text x="560" y="568" font-size="19" font-weight="400" fill="#142d4e" text-anchor="start">c1 的真实结果或错误</text>
<path d="M430,665 L135,665" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
<text x="155" y="648" font-size="19" font-weight="400" fill="#142d4e" text-anchor="start">把观察加入下一轮上下文</text>
<path d="M135,700 L80,700 L80,235 L135,235" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="155" y="735" font-size="20" font-weight="400" fill="#142d4e" text-anchor="start">再次决策, 或提出最终回答; 最终回答仍需任务验收.</text>
<text x="36" y="822" font-size="15" font-weight="400" fill="#617283" text-anchor="start">教学图. 沿用原文技术资料与版本, 2026-10-18 核查.</text>
</g></svg>