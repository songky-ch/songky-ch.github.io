<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1030" role="img" aria-label="先看边界: 模型与执行分开">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="380" height="1030" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="20" y="30" font-size="20" font-weight="600" fill="#142d4e" text-anchor="start">先看边界: 模型与执行分开</text>
<rect x="20" y="60" width="340" height="92" fill="#e9edf1" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="85" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">接入层</text>
<text x="32" y="109" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">验证身份、明确任务与限制</text>
<text x="32" y="131" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">登记附件和运行标识</text>
<path d="M190,152 L190,190" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="20" y="190" width="340" height="158" fill="#eff4f7" stroke="#1761a0" stroke-width="1.5"/>
<text x="32" y="215" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">Agent 运行时</text>
<text x="32" y="239" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">组织资料 → 请求模型决策</text>
<text x="32" y="261" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">管理工具调用、进度、预算与暂停</text>
<text x="32" y="283" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">完成后核验事实, 再组织交付</text>
<path d="M190,348 L190,392" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="200" y="376" font-size="13" font-weight="400" fill="#1761a0" text-anchor="start">资料 + 工具说明</text>
<rect x="20" y="392" width="340" height="92" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="417" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">模型服务</text>
<text x="32" y="441" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">返回动作请求或内容</text>
<text x="32" y="463" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">此时接口还没有执行</text>
<path d="M190,484 L190,528" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="200" y="514" font-size="13" font-weight="400" fill="#1761a0" text-anchor="start">交回运行时校验</text>
<rect x="20" y="528" width="340" height="112" fill="white" stroke="#18766e" stroke-width="1.5"/>
<text x="32" y="553" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">工具与业务服务</text>
<text x="32" y="577" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">校验参数、身份和审批</text>
<text x="32" y="599" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">执行真实动作, 返回状态</text>
<text x="32" y="621" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">结果再交回运行时继续判断</text>
<path d="M360,588 L370,588 L370,252 L360,252" fill="none" stroke="#1761a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a0)"/>
<text x="20" y="684" font-size="18" font-weight="600" fill="#142d4e" text-anchor="start">单独保存四种状态</text>
<rect x="20" y="700" width="340" height="40" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="725" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">对话: 消息与工具配对</text>
<rect x="20" y="749" width="340" height="40" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="774" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">运行: 节点、审批与预算</text>
<rect x="20" y="798" width="340" height="40" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="823" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">业务: 订单与退款记录</text>
<rect x="20" y="847" width="340" height="40" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="32" y="872" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">产物: 文件、报告与测试</text>
<text x="20" y="929" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">通用覆盖多类任务.</text>
<text x="20" y="956" font-size="16" font-weight="600" fill="#18766e" text-anchor="start">垂直围绕领域实体、工具和验收.</text>
<text x="20" y="1012" font-size="11" font-weight="400" fill="#617283" text-anchor="start">结构示意, 不是固定执行顺序. 事实核查: 2026-10-18.</text>
</g></svg>