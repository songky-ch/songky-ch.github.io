<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-label="任务范围与自主程度是两回事">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="980" height="640" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">任务范围与自主程度是两回事</text>
<text x="36" y="84" font-size="19" font-weight="400" fill="#617283" text-anchor="start">点代表一种设计方式, 不代表产品永远处在同一个坐标.</text>
<path d="M88,530 L936,530" fill="none" stroke="#617283" stroke-width="2" marker-end="url(#a1)"/>
<path d="M88,530 L88,120" fill="none" stroke="#617283" stroke-width="2" marker-end="url(#a1)"/>
<path d="M510,126 L510,510" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M100,320 L920,320" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="140" cy="173" r="5" fill="#18766e"/>
<text x="156" y="180" font-size="22" font-weight="600" fill="#18766e" text-anchor="start">领域 + 自主: 软件工程 Agent</text>
<text x="156" y="217" font-size="17" font-weight="400" fill="#142d4e" text-anchor="start">动态查代码和测试, 任务仍围绕软件工程</text>
<circle cx="565" cy="173" r="5" fill="#1761a0"/>
<text x="581" y="180" font-size="22" font-weight="600" fill="#1761a0" text-anchor="start">通用 + 自主: 综合任务助手</text>
<text x="581" y="217" font-size="17" font-weight="400" fill="#142d4e" text-anchor="start">组合资料、文件、代码与业务工具</text>
<circle cx="140" cy="378" r="5" fill="#18766e"/>
<text x="156" y="385" font-size="22" font-weight="600" fill="#18766e" text-anchor="start">领域 + 流程: 标准售后</text>
<text x="156" y="422" font-size="17" font-weight="400" fill="#142d4e" text-anchor="start">资格、审批、提交有明确阶段</text>
<circle cx="565" cy="378" r="5" fill="#1761a0"/>
<text x="581" y="385" font-size="22" font-weight="600" fill="#1761a0" text-anchor="start">宽入口 + 多流程: 企业门户</text>
<text x="581" y="422" font-size="17" font-weight="400" fill="#142d4e" text-anchor="start">入口覆盖面广, 具体路径仍可预定义</text>
<text x="95" y="570" font-size="20" font-weight="400" fill="#142d4e" text-anchor="start">领域任务集中</text>
<text x="780" y="570" font-size="20" font-weight="400" fill="#142d4e" text-anchor="start">覆盖多种任务</text>
<text x="105" y="123" font-size="18" font-weight="400" fill="#142d4e" text-anchor="start">更多动态决策</text>
<text x="36" y="622" font-size="15" font-weight="400" fill="#617283" text-anchor="start">教学分类. 通用 / 垂直与自主 / 固定流程分别判断.</text>
</g></svg>