<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="Dify: 工作流节点接上具体策略">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="1000" height="650" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">Dify: 工作流节点接上具体策略</text>
<rect x="36" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">读取工作流上下文</text>
<text x="48" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">经典 AgentNode._run()</text>
<text x="48" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">选择策略</text>
<text x="48" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">用变量池构造参数</text>
<text x="48" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">取得会话与相应凭证</text>
<path d="M318,270 L362,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="362" y="145" width="282" height="250" fill="#f0ede5" stroke="#a9b2b9" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="374" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">执行策略边界</text>
<text x="374" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">strategy.invoke(...)</text>
<text x="374" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">得到消息流</text>
<text x="374" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">策略内部循环本次没有完整</text>
<text x="374" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">追踪</text>
<path d="M644,270 L688,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="688" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="700" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">回到工作流</text>
<text x="700" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">消息转换器处理流</text>
<text x="700" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">生成节点事件与输出</text>
<text x="700" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">相应异常走 FAILED 出口</text>
<path d="M177,395 L177,490 L690,490" fill="none" stroke="#a64031" stroke-width="2" marker-end="url(#a3)"/>
<text x="215" y="471" font-size="19" font-weight="400" fill="#a64031" text-anchor="start">已读路径中的策略解析或调用等异常</text>
<rect x="690" y="455" width="280" height="100" fill="#f8ebe6" stroke="#a64031" stroke-width="1.5"/>
<text x="702" y="487" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">FAILED 节点结果</text>
<text x="702" y="519" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">保留错误, 不伪报完成</text>
<text x="36" y="632" font-size="15" font-weight="400" fill="#617283" text-anchor="start">来源: 经典 AgentNode, 固定提交 b953e69. 不代表新版 Agent 全部实现.</text>
</g></svg>