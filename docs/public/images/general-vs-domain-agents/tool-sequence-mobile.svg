<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1140" role="img" aria-label="一次工具请求怎样真正执行">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="380" height="1140" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="20" y="30" font-size="20" font-weight="600" fill="#142d4e" text-anchor="start">一次工具请求怎样真正执行</text>
<rect x="35" y="65" width="310" height="75" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="90" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">运行时 → 模型</text>
<text x="47" y="114" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">资料与工具说明</text>
<path d="M190,140 L190,175" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="35" y="175" width="310" height="82" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="200" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">模型 → 运行时</text>
<text x="47" y="224" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">请求 c1, 包含工具名和参数</text>
<path d="M190,257 L190,290" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<path d="M190.0 290L300 338.0L190.0 386L80 338.0Z" fill="#eef3f4" stroke="#1761a0" stroke-width="1.5"/>
<text x="190.0" y="344.0" font-size="15" font-weight="600" fill="#142d4e" text-anchor="middle">运行时校验</text>
<path d="M80,338 L22,338 L22,431 L30,431" fill="none" stroke="#a64031" stroke-width="2" marker-end="url(#a3)"/>
<text x="25" y="319" font-size="13" font-weight="400" fill="#a64031" text-anchor="start">不允许</text>
<rect x="30" y="403" width="155" height="90" fill="#f8ebe6" stroke="#a64031" stroke-width="1.5"/>
<text x="42" y="428" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">阻塞</text>
<text x="42" y="452" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">不执行业务动作</text>
<text x="42" y="474" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">业务结果未检查</text>
<path d="M300,338 L355,338 L355,431 L345,431" fill="none" stroke="#617283" stroke-width="2" marker-end="url(#a1)"/>
<text x="303" y="319" font-size="13" font-weight="400" fill="#142d4e" text-anchor="start">缺审批</text>
<rect x="205" y="403" width="140" height="90" fill="#f1ede4" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="212" y="428" font-size="14" font-weight="600" fill="#142d4e" text-anchor="start">等待审批</text>
<text x="212" y="452" font-size="13" font-weight="400" fill="#142d4e" text-anchor="start">本轮不提交</text>
<text x="212" y="470" font-size="13" font-weight="400" fill="#142d4e" text-anchor="start">补齐后再校验</text>
<path d="M190,386 L190,552" fill="none" stroke="#18766e" stroke-width="2" marker-end="url(#a2)"/>
<text x="198" y="527" font-size="14" font-weight="400" fill="#18766e" text-anchor="start">允许执行</text>
<rect x="35" y="552" width="310" height="92" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="577" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">运行时 → 业务服务</text>
<text x="47" y="601" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">执行 c1, 携带原业务操作键</text>
<text x="47" y="623" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">服务端仍要校验身份与业务规则</text>
<path d="M190,644 L190,684" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
<rect x="35" y="684" width="310" height="81" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="709" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">业务服务 → 运行时</text>
<text x="47" y="733" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">返回 c1 的结果或错误</text>
<path d="M190,765 L190,805" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
<rect x="35" y="805" width="310" height="81" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="830" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">运行时 → 模型</text>
<text x="47" y="854" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">把观察加入下一轮上下文</text>
<path d="M345,845 L366,845 L366,215 L345,215" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="35" y="957" width="310" height="92" fill="#e9efed" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="47" y="982" font-size="16" font-weight="600" fill="#142d4e" text-anchor="start">何时交付?</text>
<text x="47" y="1006" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">模型可以提出最终回答</text>
<text x="47" y="1028" font-size="15" font-weight="400" fill="#142d4e" text-anchor="start">运行时仍需按任务标准验收</text>
<text x="20" y="1122" font-size="11" font-weight="400" fill="#617283" text-anchor="start">实线为请求, 虚线为结果. 拒绝与待审批是独立出口.</text>
</g></svg>