<rect width="1000" height="650" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">OpenHands: 会话管进度, Agent 决定动作</text>
<rect x="36" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">会话控制</text>
<text x="48" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">LocalConversation</text>
<text x="48" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">_run()</text>
<text x="48" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">处理运行状态、暂停和确认</text>
<text x="48" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">限制预算与迭代</text>
<path d="M318,270 L362,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="362" y="145" width="282" height="250" fill="#f0ede5" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="374" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">单步决策</text>
<text x="374" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">Agent.step / _step</text>
<text x="374" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">准备本轮历史视图</text>
<text x="374" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">必要时先压缩</text>
<text x="374" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">请求模型, 按响应类型处理</text>
<path d="M644,270 L688,270" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="688" y="145" width="282" height="250" fill="#edf3f7" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="700" y="177" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">动作与观察</text>
<text x="700" y="209" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">_execute_action_event</text>
<text x="700" y="238" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">执行工具, 返回观察</text>
<text x="700" y="267" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">或对应错误事件</text>
<text x="700" y="296" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">用调用标识关联, 交回会话</text>
<path d="M830,395 L830,470 L177,470 L177,395" fill="none" stroke="#617283" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
