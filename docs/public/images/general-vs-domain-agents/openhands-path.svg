<rect x="36" y="510" width="934" height="64" fill="#e9edf1" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="542" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">暂停 / 确认 / 完成 / 预算等状态决定继续或退出</text>
<text x="36" y="632" font-size="15" font-weight="400" fill="#617283" text-anchor="start">来源: 已读本地路径, 固定提交 6ae6407. 不是远程部署全图.</text>
