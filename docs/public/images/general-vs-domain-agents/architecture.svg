<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 885" role="img" aria-label="先看边界: 谁负责判断, 谁真正执行">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1761a0"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617283"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18766e"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a64031"/></marker></defs>
<rect width="1040" height="885" fill="#fbfaf6"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="36" y="47" font-size="28" font-weight="600" fill="#142d4e" text-anchor="start">先看边界: 谁负责判断, 谁真正执行</text>
<text x="36" y="83" font-size="18" font-weight="400" fill="#617283" text-anchor="start">结构图, 蓝线为调用; 虚线表示结果返回. 不把各层排成固定业务顺序.</text>
<rect x="36" y="115" width="968" height="90" fill="#e9edf1" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="147" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">用户入口与接入层</text>
<text x="48" y="179" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">对话 / 接口 / 业务事件 → 验证身份、记录任务与限制</text>
<path d="M520,205 L520,245" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="36" y="245" width="590" height="340" fill="#f1f5f8" stroke="#1761a0" stroke-width="1.5"/>
<text x="58" y="281" font-size="24" font-weight="600" fill="#142d4e" text-anchor="start">Agent 运行时</text>
<rect x="58" y="306" width="546" height="88" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="70" y="338" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">组织本轮资料</text>
<text x="70" y="370" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">指令、历史、领域事实、可用工具与来源</text>
<rect x="58" y="435" width="546" height="110" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="70" y="467" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">管理执行进度</text>
<text x="70" y="499" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">调度下一步、保存状态、暂停、预算和取消</text>
<path d="M332,394 L332,435" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<rect x="700" y="270" width="304" height="110" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="712" y="302" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">模型服务</text>
<text x="712" y="334" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">理解任务, 提出动作</text>
<text x="712" y="363" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">模型不会亲自执行接口</text>
<path d="M604,338 L700,338" fill="none" stroke="#1761a0" stroke-width="2" marker-end="url(#a0)"/>
<text x="630" y="324" font-size="17" font-weight="400" fill="#1761a0" text-anchor="start">输入</text>
<path d="M700,365 L660,365 L660,478 L604,478" fill="none" stroke="#1761a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a0)"/>
<text x="665" y="416" font-size="17" font-weight="400" fill="#617283" text-anchor="start">动作请求</text>
<rect x="700" y="440" width="304" height="130" fill="white" stroke="#18766e" stroke-width="1.5"/>
<text x="712" y="472" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">工具与业务服务</text>
<text x="712" y="504" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">校验参数、身份与授权</text>
<text x="712" y="533" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">执行文件、代码或业务动作</text>
<text x="712" y="562" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">返回真实状态</text>
<path d="M604,508 L700,508" fill="none" stroke="#18766e" stroke-width="2" marker-end="url(#a2)"/>
<path d="M700,550 L650,550 L650,590 L332,590 L332,545" fill="none" stroke="#1761a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a0)"/>
<text x="700" y="610" font-size="20" font-weight="600" fill="#142d4e" text-anchor="start">通用: 组合多类能力</text>
<text x="700" y="642" font-size="20" font-weight="600" fill="#18766e" text-anchor="start">垂直: 领域实体、规则和验收</text>
<text x="36" y="660" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">状态彼此独立, 不能用一份聊天记录替代</text>
<rect x="36" y="670" width="227" height="96" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="48" y="702" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">对话</text>
<text x="48" y="734" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">消息与工具配对</text>
<rect x="283" y="670" width="227" height="96" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="295" y="702" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">运行</text>
<text x="295" y="734" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">节点、审批与预算</text>
<rect x="530" y="670" width="227" height="96" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="542" y="702" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">业务</text>
<text x="542" y="734" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">订单与退款记录</text>
<rect x="777" y="670" width="227" height="96" fill="white" stroke="#a9b2b9" stroke-width="1.5"/>
<text x="789" y="702" font-size="23" font-weight="600" fill="#142d4e" text-anchor="start">产物</text>
<text x="789" y="734" font-size="21" font-weight="400" fill="#142d4e" text-anchor="start">文件、报告与测试</text>
<rect x="36" y="792" width="968" height="45" fill="#e5eeeb" stroke="#18766e" stroke-width="1.5"/>
<text x="52" y="821" font-size="20" font-weight="400" fill="#142d4e" text-anchor="start">出口: 按真实状态与产物验收, 再交付回答、文件及未完成项.</text>
<text x="36" y="867" font-size="15" font-weight="400" fill="#617283" text-anchor="start">教学图. 沿用原文技术资料与版本, 2026-10-18 核查.</text>
</g></svg>