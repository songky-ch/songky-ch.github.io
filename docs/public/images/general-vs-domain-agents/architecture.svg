<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1260" role="img" aria-label="通用与垂直领域 Agent 的架构">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1280" height="1260" fill="#f8fafc" rx="18"/>
<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#172554">
<text x="48" y="52" font-size="30" font-weight="600" text-anchor="start" fill="#172554">共同循环, 不同任务边界与领域约束</text>
<text x="48" y="88" font-size="20" font-weight="400" text-anchor="start" fill="#172554">教学架构, 不代表某个项目的部署拓扑. 两类系统可复用相同模型和运行时.</text>
<rect x="90" y="115" width="1100" height="98" rx="13" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<text x="112" y="150" font-size="23" font-weight="600" text-anchor="start" fill="#172554">接入: 对话 / API / CLI / 业务事件</text>
<text x="112" y="181" font-size="20" font-weight="400" text-anchor="start" fill="#172554">身份与资源归属 → 明确目标和限制 → 建立运行记录</text>
<path d="M590,213 L590,270" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1150,213 L1150,270" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="370" y="248" font-size="24" font-weight="600" text-anchor="middle" fill="#172554">通用 Agent: 多任务组合</text>
<text x="910" y="248" font-size="24" font-weight="600" text-anchor="middle" fill="#172554">垂直领域 Agent: 领域闭环</text>
<rect x="120" y="270" width="500" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="142" y="305" font-size="23" font-weight="600" text-anchor="start" fill="#172554">上下文层</text>
<text x="142" y="336" font-size="20" font-weight="400" text-anchor="start" fill="#172554">按任务选择技能、资料与工具</text>
<text x="142" y="364" font-size="20" font-weight="400" text-anchor="start" fill="#172554">管理历史、文件和上下文长度</text>
<rect x="660" y="270" width="500" height="112" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="682" y="305" font-size="23" font-weight="600" text-anchor="start" fill="#172554">上下文层</text>
<text x="682" y="336" font-size="20" font-weight="400" text-anchor="start" fill="#172554">领域知识 + 实时业务事实</text>
<text x="682" y="364" font-size="20" font-weight="400" text-anchor="start" fill="#172554">领域实体、政策版本与任务限制</text>
<path d="M370,382 L370,410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910,382 L910,410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="410" width="500" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="142" y="445" font-size="23" font-weight="600" text-anchor="start" fill="#172554">编排与模型决策</text>
<text x="142" y="476" font-size="20" font-weight="400" text-anchor="start" fill="#172554">动态选择下一步与子任务</text>
<text x="142" y="504" font-size="20" font-weight="400" text-anchor="start" fill="#172554">循环、预算、暂停与恢复</text>
<rect x="660" y="410" width="500" height="112" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="682" y="445" font-size="23" font-weight="600" text-anchor="start" fill="#172554">编排与模型决策</text>
<text x="682" y="476" font-size="20" font-weight="400" text-anchor="start" fill="#172554">领域工作流 / 自主循环 / 混合</text>
<text x="682" y="504" font-size="20" font-weight="400" text-anchor="start" fill="#172554">关键状态转换受业务条件约束</text>
<path d="M370,522 L370,550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910,522 L910,550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="550" width="500" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="142" y="585" font-size="23" font-weight="600" text-anchor="start" fill="#172554">工具与执行层</text>
<text x="142" y="616" font-size="20" font-weight="400" text-anchor="start" fill="#172554">搜索、文件、代码、浏览器、接口</text>
<text x="142" y="644" font-size="20" font-weight="400" text-anchor="start" fill="#172554">参数、权限、审批与沙箱检查</text>
<rect x="660" y="550" width="500" height="112" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="682" y="585" font-size="23" font-weight="600" text-anchor="start" fill="#172554">工具与执行层</text>
<text x="682" y="616" font-size="20" font-weight="400" text-anchor="start" fill="#172554">领域工具 + 必要的通用工具</text>
<text x="682" y="644" font-size="20" font-weight="400" text-anchor="start" fill="#172554">业务规则、权限、审批与幂等</text>
<path d="M370,662 L370,690" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910,662 L910,690" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="690" width="500" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="142" y="725" font-size="23" font-weight="600" text-anchor="start" fill="#172554">观察与验证</text>
<text x="142" y="756" font-size="20" font-weight="400" text-anchor="start" fill="#172554">读取环境结果, 修订计划</text>
<text x="142" y="784" font-size="20" font-weight="400" text-anchor="start" fill="#172554">按本次目标检查证据与产物</text>
<rect x="660" y="690" width="500" height="112" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="682" y="725" font-size="23" font-weight="600" text-anchor="start" fill="#172554">观察与验证</text>
<text x="682" y="756" font-size="20" font-weight="400" text-anchor="start" fill="#172554">核对业务状态与合法转换</text>
<text x="682" y="784" font-size="20" font-weight="400" text-anchor="start" fill="#172554">按领域完成标准检查结果</text>
<path d="M370,802 L370,830" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910,802 L910,830" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="830" width="500" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="142" y="865" font-size="23" font-weight="600" text-anchor="start" fill="#172554">交付出口</text>
<text x="142" y="896" font-size="20" font-weight="400" text-anchor="start" fill="#172554">回答、文件、报告或代码产物</text>
<text x="142" y="924" font-size="20" font-weight="400" text-anchor="start" fill="#172554">明确成功、等待、阻塞或失败</text>
<rect x="660" y="830" width="500" height="112" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="682" y="865" font-size="23" font-weight="600" text-anchor="start" fill="#172554">交付出口</text>
<text x="682" y="896" font-size="20" font-weight="400" text-anchor="start" fill="#172554">业务状态 + 证据 + 用户解释</text>
<text x="682" y="924" font-size="20" font-weight="400" text-anchor="start" fill="#172554">区分已接收、已确认与已完成</text>
<path d="M120,747 L75,747 L75,466 L120,466" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1160,747 L1205,747 L1205,466 L1160,466" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="36" y="615" font-size="19" font-weight="400" text-anchor="start" fill="#172554">再</text>
<text x="36" y="642" font-size="19" font-weight="400" text-anchor="start" fill="#172554">决</text>
<text x="36" y="669" font-size="19" font-weight="400" text-anchor="start" fill="#172554">策</text>
<text x="1230" y="615" font-size="19" font-weight="400" text-anchor="start" fill="#172554">再</text>
<text x="1230" y="642" font-size="19" font-weight="400" text-anchor="start" fill="#172554">决</text>
<text x="1230" y="669" font-size="19" font-weight="400" text-anchor="start" fill="#172554">策</text>
<text x="90" y="1000" font-size="25" font-weight="600" text-anchor="start" fill="#172554">共同状态底座: 不能只保存聊天记录</text>
<rect x="90" y="1024" width="270" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="112" y="1059" font-size="23" font-weight="600" text-anchor="start" fill="#172554">对话状态</text>
<text x="112" y="1090" font-size="20" font-weight="400" text-anchor="start" fill="#172554">消息与工具配对</text>
<rect x="390" y="1024" width="270" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="412" y="1059" font-size="23" font-weight="600" text-anchor="start" fill="#172554">运行状态</text>
<text x="412" y="1090" font-size="20" font-weight="400" text-anchor="start" fill="#172554">节点、审批、预算</text>
<rect x="690" y="1024" width="270" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="712" y="1059" font-size="23" font-weight="600" text-anchor="start" fill="#172554">业务状态</text>
<text x="712" y="1090" font-size="20" font-weight="400" text-anchor="start" fill="#172554">订单、退款、权限</text>
<rect x="990" y="1024" width="270" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1012" y="1059" font-size="23" font-weight="600" text-anchor="start" fill="#172554">产物状态</text>
<text x="1012" y="1090" font-size="20" font-weight="400" text-anchor="start" fill="#172554">文件、测试、报告</text>
<text x="90" y="1170" font-size="21" font-weight="400" text-anchor="start" fill="#172554">约束落实在执行与业务服务. 检查点保存执行进度, 不自动保证外部事务幂等.</text>
<text x="90" y="1207" font-size="21" font-weight="600" text-anchor="start" fill="#172554">通用 / 垂直 ≠ 自主 / 固定流程 ≠ 单 Agent / 多 Agent.</text>
</g></svg>