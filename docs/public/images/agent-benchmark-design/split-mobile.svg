<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-label="按语义家族切分任务"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="590" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">按语义家族切分任务</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">120 条任务是规模设计, 未提供完整题库</text><rect x="20" y="90" width="320" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">同义改写先归为一组</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">昨天发了多少? / 昨日发货数量?</text><rect x="20" y="280" width="150" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="308" font-size="17" fill="#243633" font-weight="600">开发集 80</text><text x="34" y="334" font-size="14" fill="#52665d" font-weight="400">调整提示词</text><text x="34" y="358" font-size="14" fill="#52665d" font-weight="400">查看失败</text><rect x="190" y="280" width="150" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="204" y="308" font-size="17" fill="#243633" font-weight="600">冻结集 40</text><text x="204" y="334" font-size="14" fill="#52665d" font-weight="400">固定后比较</text><text x="204" y="358" font-size="14" fill="#52665d" font-weight="400">不参与调试</text><path d="M100 200 L95 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M260 200 L265 280" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="467" font-size="17" fill="#243633" font-weight="600">同一家族整体进入一侧.</text><text x="24" y="510" font-size="15" fill="#243633" font-weight="400">冻结题用于调试后, 可保留为回归集,</text><text x="24" y="540" font-size="15" fill="#243633" font-weight="400">独立比较需要新的保留任务.</text></g></svg>