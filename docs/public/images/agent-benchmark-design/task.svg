<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="问题之外, 固定完整任务"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="540" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">问题之外, 固定完整任务</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">D4 教学任务 · 预期留在评测侧</text><rect x="20" y="90" width="716" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">用户输入</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">查昨天 SITE-A / CUSTOMER-X 发货量</text><rect x="20" y="218" width="228" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="246" font-size="19" fill="#243633" font-weight="600">初始条件</text><text x="34" y="272" font-size="16" fill="#52665d" font-weight="400">时钟 / 时区 / 账号 / 数据</text><path d="M134 172 L134 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="264" y="218" width="228" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="278" y="246" font-size="19" fill="#243633" font-weight="600">允许行为</text><text x="278" y="272" font-size="16" fill="#52665d" font-weight="400">工具正确 / 派发一次</text><path d="M378 172 L378 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="508" y="218" width="228" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="522" y="246" font-size="19" fill="#243633" font-weight="600">成功证据</text><text x="522" y="272" font-size="16" fill="#52665d" font-weight="400">数量 / 范围 / 无写入</text><path d="M622 172 L622 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="391" font-size="17" fill="#243633" font-weight="400">运行时只给系统必需输入, 不泄漏答案和判分规则.</text><text x="24" y="432" font-size="17" fill="#243633" font-weight="400">结束后对照独立证据, 不能仅凭回答“成功”.</text></g></svg>