<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-label="每次尝试都从干净起点开始"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="660" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">每次尝试都从干净起点开始</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">重复任务, 不复用脏状态</text><rect x="20" y="90" width="320" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">尝试 1</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="34" y="168" font-size="14" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="34" y="192" font-size="14" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><rect x="20" y="256" width="320" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="284" font-size="17" fill="#243633" font-weight="600">尝试 2</text><text x="34" y="310" font-size="14" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="34" y="334" font-size="14" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="34" y="358" font-size="14" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><rect x="20" y="422" width="320" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="450" font-size="17" fill="#243633" font-weight="600">尝试 3</text><text x="34" y="476" font-size="14" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="34" y="500" font-size="14" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="34" y="524" font-size="14" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><text x="24" y="620" font-size="15" fill="#243633" font-weight="400">清理失败单独记录, 不覆盖原始结果.</text></g></svg>