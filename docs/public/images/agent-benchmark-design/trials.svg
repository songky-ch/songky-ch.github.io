<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="任务和尝试, 分开看分母"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="620" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">任务和尝试, 分开看分母</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">合成快照 · 40 条 × 3 次 = 120 次</text><text x="24" y="100" font-size="17" fill="#243633" font-weight="600">通过</text><rect x="94" y="80" width="465.5" height="26" fill="#73a893" stroke="#d6e1da" rx="6"/><text x="24" y="135" font-size="16" fill="#243633" font-weight="400">98 / 120</text><text x="24" y="206" font-size="17" fill="#243633" font-weight="600">失败</text><rect x="94" y="186" width="85.5" height="26" fill="#d69a84" stroke="#d6e1da" rx="6"/><text x="24" y="241" font-size="16" fill="#243633" font-weight="400">18 / 120</text><text x="24" y="312" font-size="17" fill="#243633" font-weight="600">未知</text><rect x="94" y="292" width="19.0" height="26" fill="#a2b3bf" stroke="#d6e1da" rx="6"/><text x="24" y="347" font-size="16" fill="#243633" font-weight="400">4 / 120</text><rect x="20" y="430" width="716" height="138" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="458" font-size="19" fill="#243633" font-weight="600">换成任务分母以后</text><text x="34" y="484" font-size="16" fill="#52665d" font-weight="400">至少一次通过: 36/40 = 90%</text><text x="34" y="508" font-size="16" fill="#52665d" font-weight="400">三次全部通过: 28/40 = 70%</text><text x="34" y="532" font-size="16" fill="#52665d" font-weight="400">不能把 90% 当成单次成功率</text></g></svg>