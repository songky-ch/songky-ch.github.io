<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-label="每次尝试都从干净起点开始"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="530" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">每次尝试都从干净起点开始</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">重复任务, 不复用脏状态</text><rect x="20" y="100" width="228" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="128" font-size="19" fill="#243633" font-weight="600">尝试 1</text><text x="34" y="154" font-size="16" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="34" y="178" font-size="16" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="34" y="202" font-size="16" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><path d="M134 230 L134 300" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="264" y="100" width="228" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="278" y="128" font-size="19" fill="#243633" font-weight="600">尝试 2</text><text x="278" y="154" font-size="16" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="278" y="178" font-size="16" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="278" y="202" font-size="16" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><path d="M378 230 L378 300" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="508" y="100" width="228" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="522" y="128" font-size="19" fill="#243633" font-weight="600">尝试 3</text><text x="522" y="154" font-size="16" fill="#52665d" font-weight="400">恢复数据 / 账号 / 时钟</text><text x="522" y="178" font-size="16" fill="#52665d" font-weight="400">新会话 / 新工具脚本</text><text x="522" y="202" font-size="16" fill="#52665d" font-weight="400">执行 → 保存证据 → 清理</text><path d="M622 230 L622 300" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="300" width="716" height="98" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="328" font-size="19" fill="#243633" font-weight="600">三个独立记录</text><text x="34" y="354" font-size="16" fill="#52665d" font-weight="400">准备失败 → 阻塞; 证据不足 → 未知; 已知违规 → 失败</text><text x="24" y="456" font-size="16" fill="#243633" font-weight="400">准备一半失败也要清理已创建资源, 只清理本次拥有的数据.</text></g></svg>