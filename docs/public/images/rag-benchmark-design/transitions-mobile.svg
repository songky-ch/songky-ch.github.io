<svg xmlns="http://www.w3.org/2000/svg" width="360" height="545" viewBox="0 0 360 545" role="img" aria-label="总分提升里仍有退化"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="545" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">总分提升里仍有退化</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">合成报告 · 100 条任务均已完成判定</text><text x="112" y="112" font-size="15" fill="#243633" font-weight="600">B 通过</text><text x="228" y="112" font-size="15" fill="#243633" font-weight="600">B 失败</text><text x="22" y="195" font-size="15" fill="#243633" font-weight="600">A 通过</text><text x="22" y="311" font-size="15" fill="#243633" font-weight="600">A 失败</text><rect x="100" y="140" width="106" height="102" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="118" y="182" font-size="28" fill="#243633" font-weight="600">78</text><text x="114" y="218" font-size="14" fill="#243633" font-weight="400">共同通过</text><rect x="216" y="140" width="106" height="102" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="234" y="182" font-size="28" fill="#243633" font-weight="600">4</text><text x="230" y="218" font-size="14" fill="#243633" font-weight="400">退化</text><rect x="100" y="256" width="106" height="102" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="118" y="298" font-size="28" fill="#243633" font-weight="600">8</text><text x="114" y="334" font-size="14" fill="#243633" font-weight="400">改善</text><rect x="216" y="256" width="106" height="102" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="234" y="298" font-size="28" fill="#243633" font-weight="600">10</text><text x="230" y="334" font-size="14" fill="#243633" font-weight="400">仍未通过</text><text x="24" y="413" font-size="19" fill="#243633" font-weight="600">A: 82/100 → B: 86/100</text><text x="24" y="449" font-