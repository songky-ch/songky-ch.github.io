<svg xmlns="http://www.w3.org/2000/svg" width="360" height="805" viewBox="0 0 360 805" role="img" aria-label="模型输入与评测材料分开"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="805" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">模型输入与评测材料分开</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">参考不进入被测提示词</text><rect x="20" y="86" width="320" height="110" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="114" font-size="17" fill="#243633" font-weight="600">被测输入</text><text x="34" y="140" font-size="14" fill="#52665d" font-weight="400">问题 + 受控身份 + 时钟</text><text x="34" y="164" font-size="14" fill="#52665d" font-weight="400">不含参考答案</text><path d="M180 196 L180 230" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="230" width="320" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="258" font-size="17" fill="#243633" font-weight="600">被测应用</text><text x="34" y="284" font-size="14" fill="#52665d" font-weight="400">权限过滤 → 检索 → 回答</text><text x="34" y="308" font-size="14" fill="#52665d" font-weight="400">保存实际上下文与输出</text><path d="M180 340 L180 374" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="374" width="320" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="402" font-size="17" fill="#243633" font-weight="600">运行轨迹</text><text x="34" y="428" font-size="14" fill="#52665d" font-weight="400">证据、回答、状态、错误</text><rect x="20" y="496" width="320" height="110" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="524" font-size="17" fill="#243633" font-weight="600">仅评测端可见</text><text x="34" y="550" font-size="14" fill="#52665d" font-weight="400">独立参考 + 评分规则</text><text x="34" y="574" font-size="14" fill="#52665d" font-weight="400">来自冻结源记录的人工核对</text><path d="M180 606 L180 644" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M20 430 L10 430 L10 696 L20 696" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="644" width="320" height="110" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="672" font-size="17" fill="#243633" font-weight="600">汇合后判定</text><text x="34" y="698" font-size="14" fill="#52665d" font-weight="400">轨迹对照独立参考</text><text x="34" y="722" font-size="14" fill="#52665d" font-weight="400">pass / fail / review</text><text x="24" y="785" font-size="13" fill="#243633" font-weight="400">运行轨迹与参考分别保存, 再关联评分.</text></g></svg>