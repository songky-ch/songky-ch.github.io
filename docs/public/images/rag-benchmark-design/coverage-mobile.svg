<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-label="9 条任务, 多种成功行为"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="590" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">9 条任务, 多种成功行为</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">D3 合成样本 · 预期先于评分</text><rect x="20" y="88" width="320" height="82" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="34" y="113" font-size="15" fill="#243633" font-weight="600">T01–T04, T06</text><text x="168" y="113" font-size="16" fill="#243633" font-weight="600">按证据回答</text><text x="34" y="145" font-size="13" fill="#243633" font-weight="400">字段 / 列表 / 计数 / 关联</text><rect x="20" y="182" width="320" height="82" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="207" font-size="15" fill="#243633" font-weight="600">T05</text><text x="168" y="207" font-size="16" fill="#243633" font-weight="600">保留未知</text><text x="34" y="239" font-size="13" fill="#243633" font-weight="400">根因未确认, 不补写结论</text><rect x="20" y="276" width="320" height="82" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="301" font-size="15" fill="#243633" font-weight="600">T07</text><text x="168" y="301" font-size="16" fill="#243633" font-weight="600">澄清范围</text><text x="34" y="333" font-size="13" fill="#243633" font-weight="400">“前几天”没有默认日期</text><rect x="20" y="370" width="320" height="82" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="395" font-size="15" fill="#243633" font-weight="600">T08</text><text x="168" y="395" font-size="16" fill="#243633" font-weight="600">保护权限</text><text x="34" y="427" font-size="13" fill="#243633" font-weight="400">上下文和回答都不泄漏</text><rect x="20" y="464" width="320" height="82" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="489" font-size="15" fill="#243633" font-weight="600">T09</text><text x="168" y="489" font-size="16" fill="#243633" font-weight="600">表达不可用</text><text x="34" y="521" font-size="13" fill="#243633" font-weight="400">检索超时不等于记录不存在</text><text x="24" y="575" font-size="13" fill="#243633" font-weight="400">T03 还需证明完整范围, 不能只数 Top-K.</text></g></svg>