<svg xmlns="http://www.w3.org/2000/svg" width="360" height="765" viewBox="0 0 360 765" role="img" aria-label="资料修订与公平比较"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="765" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">资料修订与公平比较</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">假想 v2 · 不改写前文 v1 事实</text><rect x="20" y="88" width="320" height="112" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">C102 日期更正</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">v1: 10-20 14:30 → v2: 10-21 08:30</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">发生时间变化, 根因状态仍未确认</text><path d="M180 200 L180 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="232" width="320" height="140" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="260" font-size="17" fill="#243633" font-weight="600">参考随依赖更新</text><text x="34" y="286" font-size="14" fill="#52665d" font-weight="400">T01 时间字段 / T02 列表</text><text x="34" y="310" font-size="14" fill="#52665d" font-weight="400">T03 数量 2 → 1 / T06 昨日集合</text><text x="34" y="334" font-size="14" fill="#52665d" font-weight="400">索引也需从对应快照重新构建</text><text x="24" y="411" font-size="16" fill="#243633" font-weight="600">同一行内比较 A 与 B</text><text x="127" y="445" font-size="18" fill="#243633" font-weight="600">A</text><text x="243" y="445" font-size="18" fill="#243633" font-weight="600">B</text><text x="28" y="501" font-size="18" fill="#243633" font-weight="600">v1</text><rect x="92" y="465" width="106" height="60" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="104" y="501" font-size="16" fill="#243633" font-weight="400">A/v1</text><rect x="208" y="465" width="106" height="60" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="220" y="501" font-size="16" fill="#243633" font-weight="400">B/v1</text><text x="28" y="579" font-size="18" fill="#243633" font-weight="600">v2</text><rect x="92" y="543" width="106" height="60" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="104" y="579" font-size="16" fill="#243633" font-weight="400">A/v2</text><rect x="208" y="543" width="106" height="60" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="220" y="579" font-size="16" fill="#243633" font-weight="400">B/v2</text><text x="24" y="648" font-size="12" fill="#243633" font-weight="400">跨行变化包含资料影响, 不能只归因给算法.</text><text x="24" y="681" font-size="12" fill="#243633" font-weight="400">T04/T05 结论未变, 来源版本仍要复核.</text></g></svg>