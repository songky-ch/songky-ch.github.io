<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-label="模型输入与评测材料分开"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="535" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">模型输入与评测材料分开</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">参考不进入被测提示词</text><rect x="20" y="90" width="330" height="110" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">被测输入</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">问题 + 受控身份 + 时钟</text><text x="34" y="168" font-size="16" fill="#52665d" font-weight="400">不含参考答案</text><path d="M185 200 L185 242" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="242" width="330" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="270" font-size="19" fill="#243633" font-weight="600">被测应用</text><text x="34" y="296" font-size="16" fill="#52665d" font-weight="400">权限过滤 → 检索 → 回答</text><text x="34" y="320" font-size="16" fill="#52665d" font-weight="400">保存上下文、输出与状态</text><rect x="410" y="90" width="330" height="110" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="424" y="118" font-size="19" fill="#243633" font-weight="600">仅评测端可见</text><text x="424" y="144" font-size="16" fill="#52665d" font-weight="400">独立参考 + 评分规则</text><text x="424" y="168" font-size="16" fill="#52665d" font-weight="400">从冻结源记录建立</text><path d="M575 200 L575 395" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M185 352 L185 395" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="395" width="720" height="104" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="423" font-size="19" fill="#243633" font-weight="600">运行轨迹与独立参考汇合</text><text x="34" y="449" font-size="16" fill="#52665d" font-weight="400">按任务行为检查证据, 保留 pass / fail / review</text></g></svg>