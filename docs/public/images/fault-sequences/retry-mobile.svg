<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-label="第一次超时, 第二次成功"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="730" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">第一次超时, 第二次成功</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">示例策略: 最多两次尝试</text><text x="30" y="100" font-size="16" fill="#243633" font-weight="600">包装器</text><path d="M55 118 L55 560" stroke="#b4c4bd" stroke-dasharray="4 4"/><text x="155" y="100" font-size="16" fill="#243633" font-weight="600">fetch</text><path d="M180 118 L180 560" stroke="#b4c4bd" stroke-dasharray="4 4"/><text x="280" y="100" font-size="16" fill="#243633" font-weight="600">pause</text><path d="M305 118 L305 560" stroke="#b4c4bd" stroke-dasharray="4 4"/><path d="M55 150 L180 150" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="138" font-size="14" fill="#243633" font-weight="400">调用 1</text><path d="M180 220 L55 220" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="208" font-size="14" fill="#243633" font-weight="400">抛超时</text><path d="M55 290 L305 290" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="278" font-size="14" fill="#243633" font-weight="400">申请等 0.2 秒</text><path d="M305 360 L55 360" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="348" font-size="14" fill="#243633" font-weight="400">立即返回</text><path d="M55 430 L180 430" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="418" font-size="14" fill="#243633" font-weight="400">调用 2</text><path d="M180 500 L55 500" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="59" y="488" font-size="14" fill="#243633" font-weight="400">返回 2 条记录</text><text x="24" y="602" font-size="16" fill="#243633" font-weight="400">fetch = 2 次, pause = 1 次.</text><text x="24" y="647" font-size="16" fill="#243633" font-weight="400">最终 ok. 图示成功路径,</text><text x="24" y="678" font-size="16" fill="#243633" font-weight="400">连续超时等出口见下一图.</text></g></svg>