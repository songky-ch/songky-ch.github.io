<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="保留策略, 替换依赖"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="560" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">保留策略, 替换依赖</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">D1 示例只读接口 · 不是 Agent 重试</text><rect x="20" y="90" width="716" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">测试输入</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">SITE-A / CUSTOMER-X</text><path d="M378 182 L378 224" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="224" width="716" height="100" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="252" font-size="19" fill="#243633" font-weight="600">真实的重试包装逻辑</text><text x="34" y="278" font-size="16" fill="#52665d" font-weight="400">只对 QueryTimeout 重试一次</text><rect x="20" y="390" width="330" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="418" font-size="19" fill="#243633" font-weight="600">fetch 替身</text><text x="34" y="444" font-size="16" fill="#52665d" font-weight="400">第一次抛超时, 第二次返回数据</text><rect x="406" y="390" width="330" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="420" y="418" font-size="19" fill="#243633" font-weight="600">pause 替身</text><text x="420" y="444" font-size="16" fill="#52665d" font-weight="400">只记录等待请求, 不实际等待</text><path d="M210 324 L185 390" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M550 324 L571 390" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="538" font-size="15" fill="#243633" font-weight="400">断言结果 + 全部调用记录, 不只看成功值.</text></g></svg>