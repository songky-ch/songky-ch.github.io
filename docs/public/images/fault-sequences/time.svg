<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="异常信号不等于真实等待"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="540" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">异常信号不等于真实等待</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">两层测试分别提供证据</text><rect x="20" y="90" width="716" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">逻辑层: 立即抛超时</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">验证异常分支与重试次数</text><text x="34" y="168" font-size="16" fill="#52665d" font-weight="400">不证明网络 3,000 ms 超时生效</text><rect x="20" y="280" width="716" height="130" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="308" font-size="19" fill="#243633" font-weight="600">集成层: 受控延迟服务</text><text x="34" y="334" font-size="16" fill="#52665d" font-weight="400">真实客户端 + 计时 + 超时类型</text><text x="34" y="358" font-size="16" fill="#52665d" font-weight="400">观察配置是否按约定生效</text><text x="24" y="474" font-size="17" fill="#243633" font-weight="600">pause(0.2) 被调用:</text><text x="24" y="505" font-size="15" fill="#243633" font-weight="400">证明申请等待, 不证明实际等了 200 ms.</text></g></svg>