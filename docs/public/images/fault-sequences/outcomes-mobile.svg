<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-label="不同脚本, 不同的正确结果"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="650" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">不同脚本, 不同的正确结果</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">每行独立创建替身, 不共享消费位置</text><text x="28" y="112" font-size="17" fill="#243633" font-weight="600">成功数据</text><text x="28" y="144" font-size="14" fill="#243633" font-weight="400">→ ok / 1 次 / 不等</text><text x="28" y="216" font-size="17" fill="#243633" font-weight="600">超时 → 成功</text><text x="28" y="248" font-size="14" fill="#243633" font-weight="400">→ ok / 2 次 / 等 1 次</text><text x="28" y="320" font-size="17" fill="#243633" font-weight="600">超时 → 超时</text><text x="28" y="352" font-size="14" fill="#243633" font-weight="400">→ unavailable / 2 次 / 等 1 次</text><text x="28" y="424" font-size="17" fill="#243633" font-weight="600">合法空列表</text><text x="28" y="456" font-size="14" fill="#243633" font-weight="400">→ ok / 1 次 / 不等</text><text x="28" y="528" font-size="17" fill="#243633" font-weight="600">返回结构错误</text><text x="28" y="560" font-size="14" fill="#243633" font-weight="400">→ invalid_payload / 1 次 / 不等</text></g></svg>