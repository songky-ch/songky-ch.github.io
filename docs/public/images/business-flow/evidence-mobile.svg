<svg xmlns="http://www.w3.org/2000/svg" width="360" height="521" viewBox="0 0 360 521" role="img" aria-label="同一条记录, 怎样对上证据?"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="521" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">同一条记录, 怎样对上证据?</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">模拟记录 · 唯一标记连接各观察位置</text><rect x="20" y="88" width="320" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">页面输入</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">SITE-A / CUSTOMER-X</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">10-20 09:18 +08:00</text><rect x="20" y="218" width="320" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="246" font-size="17" fill="#243633" font-weight="600">请求载荷</text><text x="34" y="272" font-size="14" fill="#52665d" font-weight="400">SITE-A / CUSTOMER-X</text><text x="34" y="296" font-size="14" fill="#52665d" font-weight="400">10-20 01:18Z</text><rect x="20" y="348" width="320" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="376" font-size="17" fill="#243633" font-weight="600">持久化记录</text><text x="34" y="402" font-size="14" fill="#52665d" font-weight="400">相同业务标识, 字段一致</text><text x="34" y="426" font-size="14" fill="#52665d" font-weight="400">时间转为 UTC 后仍相等</text><path d="M180 194 L180 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180 324 L180 348" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="22" y="486" font-size="14" fill="#243633" font-weight="400">时间表示可转换, 客户关联不能丢失.</text></g></svg>