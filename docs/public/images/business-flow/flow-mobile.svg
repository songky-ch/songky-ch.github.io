<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-label="一条业务, 两次接口调用"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="650" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">一条业务, 两次接口调用</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">模拟链路 · 先创建, 再查询列表</text><rect x="18" y="88" width="205" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="32" y="116" font-size="17" fill="#243633" font-weight="600">① 页面提交</text><text x="32" y="142" font-size="14" fill="#52665d" font-weight="400">输入 → 创建请求</text><path d="M120.5 164 L120.5 196" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="18" y="196" width="205" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="32" y="224" font-size="17" fill="#243633" font-weight="600">② 服务校验</text><text x="32" y="250" font-size="14" fill="#52665d" font-weight="400">身份、权限、字段规则</text><rect x="236" y="196" width="108" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="250" y="224" font-size="17" fill="#243633" font-weight="600">不通过</text><text x="250" y="250" font-size="14" fill="#52665d" font-weight="400">422 / 403</text><text x="250" y="274" font-size="14" fill="#52665d" font-weight="400">不新增记录</text><path d="M223 234 L236 234" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120.5 272 L120.5 308" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.5" y="286.0" font-size="13" fill="#52665d" font-weight="400">通过</text><rect x="18" y="308" width="205" height="76" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="32" y="336" font-size="17" fill="#243633" font-weight="600">③ 保存完成</text><text x="32" y="362" font-size="14" fill="#52665d" font-weight="400">201 + 业务编号</text><path d="M120.5 384 L120.5 424" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="18" y="424" width="326" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="32" y="452" font-size="17" fill="#243633" font-weight="600">④ 页面发起列表查询</text><text x="32" y="478" font-size="14" fill="#52665d" font-weight="400">另一次请求, 重新核对筛选条件</text><path d="M181 514 L181 550" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="18" y="550" width="326" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="32" y="578" font-size="17" fill="#243633" font-weight="600">⑤ 列表返回并展示</text><text x="32" y="604" font-size="14" fill="#52665d" font-weight="400">按业务编号判断是否出现</text></g></svg>