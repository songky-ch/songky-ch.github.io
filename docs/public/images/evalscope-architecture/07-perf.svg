<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title"><title id="title">07 | 压测流水线: 发送请求与统计并行</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="960" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="30" y="44" class="title">07 | 压测流水线: 发送请求与统计并行</text><rect x="40" y="100" width="390" height="105" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="54" y="128" class="h">请求准备</text><text x="54" y="155" class="body">数据插件提供输入; API 插件转换协议.</text><rect x="40" y="290" width="390" height="165" rx="3" fill="#e9f2ff" stroke="#9eb3c8"/><text x="54" y="318" class="h">负载策略 = producer</text><text x="54" y="345" class="body">ClosedLoop: 有空余并发槽再发送.</text><text x="54" y="370" class="body">OpenLoop: 按计划到达时间发送.</text><text x="54" y="395" class="body">HTTP 客户端记录响应与错误.</text><polyline points="235,205 235,290" class="line"/><text x="255" y="248" class="small">构造请求</text><ellipse cx="650" cy="345" rx="170" ry="42" fill="#fff3e2" stroke="#b88a47"/><path d="M480,345 V445 A170,42 0 0 0 820,445 V345" fill="#fff3e2" stroke="#b88a47"/><text x="520" y="405" class="body">异步结果队列</text><text x="520" y="430" class="body">请求记录 / 错误 / token</text><polyline points="430,365 480,365" class="line"/><text x="435" y="345" class="small">写入</text><rect x="480" y="555" width="390" height="130" rx="3" fill="#f0edff" stroke="#9eb3c8"/><text x="494" y="583" class="h">统计 consumer</text><text x="494" y="610" class="body">与 producer 同时启动.</text><text x="494" y="635" class="body">消费队列中的响应, 累积统计.</text><polyline points="650,487 650,555" class="line"/><text x="670" y="525" class="small">持续读取</text><polygon points="235,600.0 415.0,665 235,730.0 55.0,665" fill="#fff3e2" stroke="#c7933e"/><text x="105.0" y="660" class="body">producer 完成, 且</text><text x="105.0" y="685" class="body">队列已经排空?</text><polyline points="235,455 235,600" class="line"/><text x="0" y="0" class="small"></text><polyline points="235,730 235,825 480,825" class="line"/><text x="255" y="797" class="small">是 → 发结束事件</text><polyline points="60,665 25,665 25,350 40,350" class="line"/><text x="30" y="580" class="small">否</text><rect x="480" y="765" width="390" height="120" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="494" y="793" class="h">结束统计 → 报告</text><text x="494" y="820" class="body">TTFT / TPOT / 吞吐 / 错误 / SLA</text><text x="494" y="845" class="body">统计者异常 → 取消相关异步任务.</text><polyline points="650,685 650,765" class="line"/><text x="663" y="723" class="small">收到结束事件后返回</text><rect x="40" y="955" width="830" height="100" rx="3" fill="#ffffff" stroke="#9eb3c8"/><text x="54" y="983" class="h">业务解释</text><text x="54" y="1010" class="body">短告警与长手册输入分别压测; 本图路径来自 perf/core/pipeline.py.</text><text x="54" y="1035" class="body">本次没有执行真实服务压测, 没有生产容量结论.</text></svg>