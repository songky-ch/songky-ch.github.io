<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1180" viewBox="0 0 960 1180" role="img" aria-labelledby="title"><title id="title">06 | 缓存恢复: 真正决定下一步的条件</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="960" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="30" y="44" class="title">06 | 缓存恢复: 真正决定下一步的条件</text><rect x="255" y="85" width="450" height="80" rx="3" fill="#e9f2ff" stroke="#9eb3c8"/><text x="269" y="113" class="h">use_cache → 读取配置快照</text><text x="269" y="140" class="body">先核对本轮评测身份.</text><polygon points="480,185.0 660.0,235 480,285.0 300.0,235" fill="#fff3e2" stroke="#c7933e"/><text x="350.0" y="230" class="body">身份一致, 或显式</text><text x="350.0" y="255" class="body">rerun_review 覆盖?</text><rect x="710" y="195" width="215" height="115" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="724" y="223" class="h">否 → 拒绝复用</text><text x="724" y="250" class="body">抛出身份不匹配错误.</text><text x="724" y="275" class="body">不能悄悄用旧结果.</text><polyline points="660,235 710,235" class="line"/><text x="675" y="223" class="small">否</text><polygon points="480,375.0 660.0,425 480,475.0 300.0,425" fill="#fff3e2" stroke="#c7933e"/><text x="350.0" y="420" class="body">是否有该样本预测?</text><polyline points="480,285 480,375" class="line"/><text x="495" y="333" class="small">是</text><rect x="35" y="380" width="220" height="95" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="49" y="408" class="h">无预测 → 推理</text><text x="49" y="435" class="body">生成后立即保存预测.</text><polyline points="300,425 255,425" class="line"/><text x="267" y="410" class="small">否</text><polygon points="480,565.0 675.0,625 480,685.0 285.0,625" fill="#fff3e2" stroke="#c7933e"/><text x="335.0" y="620" class="body">评分可复用, 且没有</text><text x="335.0" y="645" class="body">要求 rerun_review?</text><polyline points="480,475 480,565" class="line"/><text x="495" y="520" class="small">有预测</text><rect x="715" y="585" width="210" height="100" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="729" y="613" class="h">是 → 直接用评分</text><text x="729" y="640" class="body">不调用被测模型.</text><polyline points="675,625 715,625" class="line"/><text x="683" y="610" class="small">是</text><rect x="255" y="790" width="450" height="100" rx="3" fill="#f0edff" stroke="#9eb3c8"/><text x="269" y="818" class="h">否 → 重新评分</text><text x="269" y="845" class="body">用已有预测计算指标, 再保存评分.</text><polyline points="480,685 480,790" class="line"/><text x="496" y="739" class="small">否</text><polyline points="145,475 145,835 255,835" class="line"/><text x="45" y="730" class="small">新预测也进入评分</text><rect x="255" y="1000" width="450" height="85" rx="3" fill="#e9f2ff" stroke="#9eb3c8"/><text x="269" y="1028" class="h">汇总 AggScore → 生成报告</text><text x="269" y="1055" class="body">首跑 6 次 / 恢复 0 次 / 重评分 0 次模型调用.</text><polyline points="480,890 480,1000" class="line"/><text x="0" y="0" class="small"></text><polyline points="820,685 820,1045 705,1045" class="line"/><text x="0" y="0" class="small"></text><text x="35" y="1140" class="small">异常出口: 评分错误按 ignore_errors 处理; 旧预测可用于后续重评.</text><polyline points="480,165 480,185" class="line"/><text x="0" y="0" class="small"></text><rect x="30" y="920" width="200" height="110" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="44" y="948" class="h">评分异常</text><text x="44" y="975" class="body">默认抛出; 或记错</text><text x="44" y="1000" class="body">并继续其他样本.</text><text x="44" y="1025" class="body">已保存预测保留.</text><polyline points="255,850 130,850 130,920" class="line"/><text x="40" y="885" class="small">评分异常</text></svg>