<svg xmlns="http://www.w3.org/2000/svg" width="420" height="918" viewBox="0 0 420 918" role="img" aria-labelledby="title"><title id="title">发送请求与统计同时工作</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="17" y="42" class="h">发送请求与统计同时工作</text><text x="17" y="71" class="small">窄屏读图 | 各段标签标明关系和分支</text><rect x="16" y="100" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="132" class="h">准备请求</text><text x="30" y="165" class="body">数据插件准备输入; API 插件转换服务协议</text><text x="30" y="190" class="body">.</text><rect x="16" y="245" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="277" class="h">并行角色 A: producer</text><text x="30" y="310" class="body">ClosedLoop 用并发槽限制在途请求; OpenL</text><text x="30" y="335" class="body">oop 按计划时间发送. HTTP 客户端把响应</text><text x="30" y="360" class="body">记录放入队列.</text><rect x="16" y="416" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="448" class="h">并行角色 B: consumer</text><text x="30" y="481" class="body">同时读取异步队列, 累积时延、token 和错</text><text x="30" y="506" class="body">误信息. 它不等待所有请求发完才开始.</text><rect x="16" y="561" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="593" class="h">何时结束?</text><text x="30" y="626" class="body">producer 未完成或队列未排空 → 继续. 两</text><text x="30" y="651" class="body">者均完成 → 发结束事件 → consumer 返回</text><text x="30" y="676" class="body">报告.</text><rect x="16" y="732" width="388" height="143" fill="#f0edff" stroke="#b1c2d4"/><text x="30" y="764" class="h">异常出口</text><text x="30" y="797" class="body">consumer 提前退出或任务异常 → 清理并取</text><text x="30" y="822" class="body">消相关异步任务. 本次未运行真实服务压测</text><text x="30" y="847" class="body">.</text></svg>