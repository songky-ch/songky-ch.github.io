<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1089" viewBox="0 0 420 1089" role="img" aria-labelledby="title"><title id="title">扩展领域任务的最小位置</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="17" y="42" class="h">扩展领域任务的最小位置</text><text x="17" y="71" class="small">窄屏读图 | 各段标签标明关系和分支</text><rect x="16" y="100" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="132" class="h">① 注册领域任务</text><text x="30" y="165" class="body">BenchmarkMeta 约定名称、子集和指标. 自</text><text x="30" y="190" class="body">定义模块必须先被 import, 装饰器才会执</text><text x="30" y="215" class="body">行.</text><rect x="16" y="271" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="303" class="h">② 配置使用该名称</text><text x="30" y="336" class="body">TaskConfig.datasets 填注册名. dataset_</text><text x="30" y="361" class="body">args 指定本地数据路径.</text><rect x="16" y="416" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="448" class="h">③ 适配器写业务差异</text><text x="30" y="481" class="body">record_to_sample 转换题目; match_score</text><text x="30" y="506" class="body"> 按业务规则判分.</text><rect x="16" y="561" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="593" class="h">④ 复用默认行为</text><text x="30" y="626" class="body">数据加载、单轮推理、包装单题分数和子集</text><text x="30" y="651" class="body">聚合. 本次另用报告钩子显式声明自定义指</text><text x="30" y="676" class="body">标语义.</text><rect x="16" y="732" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="764" class="h">⑤ 选择模型连接方式</text><text x="30" y="797" class="body">标准接口用 openai_api; 私有接口写 Mode</text><text x="30" y="822" class="body">lAPI; 多步流程另接工具环境. 本次用 Fix</text><text x="30" y="847" class="body">tureModel.</text><rect x="16" y="903" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="935" class="h">⑥ 保留证据</text><text x="30" y="968" class="body">逐题预测、评分、配置、执行状态. 以 joi</text><text x="30" y="993" class="body">nt_pass 为主指标, 保留其他指标解释失败</text><text x="30" y="1018" class="body">.</text></svg>