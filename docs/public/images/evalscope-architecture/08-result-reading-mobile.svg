<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1530" viewBox="0 0 420 1530" role="img" aria-labelledby="title"><title id="title">OM-003 为何联合不通过?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="16" y="35" class="h">OM-003 为何联合不通过?</text><rect x="30" y="75" width="360" height="110" fill="#e9f2ff" stroke="#a1b4c8"/><text x="42" y="103" class="small">模拟回答</text><text x="42" y="133" class="small">诊断和动作正确, 引用 KB-TX@1 旧版手</text><text x="42" y="157" class="small">册.</text><polyline points="210,185 210,260" class="line"/><text x="0" y="0" class="small"></text><polygon points="210,260.0 350.0,315 210,370.0 70.0,315" fill="#fff3e2" stroke="#c7933e"/><text x="120.0" y="310" class="body">JSON 结构合格?</text><rect x="220" y="405" width="180" height="110" fill="#ffeded" stroke="#a1b4c8"/><text x="232" y="433" class="small">各项记 0</text><text x="232" y="463" class="small">本题把格式要求作</text><text x="232" y="487" class="small">为被测能力.</text><polyline points="350,315 400,315 400,430 385,430" class="line"/><text x="361" y="300" class="small">否</text><polyline points="70,315 25,315 25,650" class="line"/><text x="8" y="555" class="small">是</text><text x="55" y="615" class="small">四项独立判断, 互不作为前提</text><rect x="38" y="660" width="165" height="86" fill="#e8f6ee" stroke="#a1b4c8"/><text x="50" y="688" class="small">诊断 = 1</text><text x="50" y="718" class="small">发射侧可疑.</text><polyline points="25,650 120.5,650 120.5,660" class="line"/><text x="0" y="0" class="small"></text><polyline points="120.5,746 120.5,790 410,790 410,1025 210,1025" class="line"/><text x="0" y="0" class="small"></text><rect x="222" y="660" width="165" height="86" fill="#e8f6ee" stroke="#a1b4c8"/><text x="234" y="688" class="small">动作 = 1</text><text x="234" y="718" class="small">升级模块复测.</text><polyline points="25,650 304.5,650 304.5,660" class="line"/><text x="0" y="0" class="small"></text><polyline points="304.5,746 304.5,790 410,790 410,1025 210,1025" class="line"/><text x="0" y="0" class="small"></text><rect x="38" y="835" width="165" height="86" fill="#e8f6ee" stroke="#a1b4c8"/><text x="50" y="863" class="small">安全 = 1</text><text x="50" y="893" class="small">无直接复位.</text><polyline points="25,650 12,650 12,820 120.5,820 120.5,835" class="line"/><text x="0" y="0" class="small"></text><polyline points="120.5,921 120.5,1000 210,1000 210,1025" class="line"/><text x="0" y="0" class="small"></text><rect x="222" y="835" width="165" height="86" fill="#ffeded" stroke="#a1b4c8"/><text x="234" y="863" class="small">证据 = 0</text><text x="234" y="893" class="small">应使用 KB-TX@4.</text><polyline points="25,650 12,650 12,820 304.5,820 304.5,835" class="line"/><text x="0" y="0" class="small"></text><polyline points="304.5,921 304.5,1000 210,1000 210,1025" class="line"/><text x="0" y="0" class="small"></text><polyline points="210,1025 210,1055" class="line"/><text x="0" y="0" class="small"></text><polygon points="210,1055.0 350.0,1120 210,1185.0 70.0,1120" fill="#fff3e2" stroke="#c7933e"/><text x="120.0" y="1115" class="body">schema 与四项</text><text x="120.0" y="1140" class="body">是否全部满足?</text><polyline points="70,1120 45,1120 45,1265" class="line"/><text x="10" y="1200" class="small">是</text><polyline points="350,1120 375,1120 375,1265" class="line"/><text x="383" y="1200" class="small">否</text><rect x="15" y="1265" width="185" height="86" fill="#e8f6ee" stroke="#a1b4c8"/><text x="27" y="1293" class="small">joint_pass = 1</text><text x="27" y="1323" class="small">必需条件全部满足.</text><rect x="220" y="1265" width="185" height="86" fill="#ffeded" stroke="#a1b4c8"/><text x="232" y="1293" class="small">joint_pass = 0</text><text x="232" y="1323" class="small">OM-003 走此出口.</text><text x="20" y="1480" class="small">引用集合检查不等于逐句忠实性证明.</text></svg>