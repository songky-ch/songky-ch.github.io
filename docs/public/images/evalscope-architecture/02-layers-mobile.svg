<svg xmlns="http://www.w3.org/2000/svg" width="420" height="985" viewBox="0 0 420 985" role="img" aria-labelledby="title"><title id="title">原生评测的职责层次</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="17" y="42" class="h">原生评测的职责层次</text><text x="17" y="71" class="small">窄屏读图 | 各段标签标明关系和分支</text><rect x="16" y="100" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="132" class="h">1. 入口与配置</text><text x="30" y="165" class="body">TaskConfig 描述测谁、题目、生成与评分</text><text x="30" y="190" class="body">方式.</text><rect x="16" y="245" width="388" height="91" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="277" class="h">2. 插件装配</text><text x="30" y="310" class="body">注册表按名称找到任务元数据与适配器.</text><rect x="16" y="364" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="396" class="h">3. 调度</text><text x="30" y="429" class="body">Evaluator 读题、并发执行、缓存分流和持</text><text x="30" y="454" class="body">久化.</text><rect x="16" y="509" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="541" class="h">4. 领域任务</text><text x="30" y="574" class="body">DataAdapter 转换工单、组织推理、提取答</text><text x="30" y="599" class="body">案和计算指标.</text><rect x="16" y="654" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="686" class="h">5. 两类协作组件</text><text x="30" y="719" class="body">模型路径: LazyModel → Model → ModelAPI</text><text x="30" y="744" class="body">. 评分路径: 规则 / 模型裁判 → Score. </text><text x="30" y="769" class="body">它们承担不同职责.</text><rect x="16" y="825" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="857" class="h">6. 输出</text><text x="30" y="890" class="body">SampleScore → AggScore → Report, 保存</text><text x="30" y="915" class="body">逐题证据、执行完整性与日志.</text></svg>