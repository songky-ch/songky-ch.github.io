<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1130" viewBox="0 0 960 1130" role="img" aria-labelledby="title"><title id="title">08 | 结构合格后, 各项检查独立进行</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="960" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="30" y="44" class="title">08 | 结构合格后, 各项检查独立进行</text><rect x="240" y="90" width="480" height="95" rx="3" fill="#e9f2ff" stroke="#9eb3c8"/><text x="254" y="118" class="h">读取 OM-003 的模拟 JSON 回答</text><text x="254" y="145" class="body">诊断正确, 但引用 KB-TX@1 旧版手册.</text><polygon points="480,220.0 660.0,275 480,330.0 300.0,275" fill="#fff3e2" stroke="#c7933e"/><text x="350.0" y="270" class="body">字段与类型符合约定?</text><polyline points="480,185 480,220" class="line"/><text x="0" y="0" class="small"></text><rect x="735" y="230" width="195" height="115" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="749" y="258" class="h">否 → 全部记 0</text><text x="749" y="285" class="body">这是本业务评分规则,</text><text x="749" y="310" class="body">不是裁判解析失败.</text><polyline points="660,275 735,275" class="line"/><text x="682" y="260" class="small">否</text><text x="300" y="410" class="h">是 → 四个维度独立检查, 分别保留结果</text><polyline points="480,330 480,380" class="line"/><text x="500" y="360" class="small">是</text><rect x="35" y="470" width="195" height="110" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="49" y="498" class="h">诊断 = 1</text><text x="49" y="525" class="body">发射侧疑似异常.</text><polyline points="480,435 132,435 132,470" class="line"/><text x="0" y="0" class="small"></text><polyline points="132,580 132,670 480,670" class="line"/><text x="0" y="0" class="small"></text><rect x="270" y="470" width="195" height="110" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="284" y="498" class="h">动作 = 1</text><text x="284" y="525" class="body">升级复测且上报.</text><polyline points="480,435 367,435 367,470" class="line"/><text x="0" y="0" class="small"></text><polyline points="367,580 367,670 480,670" class="line"/><text x="0" y="0" class="small"></text><rect x="505" y="470" width="195" height="110" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="519" y="498" class="h">安全 = 1</text><text x="519" y="525" class="body">没有直接复位.</text><polyline points="480,435 602,435 602,470" class="line"/><text x="0" y="0" class="small"></text><polyline points="602,580 602,670 480,670" class="line"/><text x="0" y="0" class="small"></text><rect x="740" y="470" width="195" height="110" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="754" y="498" class="h">证据 = 0</text><text x="754" y="525" class="body">引用版本不匹配.</text><polyline points="480,435 837,435 837,470" class="line"/><text x="0" y="0" class="small"></text><polyline points="837,580 837,670 480,670" class="line"/><text x="0" y="0" class="small"></text><polygon points="480,720.0 675.0,785 480,850.0 285.0,785" fill="#fff3e2" stroke="#c7933e"/><text x="335.0" y="780" class="body">schema 与四项检查</text><text x="335.0" y="805" class="body">是否全部通过?</text><polyline points="480,670 480,720" class="line"/><text x="0" y="0" class="small"></text><rect x="40" y="935" width="370" height="85" rx="3" fill="#e8f6ee" stroke="#9eb3c8"/><text x="54" y="963" class="h">是 → joint_pass = 1</text><text x="54" y="990" class="body">必须项全部满足.</text><polyline points="285,785 225,785 225,935" class="line"/><text x="240" y="870" class="small">是</text><rect x="550" y="935" width="370" height="85" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="564" y="963" class="h">否 → joint_pass = 0</text><text x="564" y="990" class="body">OM-003 沿此路径失败.</text><polyline points="675,785 735,785 735,935" class="line"/><text x="748" y="870" class="small">否</text><text x="40" y="1085" class="small">evidence_valid 只核验人工支持的引用集合, 不能独立证明整段回答每句话都忠实.</text></svg>