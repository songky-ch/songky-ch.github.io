<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020" role="img" aria-labelledby="title"><title id="title">05 | 扩展一个领域评测, 哪些地方要写代码?</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="960" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="46">05 | 扩展一个领域评测, 哪些地方要写代码?</text>
<rect x="40" y="85" width="410" height="140" rx="12" fill="#f0edff" stroke="#a79bd7" stroke-width="1.5"/>
<text x="58" y="115" class="h">① 注册领域任务</text>
<text x="58" y="144" class="body">@register_benchmark</text>
<text x="58" y="169" class="body">BenchmarkMeta: 名称、指标、子集</text>
<text x="58" y="194" class="body">并让模块在运行前被 import</text>
<rect x="510" y="85" width="410" height="140" rx="12" fill="#e9f2ff" stroke="#80ace5" stroke-width="1.5"/>
<text x="528" y="115" class="h">② 配置任务</text>
<text x="528" y="144" class="body">TaskConfig.datasets</text>
<text x="528" y="169" class="body">填写注册名, dataset_args</text>
<text x="528" y="194" class="body">指定本地数据路径与子集</text>
<rect x="40" y="315" width="880" height="130" rx="12" fill="#e8f6ee" stroke="#73b895" stroke-width="1.5"/>
<text x="58" y="345" class="h">③ 领域 DataAdapter | 本次扩展的主体</text>
<text x="58" y="374" class="body">record_to_sample: 业务工单 → Sample</text>
<text x="58" y="399" class="body">match_score: JSON 答案 + 真值 + metadata → Score</text>
<rect x="40" y="515" width="410" height="165" rx="12" fill="#e9f2ff" stroke="#80ace5" stroke-width="1.5"/>
<text x="58" y="545" class="h">④ 复用框架默认行为</text>
<text x="58" y="574" class="body">load_dataset / run_inference</text>
<text x="58" y="599" class="body">calculate_metrics</text>
<text x="58" y="624" class="body">aggregate_scores</text>
<text x="58" y="649" class="body">generate_report</text>
<rect x="510" y="515" width="410" height="165" rx="12" fill="#fff3e2" stroke="#e0ad62" stroke-width="1.5"/>
<text x="528" y="545" class="h">⑤ 接入被测系统</text>
<text x="528" y="574" class="body">标准接口 → openai_api</text>
<text x="528" y="599" class="body">私有协议 → 自定义 ModelAPI</text>
<text x="528" y="624" class="body">复杂多步 → Agent 适配 / 环境</text>
<text x="528" y="649" class="body">本次: FixtureModel 离线返回答案</text>
<rect x="40" y="770" width="880" height="145" rx="12" fill="#fff" stroke="#c9d5e2" stroke-width="1.5"/>
<text x="58" y="800" class="h">⑥ 让结果能复查</text>
<text x="58" y="829" class="body">保留原始预测、逐题分数、数据版本与执行状态</text>
<text x="58" y="854" class="body">主指标 joint_pass; 各子指标保留, 用来解释失败而非互相抵消</text>
<polyline points="450,155 510,155" class="line"/>
<polyline points="240,225 240,315" class="line"/>
<polyline points="715,225 715,315" class="line"/>
<polyline points="240,445 240,515" class="line"/>
<polyline points="715,445 715,515" class="line"/>
<polyline points="240,680 240,770" class="line"/>
<polyline points="715,680 715,770" class="line"/>
</svg>