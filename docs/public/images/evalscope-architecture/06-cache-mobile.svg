<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1590" viewBox="0 0 420 1590" role="img" aria-labelledby="title"><title id="title">缓存恢复: 条件与去向</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="16" y="35" class="h">缓存恢复: 条件与去向</text><rect x="30" y="75" width="360" height="86" fill="#e9f2ff" stroke="#a1b4c8"/><text x="42" y="103" class="small">开始</text><text x="42" y="133" class="small">use_cache 读取配置快照.</text><polyline points="210,161 210,205" class="line"/><text x="0" y="0" class="small"></text><polygon points="210,205.0 350.0,260 210,315.0 70.0,260" fill="#fff3e2" stroke="#c7933e"/><text x="120.0" y="255" class="body">身份一致或</text><text x="120.0" y="280" class="body">显式覆盖?</text><rect x="220" y="335" width="180" height="110" fill="#ffeded" stroke="#a1b4c8"/><text x="232" y="363" class="small">拒绝复用</text><text x="232" y="393" class="small">抛出身份不匹配错</text><text x="232" y="417" class="small">误.</text><polyline points="350,260 400,260 400,360 385,360" class="line"/><text x="361" y="245" class="small">否</text><polyline points="70,260 35,260 35,505 70,505" class="line"/><text x="19" y="410" class="small">是</text><polygon points="210,450.0 350.0,505 210,560.0 70.0,505" fill="#fff3e2" stroke="#c7933e"/><text x="120.0" y="500" class="body">有样本预测?</text><rect x="45" y="595" width="170" height="86" fill="#e9f2ff" stroke="#a1b4c8"/><text x="57" y="623" class="small">先推理</text><text x="57" y="653" class="small">保存新预测.</text><polyline points="70,505 30,505 30,630 45,630" class="line"/><text x="20" y="590" class="small">否</text><polyline points="350,505 390,505 390,785 350,785" class="line"/><text x="365" y="660" class="small">是</text><polygon points="210,722.5 350.0,785 210,847.5 70.0,785" fill="#fff3e2" stroke="#c7933e"/><text x="120.0" y="780" class="body">评分可复用且</text><text x="120.0" y="805" class="body">未要求重评?</text><rect x="45" y="925" width="170" height="86" fill="#e8f6ee" stroke="#a1b4c8"/><text x="57" y="953" class="small">直接用旧评分</text><text x="57" y="983" class="small">不调用模型.</text><polyline points="70,785 25,785 25,955 45,955" class="line"/><text x="8" y="880" class="small">是</text><rect x="225" y="925" width="175" height="110" fill="#f0edff" stroke="#a1b4c8"/><text x="237" y="953" class="small">重新评分</text><text x="237" y="983" class="small">复用预测, 不调用</text><text x="237" y="1007" class="small">被测模型.</text><polyline points="210,848 210,895 310,895 310,925" class="line"/><text x="235" y="884" class="small">否</text><polyline points="130,681 130,705 15,705 15,895 310,895 310,925" class="line"/><text x="110" y="885" class="small">新预测</text><polyline points="130,1011 130,1160 210,1160 210,1200" class="line"/><text x="0" y="0" class="small"></text><polyline points="310,1035 310,1160 210,1160" class="line"/><text x="0" y="0" class="small"></text><rect x="30" y="1200" width="360" height="110" fill="#e9f2ff" stroke="#a1b4c8"/><text x="42" y="1228" class="small">聚合并生成报告</text><text x="42" y="1258" class="small">首跑模型调用 6 次; 恢复 0 次; 重评分</text><text x="42" y="1282" class="small"> 0 次.</text><rect x="30" y="1410" width="360" height="110" fill="#ffeded" stroke="#a1b4c8"/><text x="42" y="1438" class="small">评分失败出口</text><text x="42" y="1468" class="small">默认抛出; 或按 ignore_errors 记录后</text><text x="42" y="1492" class="small">继续. 已有预测保留.</text><polyline points="400,1000 410,1000 410,1385 210,1385 210,1410" class="line"/><text x="315" y="1350" class="small">评分异常</text></svg>