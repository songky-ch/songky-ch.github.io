<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1090" viewBox="0 0 960 1090" role="img" aria-labelledby="title"><title id="title">03 | 单条工单的角色协作与失败出口</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="960" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="30" y="44" class="title">03 | 单条工单的角色协作与失败出口</text><text x="40" y="95" class="h">评测调度</text><line x1="105" y1="120" x2="105" y2="870" stroke="#b3c2d2" stroke-dasharray="5 5"/><text x="285" y="95" class="h">领域适配器</text><line x1="350" y1="120" x2="350" y2="870" stroke="#b3c2d2" stroke-dasharray="5 5"/><text x="545" y="95" class="h">被测模型</text><line x1="610" y1="120" x2="610" y2="870" stroke="#b3c2d2" stroke-dasharray="5 5"/><text x="775" y="95" class="h">结果文件</text><line x1="840" y1="120" x2="840" y2="870" stroke="#b3c2d2" stroke-dasharray="5 5"/><polyline points="105,160 350,160" class="line"/><text x="115" y="148" class="small">① run_inference(sample)</text><polyline points="350,230 610,230" class="line"/><text x="365" y="218" class="small">② generate(input, tools)</text><polyline points="610,305 350,305" class="line"/><text x="395" y="293" class="small">③ ModelOutput</text><polyline points="350,375 105,375" class="line"/><text x="150" y="363" class="small">④ TaskState</text><polyline points="105,445 840,445" class="line"/><text x="380" y="433" class="small">⑤ 先保存预测</text><polyline points="105,535 350,535" class="line"/><text x="115" y="523" class="small">⑥ calculate_metrics</text><polyline points="350,615 105,615" class="line"/><text x="150" y="603" class="small">⑦ SampleScore</text><polyline points="105,690 840,690" class="line"/><text x="320" y="678" class="small">⑧ 保存评分; 子集完成后聚合</text><polyline points="105,805 840,805" class="line"/><text x="305" y="793" class="small">⑨ 生成 Report + 执行完整性</text><rect x="470" y="105" width="435" height="78" rx="3" fill="#f0edff" stroke="#9eb3c8"/><text x="484" y="133" class="h">真值不发送给被测模型</text><text x="484" y="160" class="body">target 与评分 metadata 由评测侧持有.</text><rect x="430" y="900" width="475" height="110" rx="3" fill="#ffeded" stroke="#9eb3c8"/><text x="444" y="928" class="h">评分失败 → 保留已有预测</text><text x="444" y="955" class="body">ignore_errors=False: 抛出异常并结束.</text><text x="444" y="980" class="body">ignore_errors=True: 记错并继续其他题.</text><polyline points="350,550 395,550 395,945 430,945" class="line"/><text x="405" y="857" class="small">评分异常</text><text x="35" y="1045" class="small">批量评分例外: 第⑥⑦步延至 BatchReviewer. 箭头表示调用或数据返回.</text></svg>