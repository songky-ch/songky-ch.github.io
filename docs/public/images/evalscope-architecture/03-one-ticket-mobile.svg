<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1220" viewBox="0 0 420 1220" role="img" aria-labelledby="title"><title id="title">工单调用顺序与异常出口</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="16" y="35" class="h">工单调用顺序与异常出口</text><text x="22" y="85" class="small">调度</text><line x1="45" y1="105" x2="45" y2="840" stroke="#b8c7d5" stroke-dasharray="5 4"/><text x="172" y="85" class="small">适配器</text><line x1="195" y1="105" x2="195" y2="840" stroke="#b8c7d5" stroke-dasharray="5 4"/><text x="332" y="85" class="small">模型</text><line x1="355" y1="105" x2="355" y2="840" stroke="#b8c7d5" stroke-dasharray="5 4"/><polyline points="45,155 195,155" class="line"/><text x="48" y="138" class="small">① run_inference</text><polyline points="195,235 355,235" class="line"/><text x="215" y="218" class="small">② generate</text><polyline points="355,315 195,315" class="line"/><text x="218" y="298" class="small">③ 模型输出</text><polyline points="195,395 45,395" class="line"/><text x="50" y="378" class="small">④ TaskState</text><polyline points="45,475 120,475" class="line"/><text x="130" y="480" class="small">⑤ 先保存预测</text><polyline points="45,565 195,565" class="line"/><text x="48" y="548" class="small">⑥ 计算分数</text><polyline points="195,655 45,655" class="line"/><text x="48" y="638" class="small">⑦ 单题分数</text><polyline points="45,745 120,745" class="line"/><text x="130" y="750" class="small">⑧ 保存评分, 再汇总</text><rect x="16" y="870" width="388" height="110" fill="#ffeded" stroke="#a1b4c8"/><text x="28" y="898" class="small">评分异常出口</text><text x="28" y="928" class="small">默认抛出异常结束; 开启 ignore_errors 时</text><text x="28" y="952" class="small">记错并继续其他题. 已保存预测保留.</text><polyline points="195,585 397,585 397,850 210,850 210,870" class="line"/><text x="320" y="830" class="small">异常</text><rect x="16" y="1055" width="388" height="110" fill="#f0edff" stroke="#a1b4c8"/><text x="28" y="1083" class="small">输入边界与批量例外</text><text x="28" y="1113" class="small">target 留在评测侧. 批量评分任务把⑥⑦延至 </text><text x="28" y="1137" class="small">BatchReviewer.</text></svg>