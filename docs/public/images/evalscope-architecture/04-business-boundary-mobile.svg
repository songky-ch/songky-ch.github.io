<svg xmlns="http://www.w3.org/2000/svg" width="420" height="773" viewBox="0 0 420 773" role="img" aria-labelledby="title"><title id="title">三种评测各自看什么</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="17" y="42" class="h">三种评测各自看什么</text><text x="17" y="71" class="small">窄屏读图 | 各段标签标明关系和分支</text><rect x="16" y="100" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="132" class="h">A. 静态问答</text><text x="30" y="165" class="body">工单 + 给定手册片段 → 模型回答 → 与真</text><text x="30" y="190" class="body">值比较. 本次实测到这一层.</text><rect x="16" y="245" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="277" class="h">B. 增加真实检索</text><text x="30" y="310" class="body">工单 → 检索器 → 手册片段 → 回答. 保存</text><text x="30" y="335" class="body">找到的资料, 才能区分检索错和生成错. 可</text><text x="30" y="360" class="body">接 RAGEval → RAGAS.</text><rect x="16" y="416" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="448" class="h">C. 增加多步工具</text><text x="30" y="481" class="body">read_dom → 查手册 → 对端查询 → 维护判</text><text x="30" y="506" class="body">断 → 模拟操作 → 复核. AgentLoop 或适配</text><text x="30" y="531" class="body">器保存轨迹和环境状态.</text><rect x="16" y="587" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="619" class="h">不同证据</text><text x="30" y="652" class="body">问答看结论; 检索问答还看依据; 工具流程</text><text x="30" y="677" class="body">再看实际动作和状态. B/C 是接入设计, 本</text><text x="30" y="702" class="body">次未做端到端实测.</text></svg>