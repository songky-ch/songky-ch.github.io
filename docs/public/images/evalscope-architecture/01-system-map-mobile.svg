<svg xmlns="http://www.w3.org/2000/svg" width="420" height="866" viewBox="0 0 420 866" role="img" aria-labelledby="title"><title id="title">三条主路线</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker></defs><rect width="420" height="100%" fill="#f5f8fc"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17334d} .title{font-size:27px;font-weight:700} .h{font-size:20px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{stroke:#526477;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style><text x="17" y="42" class="h">三条主路线</text><text x="17" y="71" class="small">窄屏读图 | 各段标签标明关系和分支</text><rect x="16" y="100" width="388" height="91" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="132" class="h">入口</text><text x="30" y="165" class="body">run_task / 命令行 / 服务界面</text><rect x="16" y="219" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="251" class="h">路线 A: 原生质量评测</text><text x="30" y="284" class="body">配置 → 领域任务 → 样本调度 → 模型回答 </text><text x="30" y="309" class="body">→ 规则或裁判评分 → 报告</text><rect x="16" y="364" width="388" height="117" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="396" class="h">路线 B: 独立性能压测</text><text x="30" y="429" class="body">数据插件与 API 插件 → 负载策略 → HTTP </text><text x="30" y="454" class="body">请求 → 异步统计 → 性能报告</text><rect x="16" y="509" width="388" height="143" fill="#e9f2ff" stroke="#b1c2d4"/><text x="30" y="541" class="h">路线 C: 第三方后端</text><text x="30" y="574" class="body">后端管理器 → OpenCompass / VLMEvalKit </text><text x="30" y="599" class="body">/ RAGEval. RAGEval 可调用 RAGAS 或 MTE</text><text x="30" y="624" class="body">B.</text><rect x="16" y="680" width="388" height="143" fill="#f0edff" stroke="#b1c2d4"/><text x="30" y="712" class="h">业务边界</text><text x="30" y="745" class="body">光模块维护助手是被测对象. 业务真值、工</text><text x="30" y="770" class="body">具环境与验收规则由业务方提供. 三条路线</text><text x="30" y="795" class="body">是入口的并列选择, 不依次执行.</text></svg>