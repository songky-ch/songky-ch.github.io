<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-label="同一入口, 不同的正确出口"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="630" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">同一入口, 不同的正确出口</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">教学规则 · 不按单个关键词决定路径</text><rect x="20" y="90" width="716" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">请求是否清楚且在范围内?</text><path d="M570 166 L570 202" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="577.0" y="180.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="412" y="202" width="324" height="82" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="426" y="230" font-size="19" fill="#243633" font-weight="600">澄清 / 能力范围外</text><text x="426" y="256" font-size="16" fill="#52665d" font-weight="400">说明原因, 结束本轮</text><path d="M190 166 L190 324" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="197.0" y="241.0" font-size="13" fill="#52665d" font-weight="400">是: 选择路径</text><rect x="20" y="324" width="224" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="352" font-size="19" fill="#243633" font-weight="600">通用问答</text><text x="34" y="378" font-size="16" fill="#52665d" font-weight="400">概念解释</text><text x="34" y="402" font-size="16" fill="#52665d" font-weight="400">直接回答</text><rect x="266" y="324" width="224" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="280" y="352" font-size="19" fill="#243633" font-weight="600">知识检索</text><text x="280" y="378" font-size="16" fill="#52665d" font-weight="400">有依据 → 据片段答</text><text x="280" y="402" font-size="16" fill="#52665d" font-weight="400">无依据 / 失败 → 说明</text><rect x="512" y="324" width="224" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="526" y="352" font-size="19" fill="#243633" font-weight="600">业务工具</text><text x="526" y="378" font-size="16" fill="#52665d" font-weight="400">校验失败 → 拒绝</text><text x="526" y="402" font-size="16" fill="#52665d" font-weight="400">通过 → 执行一次</text><path d="M190 309 L132 324" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190 309 L378 324" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M190 309 L624 324" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M624 450 L624 486" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="631.0" y="464.0" font-size="13" fill="#52665d" font-weight="400">返回</text><rect x="412" y="486" width="324" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="426" y="514" font-size="19" fill="#243633" font-weight="600">工具结果出口</text><text x="426" y="540" font-size="16" fill="#52665d" font-weight="400">成功 → 根据结果回答</text><text x="426" y="564" font-size="16" fill="#52665d" font-weight="400">失败 → 说明错误, 不冒充成功</text><text x="24" y="612" font-size="17" fill="#243633" font-weight="400">零次业务派发也可能是正确处理. 检索次数单独记录.</text></g></svg>