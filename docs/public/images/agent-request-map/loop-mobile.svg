<svg xmlns="http://www.w3.org/2000/svg" width="360" height="940" viewBox="0 0 360 940" role="img" aria-label="一次结束, 与观察后再决定"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="940" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">一次结束, 与观察后再决定</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">下方为拓展学习, 不是当前系统能力</text><rect x="20" y="90" width="320" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">当前: 单次调用</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">决策 → 校验 → 一次执行 → 结束</text><text x="24" y="230" font-size="18" fill="#243633" font-weight="600">拓展: 根据观察继续决定</text><rect x="20" y="252" width="200" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="280" font-size="17" fill="#243633" font-weight="600">决策</text><rect x="248" y="252" width="92" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="262" y="280" font-size="17" fill="#243633" font-weight="600">完成</text><path d="M220 292 L248 292" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120 334 L120 382" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="354.0" font-size="13" fill="#52665d" font-weight="400">动作</text><rect x="20" y="382" width="200" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="410" font-size="17" fill="#243633" font-weight="600">预算与权限</text><text x="34" y="436" font-size="14" fill="#52665d" font-weight="400">允许 → 继续</text><rect x="248" y="382" width="92" height="104" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="262" y="410" font-size="17" fill="#243633" font-weight="600">停止</text><text x="262" y="436" font-size="14" fill="#52665d" font-weight="400">超限/拒绝</text><path d="M220 430 L248 430" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120 486 L120 532" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="505.0" font-size="13" fill="#52665d" font-weight="400">允许</text><rect x="20" y="532" width="200" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="560" font-size="17" fill="#243633" font-weight="600">执行动作</text><rect x="248" y="532" width="92" height="104" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="262" y="560" font-size="17" fill="#243633" font-weight="600">停止</text><text x="262" y="586" font-size="14" fill="#52665d" font-weight="400">失败</text><path d="M220 580 L248 580" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M120 636 L120 686" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="657.0" font-size="13" fill="#52665d" font-weight="400">成功</text><rect x="20" y="686" width="200" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="714" font-size="17" fill="#243633" font-weight="600">观察结果</text><path d="M120 780 L120 850 L352 850 L352 242 L120 242 L120 252" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="899" font-size="16" fill="#243633" font-weight="400">观察更新上下文后, 再做下一次决策.</text></g></svg>