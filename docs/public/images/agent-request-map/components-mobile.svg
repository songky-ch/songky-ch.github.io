<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" role="img" aria-label="Agent 请求里的组件分工"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="740" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">Agent 请求里的组件分工</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">示例架构 · 决策与执行分开</text><rect x="16" y="84" width="328" height="432" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="30" y="112" font-size="18" fill="#243633" font-weight="600">应用控制边界</text><rect x="30" y="132" width="300" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="44" y="160" font-size="17" fill="#243633" font-weight="600">输入与上下文</text><text x="44" y="186" font-size="14" fill="#52665d" font-weight="400">用户文字 + 时钟 + 提示词</text><path d="M180 220 L180 254" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="233.0" font-size="13" fill="#52665d" font-weight="400">交给模型</text><rect x="30" y="254" width="300" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="44" y="282" font-size="17" fill="#243633" font-weight="600">模型提出决策</text><text x="44" y="308" font-size="14" fill="#52665d" font-weight="400">问答 / 检索 / 业务工具</text><path d="M180 342 L180 376" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="355.0" font-size="13" fill="#52665d" font-weight="400">交回应用</text><rect x="30" y="376" width="300" height="116" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="44" y="404" font-size="17" fill="#243633" font-weight="600">执行器与请求状态</text><text x="44" y="430" font-size="14" fill="#52665d" font-weight="400">校验、权限、调用预算</text><text x="44" y="454" font-size="14" fill="#52665d" font-weight="400">保留事件与结果</text><path d="M180 516 L180 550" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="529.0" font-size="13" fill="#52665d" font-weight="400">允许后执行</text><rect x="20" y="550" width="320" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="578" font-size="17" fill="#243633" font-weight="600">知识库 / 业务服务</text><text x="34" y="604" font-size="14" fill="#52665d" font-weight="400">提供证据, 或返回错误</text><path d="M180 632 L180 664" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="644.0" font-size="13" fill="#52665d" font-weight="400">结果回到应用</text><text x="28" y="695" font-size="16" fill="#243633" font-weight="400">应用依据证据组织回答并结束.</text></g></svg>