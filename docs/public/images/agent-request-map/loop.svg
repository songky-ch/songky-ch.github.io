<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-label="一次结束, 与观察后再决定"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="580" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">一次结束, 与观察后再决定</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">右侧为拓展学习, 不是当前系统能力</text><rect x="20" y="100" width="236" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="128" font-size="19" fill="#243633" font-weight="600">当前: 单次调用</text><text x="34" y="154" font-size="16" fill="#52665d" font-weight="400">决策 → 校验 → 执行</text><text x="34" y="178" font-size="16" fill="#52665d" font-weight="400">一次结束, 不自行追加</text><rect x="318" y="100" width="220" height="78" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="332" y="128" font-size="19" fill="#243633" font-weight="600">拓展: 决策</text><rect x="590" y="100" width="146" height="78" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="604" y="128" font-size="19" fill="#243633" font-weight="600">完成</text><path d="M538 139 L590 139" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="571.0" y="135.0" font-size="13" fill="#52665d" font-weight="400">结束</text><rect x="318" y="228" width="220" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="332" y="256" font-size="19" fill="#243633" font-weight="600">预算与权限</text><rect x="590" y="228" width="146" height="90" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="604" y="256" font-size="19" fill="#243633" font-weight="600">停止</text><text x="604" y="282" font-size="16" fill="#52665d" font-weight="400">超限 / 拒绝</text><path d="M428 178 L428 228" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="435.0" y="199.0" font-size="13" fill="#52665d" font-weight="400">动作</text><path d="M538 270 L590 270" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="318" y="364" width="220" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="332" y="392" font-size="19" fill="#243633" font-weight="600">执行动作</text><rect x="590" y="364" width="146" height="90" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="604" y="392" font-size="19" fill="#243633" font-weight="600">停止</text><text x="604" y="418" font-size="16" fill="#52665d" font-weight="400">执行失败</text><path d="M428 318 L428 364" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="435.0" y="337.0" font-size="13" fill="#52665d" font-weight="400">允许</text><path d="M538 407 L590 407" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="364" width="236" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="392" font-size="19" fill="#243633" font-weight="600">观察结果</text><text x="34" y="418" font-size="16" fill="#52665d" font-weight="400">更新上下文</text><path d="M318 409 L256 409" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="294.0" y="405.0" font-size="13" fill="#52665d" font-weight="400">成功</text><path d="M138 454 L138 518 L292 518 L292 139 L318 139" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="561" font-size="17" fill="#243633" font-weight="400">回路回到决策, 完成、超限和执行失败都有停止出口.</text></g></svg>