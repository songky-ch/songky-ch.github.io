<svg xmlns="http://www.w3.org/2000/svg" width="360" height="890" viewBox="0 0 360 890" role="img" aria-label="同一入口, 不同的正确出口"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="890" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">同一入口, 不同的正确出口</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">教学规则 · 不按单个关键词决定路径</text><rect x="20" y="90" width="320" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">请求是否清楚且在范围内?</text><path d="M70 166 L70 202" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="77.0" y="180.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="202" width="320" height="90" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="230" font-size="17" fill="#243633" font-weight="600">澄清 / 说明能力边界</text><text x="34" y="256" font-size="14" fill="#52665d" font-weight="400">信息不足 / 不支持, 本轮结束</text><path d="M350 166 L350 690" fill="none" stroke="#738980" stroke-width="1.8"/><path d="M290 166 L350 166" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="327.0" y="162.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="328" width="320" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="356" font-size="17" fill="#243633" font-weight="600">通用问答</text><text x="34" y="382" font-size="14" fill="#52665d" font-weight="400">解释概念 → 直接回答</text><path d="M350 362 L340 362" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="480" width="320" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="508" font-size="17" fill="#243633" font-weight="600">知识检索</text><text x="34" y="534" font-size="14" fill="#52665d" font-weight="400">有依据 → 根据片段回答</text><text x="34" y="558" font-size="14" fill="#52665d" font-weight="400">无依据 / 检索失败 → 明确说明</text><path d="M350 514 L340 514" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="632" width="320" height="126" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="660" font-size="17" fill="#243633" font-weight="600">业务工具</text><text x="34" y="686" font-size="14" fill="#52665d" font-weight="400">校验失败 → 拒绝, 不派发</text><text x="34" y="710" font-size="14" fill="#52665d" font-weight="400">校验通过 → 执行一次</text><path d="M350 666 L340 666" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M180 758 L180 794" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="772.0" font-size="13" fill="#52665d" font-weight="400">工具返回</text><text x="28" y="827" font-size="17" fill="#243633" font-weight="400">成功 → 据结果回答</text><text x="28" y="856" font-size="17" fill="#243633" font-weight="400">失败 → 说明错误, 不编造成功</text></g></svg>