rker-end="url(#arrow)"/><text x="483" y="410" font-size="15" fill="#243633" font-weight="400">返回: 数量 12,840 只</text><path d="M475 490 L90 490" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="98" y="478" font-size="15" fill="#243633" font-weight="400">可用业务结果</text><path d="M90 558 L280 558" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="98" y="546" font-size="15" fill="#243633" font-weight="400">只组织回答, 关闭工具执行</text><path d="M280 620 L90 620" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="98" y="608" font-size="15" fill="#243633" font-weight="400">数量、对象、日期与单位</text><text x="30" y="662" font-size="16" fill="#243633" font-weight="400">失败出口: 校验拒绝不派发; 工具错误返回失败说明, 不生成成功结论.</text></g></svg>