<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-label="成功查询的调用与返回"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="850" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">成功查询的调用与返回</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">教学时序 · 模型两次参与, 业务派发一次</text><rect x="20" y="92" width="320" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="120" font-size="17" fill="#243633" font-weight="600">应用 → 模型</text><text x="34" y="146" font-size="14" fill="#52665d" font-weight="400">输入 + 时钟 + 工具说明</text><path d="M180 210 L180 240" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="240" width="320" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="268" font-size="17" fill="#243633" font-weight="600">模型 → 应用</text><text x="34" y="294" font-size="14" fill="#52665d" font-weight="400">提出 query_shipments 调用</text><path d="M180 358 L180 388" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="388" width="320" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="416" font-size="17" fill="#243633" font-weight="600">执行器检查通过</text><text x="34" y="442" font-size="14" fill="#52665d" font-weight="400">名称 / 参数 / 权限 / 次数</text><path d="M180 506 L180 536" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="517.0" font-size="13" fill="#52665d" font-weight="400">通过/成功</text><rect x="20" y="536" width="320" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="564" font-size="17" fill="#243633" font-weight="600">业务服务 → 执行器</text><text x="34" y="590" font-size="14" fill="#52665d" font-weight="400">成功返回: 12,840 只</text><text x="34" y="614" font-size="14" fill="#52665d" font-weight="400">本图只展开成功路径</text><path d="M180 654 L180 684" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="665.0" font-size="13" fill="#52665d" font-weight="400">通过/成功</text><rect x="20" y="684" width="320" height="118" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="712" font-size="17" fill="#243633" font-weight="600">应用 → 模型 → 用户</text><text x="34" y="738" font-size="14" fill="#52665d" font-weight="400">只组织回答, 不再派发工具</text><text x="34" y="762" font-size="14" fill="#52665d" font-weight="400">保留对象、日期、数量与单位</text><text x="24" y="833" font-size="15" fill="#243633" font-weight="400">工具派发 1 次, 超时也计入次数.</text></g></svg>