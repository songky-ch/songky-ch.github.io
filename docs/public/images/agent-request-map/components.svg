<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-label="Agent 请求里的组件分工"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="550" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">Agent 请求里的组件分工</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">教学架构 · 决策与执行分开</text><rect x="20" y="88" width="720" height="260" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="36" y="118" font-size="19" fill="#243633" font-weight="600">应用控制边界</text><rect x="36" y="144" width="210" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="50" y="172" font-size="19" fill="#243633" font-weight="600">输入与上下文</text><text x="50" y="198" font-size="16" fill="#52665d" font-weight="400">文字 / 时钟 / 提示词</text><text x="50" y="222" font-size="16" fill="#52665d" font-weight="400">本轮工具目录</text><rect x="278" y="144" width="200" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="292" y="172" font-size="19" fill="#243633" font-weight="600">模型</text><text x="292" y="198" font-size="16" fill="#52665d" font-weight="400">提出决策</text><text x="292" y="222" font-size="16" fill="#52665d" font-weight="400">生成结果表达</text><rect x="510" y="144" width="214" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="524" y="172" font-size="19" fill="#243633" font-weight="600">执行器与状态</text><text x="524" y="198" font-size="16" fill="#52665d" font-weight="400">校验 / 权限 / 次数</text><text x="524" y="222" font-size="16" fill="#52665d" font-weight="400">派发 / 返回 / 结束</text><path d="M246 190 L278 190" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478 190 L510 190" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="38" y="303" font-size="17" fill="#243633" font-weight="400">轨迹贯穿各事件: 记录实际输入、可见决策、派发和返回.</text><rect x="110" y="406" width="254" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="124" y="434" font-size="19" fill="#243633" font-weight="600">知识库</text><text x="124" y="460" font-size="16" fill="#52665d" font-weight="400">检索片段与依据</text><rect x="460" y="406" width="254" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="474" y="434" font-size="19" fill="#243633" font-weight="600">业务服务</text><text x="474" y="460" font-size="16" fill="#52665d" font-weight="400">查询或写入结果</text><path d="M568 348 L237 406" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="409.5" y="373.0" font-size="13" fill="#52665d" font-weight="400">检索分支</text><path d="M650 348 L600 406" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="632.0" y="373.0" font-size="13" fill="#52665d" font-weight="400">工具分支</text><text x="32" y="535" font-size="16" fill="#243633" font-weight="400">结果回到应用, 再组织回答. 图示职责, 不代表真实部署进程.</text></g></svg>