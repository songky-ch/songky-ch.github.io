<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" aria-label="每条结论都要对应执行证据"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="520" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">每条结论都要对应执行证据</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">局部替身测试不会自动覆盖真实服务</text><rect x="20" y="90" width="320" height="116" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">摘要转换</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">输出数量、编号与顺序</text><text x="34" y="168" font-size="14" fill="#52665d" font-weight="400">真实执行摘要逻辑</text><rect x="20" y="228" width="320" height="116" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="256" font-size="17" fill="#243633" font-weight="600">查询交互</text><text x="34" y="282" font-size="14" fill="#52665d" font-weight="400">参数是否正确, 调了几次</text><text x="34" y="306" font-size="14" fill="#52665d" font-weight="400">替身记录 + 调用断言</text><rect x="20" y="366" width="320" height="116" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="394" font-size="17" fill="#243633" font-weight="600">真实服务</text><text x="34" y="420" font-size="14" fill="#52665d" font-weight="400">鉴权、SQL、网络与事务</text><text x="34" y="444" font-size="14" fill="#52665d" font-weight="400">本条未执行, 需集成证据</text></g></svg>