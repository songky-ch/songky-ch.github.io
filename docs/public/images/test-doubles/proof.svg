<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-label="每条结论都要对应执行证据"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="426" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">每条结论都要对应执行证据</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">局部替身测试不会自动覆盖真实服务</text><rect x="24" y="90" width="210" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="38" y="118" font-size="19" fill="#243633" font-weight="600">摘要转换</text><path d="M234 131 L282 131" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="282" y="90" width="454" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="296" y="118" font-size="19" fill="#243633" font-weight="600">输出数量、编号与顺序</text><text x="296" y="144" font-size="16" fill="#52665d" font-weight="400">真实执行摘要逻辑</text><rect x="24" y="195" width="210" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="38" y="223" font-size="19" fill="#243633" font-weight="600">查询交互</text><path d="M234 236 L282 236" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="282" y="195" width="454" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="296" y="223" font-size="19" fill="#243633" font-weight="600">参数是否正确, 调了几次</text><text x="296" y="249" font-size="16" fill="#52665d" font-weight="400">替身记录 + 调用断言</text><rect x="24" y="300" width="210" height="82" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="38" y="328" font-size="19" fill="#243633" font-weight="600">真实服务</text><path d="M234 341 L282 341" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="282" y="300" width="454" height="82" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="296" y="328" font-size="19" fill="#243633" font-weight="600">鉴权、SQL、网络与事务</text><text x="296" y="354" font-size="16" fill="#52665d" font-weight="400">本条未执行, 需集成证据</text></g></svg>