<svg xmlns="http://www.w3.org/2000/svg" width="360" height="575" viewBox="0 0 360 575" role="img" aria-label="保留被测逻辑, 替换其依赖"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="575" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">保留被测逻辑, 替换其依赖</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">本次目标: 摘要转换与查询调用</text><rect x="20" y="88" width="320" height="80" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">真实摘要逻辑</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">输入局点与客户, 输出数量与编号</text><path d="M180 168 L180 209" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="184.5" font-size="13" fill="#52665d" font-weight="400">本条测试</text><rect x="20" y="209" width="320" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="237" font-size="17" fill="#243633" font-weight="600">查询替身</text><text x="34" y="263" font-size="14" fill="#52665d" font-weight="400">返回两条固定的教学记录</text><path d="M180 299 L180 340" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="315.5" font-size="13" fill="#52665d" font-weight="400">结果交给摘要</text><rect x="20" y="340" width="320" height="80" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="368" font-size="17" fill="#243633" font-weight="600">断言摘要与调用参数</text><rect x="20" y="455" width="320" height="90" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="483" font-size="17" fill="#243633" font-weight="600">真实网络 / 服务 / 数据库</text><text x="34" y="509" font-size="14" fill="#52665d" font-weight="400">本条替身测试未执行这些路径</text></g></svg>