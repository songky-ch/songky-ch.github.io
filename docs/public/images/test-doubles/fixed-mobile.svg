<svg xmlns="http://www.w3.org/2000/svg" width="360" height="518" viewBox="0 0 360 518" role="img" aria-label="固定返回分不清两个客户"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="518" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">固定返回分不清两个客户</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">Stub 有意忽略参数 · 输出可能同样正确</text><rect x="20" y="88" width="145" height="100" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">正确参数</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">CUSTOMER-X</text><rect x="195" y="88" width="145" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="209" y="116" font-size="17" fill="#243633" font-weight="600">错误参数</text><text x="209" y="142" font-size="14" fill="#52665d" font-weight="400">CUSTOMER-Y</text><path d="M92 188 L140 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267 188 L220 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="232" width="320" height="95" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="260" font-size="17" fill="#243633" font-weight="600">同一个固定桩</text><text x="34" y="286" font-size="14" fill="#52665d" font-weight="400">始终返回 0201、0202</text><path d="M180 327 L180 368" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="368" width="320" height="115" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="396" font-size="17" fill="#243633" font-weight="600">同样输出: 找到 2 条</text><text x="34" y="422" font-size="14" fill="#52665d" font-weight="400">只看输出, 漏掉了客户参数错误</text><text x="34" y="446" font-size="14" fill="#52665d" font-weight="400">增加调用证据或差异化返回</text></g></svg>