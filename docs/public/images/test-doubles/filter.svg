<svg xmlns="http://www.w3.org/2000/svg" width="760" height="422" viewBox="0 0 760 422" role="img" aria-label="简化实现会对条件作出反应"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="422" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">简化实现会对条件作出反应</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">独立三条记录 · 无日期、权限与事务模拟</text><rect x="20" y="88" width="716" height="113" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="19" fill="#243633" font-weight="600">内存中的三条记录</text><text x="34" y="142" font-size="16" fill="#52665d" font-weight="400">0201: A/X    0202: A/X</text><text x="34" y="166" font-size="16" fill="#52665d" font-weight="400">0205: A/Y</text><rect x="22" y="266" width="220" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="36" y="294" font-size="19" fill="#243633" font-weight="600">A/X</text><text x="36" y="320" font-size="16" fill="#52665d" font-weight="400">0201, 0202 → 2 条</text><path d="M378 201 L132 266" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="266" width="220" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="284" y="294" font-size="19" fill="#243633" font-weight="600">A/Y</text><text x="284" y="320" font-size="16" fill="#52665d" font-weight="400">0205 → 1 条</text><path d="M378 201 L380 266" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="518" y="266" width="220" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="532" y="294" font-size="19" fill="#243633" font-weight="600">B/X</text><text x="532" y="320" font-size="16" fill="#52665d" font-weight="400">空集合 → 0 条</text><path d="M378 201 L628 266" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="398" font-size="16" fill="#243633" font-weight="400">每个用例独立创建 Fake, 避免共享可变数据污染后续测试.</text></g></svg>