<svg xmlns="http://www.w3.org/2000/svg" width="760" height="369" viewBox="0 0 760 369" role="img" aria-label="固定返回分不清两个客户"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="369" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">固定返回分不清两个客户</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">Stub 有意忽略参数 · 输出可能同样正确</text><rect x="24" y="90" width="285" height="86" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="38" y="118" font-size="19" fill="#243633" font-weight="600">正确: CUSTOMER-X</text><rect x="24" y="222" width="285" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="38" y="250" font-size="19" fill="#243633" font-weight="600">错误: CUSTOMER-Y</text><path d="M309 133 L398 199" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M309 265 L398 199" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="398" y="152" width="338" height="96" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="412" y="180" font-size="19" fill="#243633" font-weight="600">固定桩: 始终返回 2 条</text><text x="412" y="206" font-size="16" fill="#52665d" font-weight="400">摘要输出相同, 无法区分错参数</text><text x="24" y="347" font-size="16" fill="#243633" font-weight="400">补充证据: 调用参数是否为预期客户? 替身是否需要按参数返回?</text></g></svg>