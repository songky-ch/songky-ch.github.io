<svg xmlns="http://www.w3.org/2000/svg" width="360" height="548" viewBox="0 0 360 548" role="img" aria-label="简化实现会对条件作出反应"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="548" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">简化实现会对条件作出反应</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">独立三条记录 · 无日期、权限与事务模拟</text><rect x="20" y="88" width="320" height="113" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">内存中的三条记录</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">0201: A/X    0202: A/X</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">0205: A/Y</text><rect x="70" y="238" width="270" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="84" y="266" font-size="17" fill="#243633" font-weight="600">A/X</text><text x="84" y="292" font-size="14" fill="#52665d" font-weight="400">0201, 0202 → 2 条</text><path d="M35 215 L35 275" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M35 275 L70 275" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="70" y="334" width="270" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="84" y="362" font-size="17" fill="#243633" font-weight="600">A/Y</text><text x="84" y="388" font-size="14" fill="#52665d" font-weight="400">0205 → 1 条</text><path d="M35 215 L35 371" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M35 371 L70 371" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="70" y="430" width="270" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="84" y="458" font-size="17" fill="#243633" font-weight="600">B/X</text