<rect x="635" y="300" width="440" height="78" rx="5" fill="#ffffff" stroke="#a9bbcd" stroke-width="1.6"/>
<text x="855.0" y="332.5" text-anchor="middle" font-size="21" fill="#18364f">上下文 + Prompt + 模型适配</text>
