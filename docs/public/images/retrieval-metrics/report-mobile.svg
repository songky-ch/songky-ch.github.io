<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-label="总体命中会藏住难题"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="660" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">总体命中会藏住难题</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">100 条问题 · 合成报告</text><text x="24" y="100" font-size="17" fill="#243633" font-weight="600">整体至少命中</text><rect x="24" y="118" width="270.0" height="26" fill="#73a893" stroke="#d6e1da" rx="6"/><text x="24" y="170" font-size="16" fill="#243633" font-weight="400">90/100 = 90%</text><text x="24" y="216" font-size="17" fill="#243633" font-weight="600">整体完整覆盖</text><rect x="24" y="234" width="252.0" height="26" fill="#73a893" stroke="#d6e1da" rx="6"/><text x="24" y="286" font-size="16" fill="#243633" font-weight="400">84/100 = 84%</text><text x="24" y="332" font-size="17" fill="#243633" font-weight="600">单证据完整覆盖</text><rect x="24" y="350" width="270.0" height="26" fill="#73a893" stroke="#d6e1da" rx="6"/><text x="24" y="402" font-size="16" fill="#243633" font-weight="400">72/80 = 90%</text><text x="24" y="448" font-size="17" fill="#243633" font-weight="600">双证据完整覆盖</text><rect x="24" y="466" width="180.0" height="26" fill="#d69a84" stroke="#d6e1da" rx="6"/><text x="24" y="518" font-size="16" fill="#243633" font-weight="400">12/20 = 60%</text><text x="24" y="610" font-size="15" fill="#243633" font-weight="400">宏平均召回 87%, 微平均召回 85%.</text></g></svg>