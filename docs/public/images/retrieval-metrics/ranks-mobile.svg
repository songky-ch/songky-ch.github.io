<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-label="顺序好, 也可能没找齐"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="650" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">顺序好, 也可能没找齐</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">二值相关性 · 两份证据都必需</text><rect x="20" y="90" width="320" height="170" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">版本 A</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">G201 → C101 → C103</text><text x="34" y="168" font-size="14" fill="#52665d" font-weight="400">首相关第 2: RR=0.5</text><text x="34" y="192" font-size="14" fill="#52665d" font-weight="400">只找一份: 完整覆盖=0</text><rect x="20" y="310" width="320" height="170" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="338" font-size="17" fill="#243633" font-weight="600">版本 B</text><text x="34" y="364" font-size="14" fill="#52665d" font-weight="400">C101 → C102 → G201</text><text x="34" y="388" font-size="14" fill="#52665d" font-weight="400">首相关第 1: RR=1</text><text x="34" y="412" font-size="14" fill="#52665d" font-weight="400">找到两份: 完整覆盖=1</text><text x="24" y="568" font-size="17" fill="#243633" font-weight="600">反例: C101 → G201 → C103</text><text x="24" y="604" font-size="17" fill="#243633" font-weight="400">RR 已是 1, 但仍漏 C102.</text></g></svg>