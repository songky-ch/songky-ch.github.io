<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-label="同一命中数, 两个分母"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="550" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">同一命中数, 两个分母</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">Q1 / K=3 · 合成错误检索结果</text><rect x="20" y="90" width="716" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">预期相关集合 G</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">C101 + C102, 共 2 份</text><rect x="20" y="242" width="716" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="270" font-size="19" fill="#243633" font-weight="600">返回前三项</text><text x="34" y="296" font-size="16" fill="#52665d" font-weight="400">G201 / C101 / C103, 共 3 个位置</text><path d="M378 196 L378 242" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="385.0" y="215.0" font-size="13" fill="#52665d" font-weight="400">对照</text><path d="M378 348 L378 394" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="385.0" y="367.0" font-size="13" fill="#52665d" font-weight="400">交集只有 C101</text><rect x="20" y="394" width="716" height="120" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="422" font-size="19" fill="#243633" font-weight="600">找到了 1 份</text><text x="34" y="448" font-size="16" fill="#52665d" font-weight="400">Recall@3 = 1/2 = 50%</text><text x="34" y="472" font-size="16" fill="#52665d" font-weight="400">Precision@3 = 1/3 = 33.33%</text></g></svg>