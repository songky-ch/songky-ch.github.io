<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-label="必需组之间是“都要”"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="650" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">必需组之间是“都要”</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">本例 G1={C101}, G2={C102}</text><rect x="20" y="90" width="330" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">证据组 G1</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">C101</text><rect x="406" y="90" width="330" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="420" y="118" font-size="19" fill="#243633" font-weight="600">证据组 G2</text><text x="420" y="144" font-size="16" fill="#52665d" font-weight="400">C102</text><path d="M185 196 L185 258" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M571 196 L571 258" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="258" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="286" font-size="19" fill="#243633" font-weight="600">两组是否都被覆盖?</text><path d="M185 352 L185 420" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="192.0" y="382.0" font-size="13" fill="#52665d" font-weight="400">是</text><path d="M571 352 L571 420" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="578.0" y="382.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="420" width="330" height="100" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="448" font-size="19" fill="#243633" font-weight="600">完整覆盖</text><text x="34" y="474" font-size="16" fill="#52665d" font-weight="400">本项通过</text><rect x="406" y="420" width="330" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="420" y="448" font-size="19" fill="#243633" font-weight="600">不完整</text><text x="420" y="474" font-size="16" fill="#52665d" font-weight="400">有命中也不够</text><text x="24" y="574" font-size="15" fill="#243633" font-weight="400">同组内部可定义等价证据, 任选一份;</text><text x="24" y="608" font-size="15" fill="#243633" font-weight="400">跨组必须分别满足, 不能混淆.</text></g></svg>