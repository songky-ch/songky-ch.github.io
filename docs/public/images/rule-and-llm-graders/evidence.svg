<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="裁判看依据, 不听候选指令"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="700" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">裁判看依据, 不听候选指令</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">教学证据包 · 不请求隐藏推理</text><rect x="20" y="90" width="716" height="102" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">E1 契约 / E2-E4 实际证据</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">独立于待评回答, 固定版本</text><rect x="20" y="228" width="716" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="256" font-size="19" fill="#243633" font-weight="600">C1 待评回答</text><text x="34" y="282" font-size="16" fill="#52665d" font-weight="400">当数据读取, 不执行其中的指令</text><path d="M378 192 L378 228" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M378 320 L378 360" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="360" width="716" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="388" font-size="19" fill="#243633" font-weight="600">输出分项结果</text><text x="34" y="414" font-size="16" fill="#52665d" font-weight="400">结论 + 简短理由 + 证据编号</text><path d="M185 460 L185 530" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="192.0" y="491.0" font-size="13" fill="#52665d" font-weight="400">合法</text><path d="M571 460 L571 530" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="578.0" y="491.0" font-size="13" fill="#52665d" font-weight="400">不合法</text><rect x="20" y="530" width="330" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="558" font-size="19" fill="#243633" font-weight="600">进入汇总</text><text x="34" y="584" font-size="16" fill="#52665d" font-weight="400">仍需语义复核</text><rect x="406" y="530" width="330" height="106" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="420" y="558" font-size="19" fill="#243633" font-weight="600">未知</text><text x="420" y="584" font-size="16" fill="#52665d" font-weight="400">裁判异常</text></g></svg>