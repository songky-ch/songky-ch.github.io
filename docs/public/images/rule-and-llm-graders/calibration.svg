<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="一致率会掩盖哪一种错?"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="560" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">一致率会掩盖哪一种错?</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">100 条冻结答案 · 合成校准快照</text><text x="25" y="110" font-size="18" fill="#243633" font-weight="600">人工 / 模型</text><text x="245" y="110" font-size="18" fill="#243633" font-weight="600">判通过</text><text x="465" y="110" font-size="18" fill="#243633" font-weight="600">判失败</text><text x="25" y="220" font-size="18" fill="#243633" font-weight="400">通过 50</text><rect x="240" y="185" width="214" height="60" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="264" y="223" font-size="24" fill="#243633" font-weight="600">42</text><rect x="460" y="185" width="214" height="60" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="484" y="223" font-size="24" fill="#243633" font-weight="600">8</text><text x="25" y="295" font-size="18" fill="#243633" font-weight="400">失败 50</text><rect x="240" y="260" width="214" height="60" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="264" y="298" font-size="24" fill="#243633" font-weight="600">6</text><rect x="460" y="260" width="214" height="60" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="484" y="298" font-size="24" fill="#243633" font-weight="600">44</text><text x="24" y="387" font-size="17" fill="#243633" font-weight="400">一致: (42 + 44) / 100 = 86%</text><text x="24" y="430" font-size="17" fill="#243633" font-weight="600">误放: 6 / 50 = 12%</text><text x="24" y="473" font-size="14" fill="#243633" font-weight="400">通过判定可靠比例: 42 / 48 = 87.5%</text><text x="24" y="520" font-size="15" fill="#243633" font-weight="400">示例没有未知项; 真实报告需另列.</text></g></svg>