<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610" role="img" aria-label="同一证据, 两类检查"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="610" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">同一证据, 两类检查</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">规则与模型独立分工, 汇总不取平均</text><rect x="20" y="90" width="320" height="80" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">任务契约 + 实际证据</text><rect x="20" y="240" width="150" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="268" font-size="17" fill="#243633" font-weight="600">规则检查</text><text x="34" y="294" font-size="14" fill="#52665d" font-weight="400">名称 / 参数</text><text x="34" y="318" font-size="14" fill="#52665d" font-weight="400">次数 / 状态</text><rect x="190" y="240" width="150" height="110" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="204" y="268" font-size="17" fill="#243633" font-weight="600">模型评判</text><text x="204" y="294" font-size="14" fill="#52665d" font-weight="400">事实依据</text><text x="204" y="318" font-size="14" fill="#52665d" font-weight="400">语义完整性</text><path d="M95 170 L95 240" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265 170 L265 240" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M95 350 L95 430" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M265 350 L265 430" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="430" width="320" height="110" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="458" font-size="17" fill="#243633" font-weight="600">按必需条件汇总</text><text x="34" y="484" font-size="14" fill="#52665d" font-weight="400">失败优先 → 未知 → 全通过</text><text x="34" y="508" font-size="14" fill="#52665d" font-weight="400">模型不能抵消已知违规</text></g></svg>