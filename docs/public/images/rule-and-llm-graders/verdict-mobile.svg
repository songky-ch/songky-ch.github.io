<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-label="整体结论怎样形成?"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="640" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">整体结论怎样形成?</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">不适用项先排除, 只汇总必需项</text><rect x="20" y="90" width="210" height="96" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">已有可靠失败?</text><rect x="250" y="90" width="90" height="96" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="264" y="118" font-size="17" fill="#243633" font-weight="600">失败</text><path d="M230 136 L250 136" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="247.0" y="132.0" font-size="13" fill="#52665d" font-weight="400">是</text><path d="M110 186 L110 260" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="117.0" y="219.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="260" width="210" height="96" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="288" font-size="17" fill="#243633" font-weight="600">必需项存在未知?</text><rect x="250" y="260" width="90" height="96" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="264" y="288" font-size="17" fill="#243633" font-weight="600">未知</text><path d="M230 306 L250 306" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="247.0" y="302.0" font-size="13" fill="#52665d" font-weight="400">是</text><path d="M110 356 L110 430" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="117.0" y="389.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="430" width="210" height="96" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="458" font-size="17" fill="#243633" font-weight="600">必需项全部通过</text><text x="34" y="484" font-size="14" fill="#52665d" font-weight="400">确认通过</text><text x="24" y="582" font-size="15" fill="#243633" font-weight="400">无检查配置也应未知, 不能空集通过.</text></g></svg>