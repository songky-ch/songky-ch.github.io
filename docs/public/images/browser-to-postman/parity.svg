<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-label="Postman 复现, 先对齐条件"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="385" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">Postman 复现, 先对齐条件</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">模拟基线 · 先保留导致 142 条的原请求</text><rect x="24" y="95" width="340" height="160" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="123" font-size="19" fill="#243633" font-weight="600">浏览器请求</text><text x="38" y="149" font-size="16" fill="#52665d" font-weight="400">相同环境、路径、GET 方法</text><text x="38" y="173" font-size="16" fill="#52665d" font-weight="400">相同日期、局点和客户条件</text><text x="38" y="197" font-size="16" fill="#52665d" font-weight="400">相同身份、权限与数据快照</text><rect x="396" y="95" width="340" height="160" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="410" y="123" font-size="19" fill="#243633" font-weight="600">Postman 请求</text><text x="410" y="149" font-size="16" fill="#52665d" font-weight="400">相同环境、路径、GET 方法</text><text x="410" y="173" font-size="16" fill="#52665d" font-weight="400">相同日期、局点和客户条件</text><text x="410" y="197" font-size="16" fill="#52665d" font-weight="400">相同身份、权限与数据快照</text><path d="M364 175 L396 175" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="283" width="712" height="78" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="38" y="311" font-size="19" fill="#243633" font-weight="600">先复现同样的 142 条, 再只改一个参数</text><text x="38" y="337" font-size="16" fill="#52665d" font-weight="400">相同身份不是展示或公开真实凭证, 只在授权环境内部核对.</text></g></svg>