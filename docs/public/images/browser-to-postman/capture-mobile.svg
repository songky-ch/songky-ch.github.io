<svg xmlns="http://www.w3.org/2000/svg" width="360" height="561" viewBox="0 0 360 561" role="img" aria-label="从一次点击找到对应请求"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="561" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">从一次点击找到对应请求</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">先观察, 再复制, 保留复现上下文</text><rect x="20" y="88" width="320" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">打开 Network, 再触发一次查询</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">按路径、方法和触发时间定位</text><path d="M180 170 L180 206" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="206" width="184" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="234" font-size="17" fill="#243633" font-weight="600">找到业务请求?</text><rect x="230" y="206" width="110" height="106" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="244" y="234" font-size="17" fill="#243633" font-weight="600">没有</text><text x="244" y="260" font-size="14" fill="#52665d" font-weight="400">查页面校验</text><text x="244" y="284" font-size="14" fill="#52665d" font-weight="400">查事件触发</text><path d="M204 247 L230 247" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M112 288 L112 326" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="119.0" y="303.0" font-size="13" fill="#52665d" font-weight="400">有</text><rect x="20" y="326" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="354" font-size="17" fill="#243633" font-weight="600">核对请求 + 响应</text><text x="34" y="380" font-size="14" fill="#52665d" font-weight="400">不要只看状态码</text><text x="34" y="404" font-size="14" fill="#52665d" font-weight="400">保留参数、身份范围和数据条件</text><path d="M180 430 L180 462" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="462" width="320" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="490" font-size="17" fill="#243633" font-weight="600">复制为 cURL → 导入 Postman</text></g></svg>