<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="两边表现不同, 按现象分流"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="540" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">两边表现不同, 按现象分流</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">先对齐请求条件, 再判断差异位置</text><rect x="20" y="88" width="430" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="19" fill="#243633" font-weight="600">请求条件一致?</text><text x="34" y="142" font-size="16" fill="#52665d" font-weight="400">环境 / 参数 / 身份 / 数据</text><rect x="510" y="88" width="230" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="524" y="116" font-size="19" fill="#243633" font-weight="600">不一致</text><text x="524" y="142" font-size="16" fill="#52665d" font-weight="400">先对齐条件</text><path d="M450 130 L510 130" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235 174 L235 204" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="185.0" font-size="13" fill="#52665d" font-weight="400">一致</text><rect x="24" y="254" width="340" height="109" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="282" font-size="19" fill="#243633" font-weight="600">没有相关网络请求</text><text x="38" y="308" font-size="16" fill="#52665d" font-weight="400">查页面校验、事件绑定</text><rect x="396" y="254" width="340" height="109" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="410" y="282" font-size="19" fill="#243633" font-weight="600">只有预检失败</text><text x="410" y="308" font-size="16" fill="#52665d" font-weight="400">查跨域预检响应与允许项</text><rect x="24" y="391" width="340" height="109" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="419" font-size="19" fill="#243633" font-weight="600">业务请求发出但 JS 读不到</text><text x="38" y="445" font-size="16" fill="#52665d" font-weight="400">查响应的跨域允许头</text><text x="38" y="469" font-size="16" fill="#52665d" font-weight="400">不能据此断言服务未执行</text><rect x="396" y="391" width="340" height="109" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="410" y="419" font-size="19" fill="#243633" font-weight="600">响应正确, 页面仍错误</text><text x="410" y="445" font-size="16" fill="#52665d" font-weight="400">查状态更新、字段映射和渲染</text><path d="M235 204 L194 254" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235 204 L566 254" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M10 230 L10 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M10 442 L24 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M750 230 L750 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M750 442 L736 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235 204 L10 230" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M235 204 L750 230" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/></g></svg>