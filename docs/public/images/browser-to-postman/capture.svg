<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-label="从一次点击找到对应请求"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="426" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">从一次点击找到对应请求</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">先观察, 再复制, 保留复现上下文</text><rect x="24" y="90" width="320" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="118" font-size="19" fill="#243633" font-weight="600">打开 Network → 触发查询</text><text x="38" y="144" font-size="16" fill="#52665d" font-weight="400">用路径、方法、时间定位请求</text><path d="M184 172 L184 213" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="213" width="320" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="241" font-size="19" fill="#243633" font-weight="600">找到业务请求?</text><path d="M344 254 L430 254" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="394.0" y="250.0" font-size="13" fill="#52665d" font-weight="400">没有</text><rect x="430" y="213" width="306" height="82" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="444" y="241" font-size="19" fill="#243633" font-weight="600">查页面校验 / 事件触发</text><path d="M184 295 L184 333" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="191.0" y="310.0" font-size="13" fill="#52665d" font-weight="400">有</text><rect x="24" y="333" width="712" height="70" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="361" font-size="19" fill="#243633" font-weight="600">核对参数、身份、响应 → 复制为 cURL → 导入 Postman</text></g></svg>