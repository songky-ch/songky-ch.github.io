<svg xmlns="http://www.w3.org/2000/svg" width="760" height="411" viewBox="0 0 760 411" role="img" aria-label="结束日期差一天, 结果差一条"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="411" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">结束日期差一天, 结果差一条</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">模拟固定数据 · 上海时间, 左闭右开</text><rect x="24" y="91" width="340" height="119" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="38" y="119" font-size="19" fill="#243633" font-weight="600">旧边界: 10-20 00:00 之前</text><text x="38" y="145" font-size="16" fill="#52665d" font-weight="400">新记录: 当天 09:18 → 被排除</text><text x="38" y="169" font-size="16" fill="#52665d" font-weight="400">查询结果 142 条</text><rect x="396" y="91" width="340" height="119" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="410" y="119" font-size="19" fill="#243633" font-weight="600">新边界: 10-21 00:00 之前</text><text x="410" y="145" font-size="16" fill="#52665d" font-weight="400">新记录: 前一天 09:18 → 被包含</text><text x="410" y="169" font-size="16" fill="#52665d" font-weight="400">查询结果 143 条</text><path d="M364 150 L396 150" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="246" width="712" height="131" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="274" font-size="19" fill="#243633" font-weight="600">只变更结束时间, 其他请求条件与数据快照不变</text><text x="38" y="300" font-size="16" fill="#52665d" font-weight="400">旧边界: 10-20 00:00 +08:00 = 10-19 16:00Z</text><text x="38" y="324" font-size="16" fill="#52665d" font-weight="400">新边界: 10-21 00:00 +08:00 = 10-20 16:00Z</text><text x="38" y="348" font-size="16" fill="#52665d" font-weight="400">142 → 143 来自这组固定样例, 不是所有查询必然只差一条.</text></g></svg>