<svg xmlns="http://www.w3.org/2000/svg" width="360" height="715" viewBox="0 0 360 715" role="img" aria-label="两边表现不同, 按现象分流"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="715" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">两边表现不同, 按现象分流</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">先对齐请求条件, 再判断差异位置</text><rect x="20" y="88" width="190" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">请求条件一致?</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">环境 / 参数 / 身份 / 数据</text><rect x="236" y="88" width="104" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="250" y="116" font-size="17" fill="#243633" font-weight="600">不一致</text><text x="250" y="142" font-size="14" fill="#52665d" font-weight="400">先对齐条件</text><path d="M210 130 L236 130" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115 174 L115 204" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="122.0" y="185.0" font-size="13" fill="#52665d" font-weight="400">一致</text><rect x="40" y="212" width="300" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="54" y="240" font-size="17" fill="#243633" font-weight="600">没有相关网络请求</text><text x="54" y="266" font-size="14" fill="#52665d" font-weight="400">查页面校验、事件绑定</text><path d="M26 202 L26 262" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M26 262 L40 262" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="332" width="300" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="54" y="360" font-size="17" fill="#243633" font-weight="600">只有预检失败</text><text x="54" y="386" font-size="14" fill="#52665d" font-weight="400">查跨域预检响应与允许项</text><path d="M26 202 L26 382" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M26 382 L40 382" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="452" width="300" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="54" y="480" font-size="17" fill="#243633" font-weight="600">业务请求发出但 JS 读不到</text><text x="54" y="506" font-size="14" fill="#52665d" font-weight="400">查响应的跨域允许头</text><text x="54" y="530" font-size="14" fill="#52665d" font-weight="400">不能据此断言服务未执行</text><path d="M26 202 L26 502" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M26 502 L40 502" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="572" width="300" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="54" y="600" font-size="17" fill="#243633" font-weight="600">响应正确, 页面仍错误</text><text x="54" y="626" font-size="14" fill="#52665d" font-weight="400">查状态更新、字段映射和渲染</text><path d="M26 202 L26 622" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M26 622 L40 622" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115 204 L26 204" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/></g></svg>