<svg xmlns="http://www.w3.org/2000/svg" width="360" height="612" viewBox="0 0 360 612" role="img" aria-label="Postman 复现, 先对齐条件"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="612" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">Postman 复现, 先对齐条件</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">模拟基线 · 先保留导致 142 条的原请求</text><rect x="20" y="88" width="320" height="150" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">浏览器请求</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">相同环境、路径、GET 方法</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">相同日期、局点和客户条件</text><text x="34" y="190" font-size="14" fill="#52665d" font-weight="400">相同身份、权限与数据快照</text><path d="M180 238 L180 274" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="252.0" font-size="13" fill="#52665d" font-weight="400">逐项对齐</text><rect x="20" y="274" width="320" height="150" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="302" font-size="17" fill="#243633" font-weight="600">Postman 请求</text><text x="34" y="328" font-size="14" fill="#52665d" font-weight="400">相同环境、路径、GET 方法</text><text x="34" y="352" font-size="14" fill="#52665d" font-weight="400">相同日期、局点和客户条件</text><text x="34" y="376" font-size="14" fill="#52665d" font-weight="400">相同身份、权限与数据快照</text><path d="M180 424 L180 459" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="459" width="320" height="124" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="487" font-size="17" fill="#243633" font-weight="600">基线: 两边都返回 142 条</text><text x="34" y="513" font-size="14" fill="#52665d" font-weight="400">先复现同样的结果</text><text x="34" y="537" font-size="14" fill="#52665d" font-weight="400">再只改结束时间验证原因</text></g></svg>