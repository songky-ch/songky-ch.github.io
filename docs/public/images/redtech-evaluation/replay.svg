<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-label="先核对快照, 再回放与下钻"><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#173349;font-size:16px}.small{font-size:14px}.title{font-size:21px;font-weight:700}.bold{font-weight:700}.line{fill:none;stroke:#326a7a;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326a7a"/></marker></defs><rect width="440" height="660" fill="#f5f8fa"/><text x="22" y="34" class="title">先核对快照, 再回放与下钻</text><text x="28" y="80">输入快照 + 实际生效的评测配置</text><path d="M220 96V130" class="line"/><rect x="90" y="136" width="260" height="68" fill="#e2eff1"/><text x="116" y="164" class="bold">版本 / 时间 / 内容 / 状态</text><text x="170" y="190">是否一致?</text>
<path d="M90 170H32V255H80" class="line"/><text x="38" y="218" class="small">不一致</text><text x="94" y="261" class="bold">拒绝回放, 不拉新数据补旧现场</text>
<path d="M300 204V307H220V337" class="line"/><text x="310" y="293" class="small">一致</text><text x="60" y="370">按固定配置重评 / 显式变更配置做对照</text><path d="M220 388V420" class="line"/>
<rect x="24" y="428" width="392" height="165" fill="#e2eff1"/><text x="40" y="458" class="bold">报告: 覆盖、分布与低分群体</text><text x="40" y="497">维度 → 请求 → 有序内容</text><text x="40" y="531">→ 单项评分 → 输入证据与原因</text><text x="40" y="570" class="small">业务效果另行关联, 不由评分直接推出</text>
<text x="24" y="632" class="small">可追溯 ≠ 逐字复现; 任务恢复另需副作用对账</text></svg>