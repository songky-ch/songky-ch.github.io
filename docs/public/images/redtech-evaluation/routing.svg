<svg xmlns="http://www.w3.org/2000/svg" width="440" height="632" viewBox="0 0 440 632" role="img" aria-label="证据性质决定评分方式"><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#173349;font-size:16px}.small{font-size:14px}.title{font-size:21px;font-weight:700}.bold{font-weight:700}.line{fill:none;stroke:#326a7a;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326a7a"/></marker></defs><rect width="440" height="632" fill="#f5f8fa"/><text x="22" y="34" class="title">证据性质决定评分方式</text><text x="22" y="76">同一快照 → 按维度选择需要的材料</text><path d="M28 94V395" stroke="#96afb9" stroke-width="2"/>
<path d="M28 132H64" class="line"/><rect x="70" y="106" width="345" height="80" fill="#e2eff1"/><text x="86" y="134" class="bold">结构化事实 → 规则直接判定</text><text x="86" y="165" class="small">例: 环境 test 是否符合授权</text>
<path d="M28 238H64" class="line"/><rect x="70" y="212" width="345" height="80" fill="#e2eff1"/><text x="86" y="240" class="bold">可统计特征 → 代码后再解释</text><text x="86" y="271" class="small">例: 重复比例与集合覆盖的语境</text>
<path d="M28 344H64" class="line"/><rect x="70" y="318" width="345" height="80" fill="#e2eff1"/><text x="86" y="346" class="bold">语义问题 → 限定证据的裁判</text><text x="86" y="377" class="small">例: 是否理解异常流程与前置条件</text>
<path d="M28 395V445H64" class="line"/><text x="78" y="449" class="bold">分别保存 score / reason / status</text><text x="26" y="497">缺材料或调用失败 → null + 独立状态</text><text x="26" y="531">有效 0 分 → 保留在有效样本中</text><text x="26" y="565">未请求维度 → 不计入应评分母</text><text x="26" y="603" class="small">教学状态名, 不是小红书内部枚举</text></svg>