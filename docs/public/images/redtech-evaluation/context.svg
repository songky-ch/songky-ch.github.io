<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" role="img" aria-label="一次评测, 先还原当时现场"><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#173349;font-size:16px}.small{font-size:14px}.title{font-size:21px;font-weight:700}.bold{font-weight:700}.line{fill:none;stroke:#326a7a;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326a7a"/></marker></defs><rect width="440" height="600" fill="#f5f8fa"/><text x="22" y="34" class="title">一次评测, 先还原当时现场</text><path d="M32 65V252" stroke="#347c84" stroke-width="5"/>
<text x="50" y="80" class="bold">原文: 一次完整推荐请求</text>
<text x="50" y="116">用户状态 / 长期兴趣 / 近期消费</text><text x="50" y="151">请求时间 / 时效判断的参照点</text><text x="50" y="186">完整有序列表 / 单篇与集合关系</text><text x="50" y="225" class="small">实验目标单独声明, 不等于行为效果</text>
<path d="M220 255V303" class="line"/><text x="240" y="285" class="small">迁移机制, 不照搬指标</text>
<rect x="22" y="320" width="396" height="155" fill="#e2eff1"/><text x="40" y="350" class="bold">教学案例: 专项测试任务 T-001</text><text x="40" y="386">需求版本 + 环境 + 任务目标</text><text x="40" y="422">有序工具观测 + 计划 + 产物引用</text><text x="40" y="455" class="small">输入与生效配置一起冻结</text>
<path d="M220 475V510" class="line"/><text x="35" y="540">后续采纳数、工时等业务结果另行分析</text><text x="35" y="570" class="small">不因业务结果好, 反向修改语义评分</text></svg>