<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1010" viewBox="0 0 360 1010" role="img" aria-label="资料处理与在线问答"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="1010" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">资料处理与在线问答</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">D3 示例架构 · 索引连接两条链</text><rect x="20" y="88" width="320" height="190" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="34" y="118" font-size="18" fill="#243633" font-weight="600">资料处理链</text><text x="34" y="154" font-size="17" fill="#243633" font-weight="400">源资料 → 解析与切分</text><text x="34" y="196" font-size="17" fill="#243633" font-weight="400">保留元数据与版本</text><text x="34" y="238" font-size="17" fill="#243633" font-weight="400">写入可检索索引</text><path d="M180 278 L180 330" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="300.0" font-size="13" fill="#52665d" font-weight="400">索引可查</text><rect x="20" y="330" width="200" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="358" font-size="17" fill="#243633" font-weight="600">范围与权限</text><text x="34" y="384" font-size="14" fill="#52665d" font-weight="400">确认日期和对象</text><rect x="248" y="330" width="92" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="262" y="358" font-size="17" fill="#243633" font-weight="600">澄清</text><path d="M220 376 L248 376" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="241.0" y="372.0" font-size="13" fill="#52665d" font-weight="400">不清</text><path d="M120 422 L120 462" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="438.0" font-size="13" fill="#52665d" font-weight="400">明确</text><rect x="20" y="462" width="200" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="490" font-size="17" fill="#243633" font-weight="600">检索</text><rect x="248" y="462" width="92" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="262" y="490" font-size="17" fill="#243633" font-weight="600">说明</text><text x="262" y="516" font-size="14" fill="#52665d" font-weight="400">错误</text><path d="M220 508 L248 508" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="241.0" y="504.0" font-size="13" fill="#52665d" font-weight="400">错</text><path d="M120 554 L120 606" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="576.0" font-size="13" fill="#52665d" font-weight="400">成功</text><rect x="20" y="606" width="200" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="634" font-size="17" fill="#243633" font-weight="600">有可用证据?</text><rect x="248" y="606" width="92" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="262" y="634" font-size="17" fill="#243633" font-weight="600">说明</text><text x="262" y="660" font-size="14" fill="#52665d" font-weight="400">无依据</text><path d="M220 652 L248 652" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="241.0" y="648.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M120 698 L120 750" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="720.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="750" width="320" height="112" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="778" font-size="17" fill="#243633" font-weight="600">组织上下文 → 生成回答</text><text x="34" y="804" font-size="14" fill="#52665d" font-weight="400">只使用实际提供的资料</text><text x="24" y="916" font-size="17" fill="#243633" font-weight="400">资料处理可提前进行,</text><text x="24" y="950" font-size="17" fill="#243633" font-weight="400">无需每次提问重建全库.</text></g></svg>