<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img" aria-label="资料处理与在线问答"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="790" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">资料处理与在线问答</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">D3 示例架构 · 索引连接两条链</text><rect x="20" y="88" width="716" height="170" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="36" y="119" font-size="19" fill="#243633" font-weight="600">资料处理链</text><rect x="36" y="150" width="200" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="50" y="178" font-size="19" fill="#243633" font-weight="600">源资料</text><rect x="278" y="150" width="200" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="292" y="178" font-size="19" fill="#243633" font-weight="600">解析 / 切分</text><rect x="520" y="150" width="200" height="76" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="534" y="178" font-size="19" fill="#243633" font-weight="600">索引</text><path d="M236 188 L278 188" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M478 188 L520 188" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="314" width="270" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="342" font-size="19" fill="#243633" font-weight="600">在线请求: 范围与权限</text><rect x="20" y="464" width="270" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="492" font-size="19" fill="#243633" font-weight="600">澄清后再处理</text><path d="M155 414 L155 464" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="162.0" y="435.0" font-size="13" fill="#52665d" font-weight="400">条件不清</text><rect x="380" y="314" width="160" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="394" y="342" font-size="19" fill="#243633" font-weight="600">检索</text><path d="M290 363 L380 363" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="342.0" y="359.0" font-size="13" fill="#52665d" font-weight="400">明确</text><path d="M620 258 L460 314" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="547.0" y="282.0" font-size="13" fill="#52665d" font-weight="400">可查</text><rect x="584" y="314" width="152" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="598" y="342" font-size="19" fill="#243633" font-weight="600">错误说明</text><path d="M540 363 L584 363" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="569.0" y="359.0" font-size="13" fill="#52665d" font-weight="400">错</text><rect x="380" y="464" width="160" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="394" y="492" font-size="19" fill="#243633" font-weight="600">有证据?</text><path d="M460 414 L460 464" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="467.0" y="435.0" font-size="13" fill="#52665d" font-weight="400">成功</text><rect x="584" y="464" width="152" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="598" y="492" font-size="19" fill="#243633" font-weight="600">无依据说明</text><path d="M540 510 L584 510" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="569.0" y="506.0" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="620" width="520" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="648" font-size="19" fill="#243633" font-weight="600">组织上下文 → 生成回答</text><text x="34" y="674" font-size="16" fill="#52665d" font-weight="400">记录实际片段, 不只记录搜索结果</text><path d="M460 556 L460 620" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="467.0" y="584.0" font-size="13" fill="#52665d" font-weight="400">是</text><text x="24" y="763" font-size="16" fill="#243633" font-weight="400">图示职责, 不代表真实部署进程或每次请求都执行资料入库.</text></g></svg>