<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-label="让每份证据可以追溯"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="580" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">让每份证据可以追溯</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">例: C102 / v1 / 片段 01</text><rect x="20" y="90" width="716" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">源记录 C102 v1</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">发生时间 / 局点 / 客户 / 现象</text><path d="M378 174 L378 206" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="206" width="716" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="234" font-size="19" fill="#243633" font-weight="600">片段 C102:v1:01</text><text x="34" y="260" font-size="16" fill="#52665d" font-weight="400">文本 + 父记录 ID + 权限元数据</text><path d="M378 290 L378 322" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="322" width="716" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="350" font-size="19" fill="#243633" font-weight="600">索引 → 检索 → 上下文</text><text x="34" y="376" font-size="16" fill="#52665d" font-weight="400">每层保存实际 ID 与版本</text><path d="M378 406 L378 438" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="438" width="716" height="84" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="466" font-size="19" fill="#243633" font-weight="600">回答与引用</text><text x="34" y="492" font-size="16" fill="#52665d" font-weight="400">引用关联实际证据, 可反查原文</text></g></svg>