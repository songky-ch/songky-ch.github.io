<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-label="查到了, 还要实际传给模型"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="640" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">查到了, 还要实际传给模型</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">Q1 需要 C101 与 C102 两份记录</text><rect x="20" y="90" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">冻结库: 6 份资料</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">范围匹配后目标: C101 / C102</text><path d="M378 184 L378 234" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="234" width="716" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="262" font-size="19" fill="#243633" font-weight="600">检索命中 C101 + C102</text><path d="M185 328 L185 400" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="192.0" y="360.0" font-size="13" fill="#52665d" font-weight="400">保留齐</text><path d="M571 328 L571 400" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="578.0" y="360.0" font-size="13" fill="#52665d" font-weight="400">截掉一份</text><rect x="20" y="400" width="330" height="118" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="428" font-size="19" fill="#243633" font-weight="600">上下文完整</text><text x="34" y="454" font-size="16" fill="#52665d" font-weight="400">C101 + C102</text><text x="34" y="478" font-size="16" fill="#52665d" font-weight="400">具备证据条件</text><rect x="406" y="400" width="330" height="118" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="420" y="428" font-size="19" fill="#243633" font-weight="600">上下文遗漏</text><text x="420" y="454" font-size="16" fill="#52665d" font-weight="400">只有 C101</text><text x="420" y="478" font-size="16" fill="#52665d" font-weight="400">无法保证列全</text><text x="24" y="565" font-size="16" fill="#243633" font-weight="400">有证据也不保证回答正确,</text><text x="24" y="594" font-size="16" fill="#243633" font-weight="400">仍须核对生成结果.</text></g></svg>