<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" aria-label="让每份证据可以追溯"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="700" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">让每份证据可以追溯</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">例: C102 / v1 / 片段 01</text><rect x="20" y="90" width="320" height="98" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">源记录 C102 v1</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">发生时间 / 局点 / 客户 / 现象</text><path d="M180 188 L180 232" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="232" width="320" height="98" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="260" font-size="17" fill="#243633" font-weight="600">片段 C102:v1:01</text><text x="34" y="286" font-size="14" fill="#52665d" font-weight="400">文本 + 父记录 ID + 权限元数据</text><path d="M180 330 L180 374" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="374" width="320" height="98" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="402" font-size="17" fill="#243633" font-weight="600">索引 → 检索 → 上下文</text><text x="34" y="428" font-size="14" fill="#52665d" font-weight="400">每层保存实际 ID 与版本</text><path d="M180 472 L180 516" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="516" width="320" height="98" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="544" font-size="17" fill="#243633" font-weight="600">回答与引用</text><text x="34" y="570" font-size="14" fill="#52665d" font-weight="400">引用关联实际证据, 可反查原文</text></g></svg>