<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610" role="img" aria-label="从规则走到证据, 再谈覆盖"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="610" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">从规则走到证据, 再谈覆盖</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">示例: 计划 32 条, 执行 28 条</text><rect x="20" y="88" width="320" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">规则 + 固定数据 → 预期</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">先得到编号、顺序和总数</text><path d="M180 174 L180 210" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="210" width="190" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="238" font-size="17" fill="#243633" font-weight="600">取得执行证据?</text><rect x="236" y="210" width="104" height="90" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="250" y="238" font-size="17" fill="#243633" font-weight="600">没有</text><text x="250" y="264" font-size="14" fill="#52665d" font-weight="400">4 条阻塞</text><path d="M210 255 L236 255" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115 300 L115 341" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="122.0" y="316.5" font-size="13" fill="#52665d" font-weight="400">有</text><rect x="20" y="341" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="369" font-size="17" fill="#243633" font-weight="600">逐项比较实际与预期</text><text x="34" y="395" font-size="14" fill="#52665d" font-weight="400">28 条执行: 26 通过, 2 失败</text><path d="M180 435 L180 472" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="472" width="320" height="109" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="500" font-size="17" fill="#243633" font-weight="600">两种分母</text><text x="34" y="526" font-size="14" fill="#52665d" font-weight="400">执行通过: 26/28 ≈ 92.86%</text><text x="34" y="550" font-size="14" fill="#52665d" font-weight="400">计划完成: 28/32 = 87.5%</text></g></svg>