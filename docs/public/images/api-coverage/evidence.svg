<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-label="从规则走到证据, 再谈覆盖"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="462" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">从规则走到证据, 再谈覆盖</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">示例: 计划 32 条, 执行 28 条</text><rect x="22" y="88" width="330" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="36" y="116" font-size="19" fill="#243633" font-weight="600">规则 + 固定数据 → 预期</text><text x="36" y="142" font-size="16" fill="#52665d" font-weight="400">编号、顺序、总数、授权范围</text><rect x="408" y="88" width="330" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="422" y="116" font-size="19" fill="#243633" font-weight="600">执行 → 实际证据</text><text x="422" y="142" font-size="16" fill="#52665d" font-weight="400">响应状态、内容与数据变化</text><path d="M187 180 L280 228" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M573 180 L480 228" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="194" y="228" width="372" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="208" y="256" font-size="19" fill="#243633" font-weight="600">28 条可判定</text><text x="208" y="282" font-size="16" fill="#52665d" font-weight="400">26 通过, 2 失败</text><rect x="22" y="353" width="330" height="83" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="36" y="381" font-size="19" fill="#243633" font-weight="600">已执行通过率: 92.86%</text><text x="36" y="407" font-size="16" fill="#52665d" font-weight="400">26 / 28</text><rect x="408" y="353" width="330" height="83" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="422" y="381" font-size="19" fill="#243633" font-weight="600">另有 4 条阻塞</text><text x="422" y="407" font-size="16" fill="#52665d" font-weight="400">计划完成率: 28 / 32 = 87.5%</text><path d="M573 180 L720 334" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="653.5" y="253.0" font-size="13" fill="#52665d" font-weight="400">无有效执行</text><path d="M720 334 L720 353" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300 318 L187 353" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/></g></svg>