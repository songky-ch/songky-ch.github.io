<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-label="分项结果怎样形成结论"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="720" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">分项结果怎样形成结论</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">已知失败、未决项和任务完成分开记录</text><rect x="20" y="100" width="430" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="128" font-size="19" fill="#243633" font-weight="600">有已确认违规?</text><rect x="540" y="100" width="196" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="554" y="128" font-size="19" fill="#243633" font-weight="600">失败</text><text x="554" y="154" font-size="16" fill="#52665d" font-weight="400">保留未决项</text><path d="M450 150 L540 150" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="502.0" y="146.0" font-size="13" fill="#52665d" font-weight="400">是</text><path d="M235.0 200 L235.0 255" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="223.5" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="255" width="430" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="283" font-size="19" fill="#243633" font-weight="600">仍有未决项?</text><rect x="540" y="255" width="196" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="554" y="283" font-size="19" fill="#243633" font-weight="600">待复核</text><path d="M450 305 L540 305" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="502.0" y="301.0" font-size="13" fill="#52665d" font-weight="400">是</text><path d="M235.0 355 L235.0 410" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="378.5" font-size="13" fill="#52665d" font-weight="400">否</text><rect x="20" y="410" width="430" height="100" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="438" font-size="19" fill="#243633" font-weight="600">任务条件满足?</text><rect x="540" y="410" width="196" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="554" y="438" font-size="19" fill="#243633" font-weight="600">失败</text><text x="554" y="464" font-size="16" fill="#52665d" font-weight="400">任务未完成</text><path d="M450 460 L540 460" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="502.0" y="456.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M235.0 510 L235.0 568" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="242.0" y="535.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="568" width="716" height="92" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="596" font-size="19" fill="#243633" font-weight="600">通过</text><text x="34" y="622" font-size="16" fill="#52665d" font-weight="400">对应任务条件满足, 无违规与未决项</text></g></svg>