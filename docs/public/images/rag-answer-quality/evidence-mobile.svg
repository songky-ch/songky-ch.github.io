<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="同一回答, 四条判断线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="800" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">同一回答, 四条判断线</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">D3 方案推演 · 先固定材料与版本</text><rect x="20" y="100" width="320" height="146" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="128" font-size="18" fill="#243633" font-weight="600">独立参考</text><text x="34" y="162" font-size="17" fill="#243633" font-weight="400">对照回答 → 事实是否一致</text><text x="34" y="206" font-size="15" fill="#52665d" font-weight="400">C102 的字段与状态</text><rect x="20" y="270" width="320" height="146" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="298" font-size="18" fill="#243633" font-weight="600">实际上下文</text><text x="34" y="332" font-size="17" fill="#243633" font-weight="400">对照回答 → 断言是否受支持</text><text x="34" y="376" font-size="15" fill="#52665d" font-weight="400">保留模型实际看到的版本</text><rect x="20" y="440" width="320" height="146" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="468" font-size="18" fill="#243633" font-weight="600">用户要求</text><text x="34" y="502" font-size="17" fill="#243633" font-weight="400">对照回答 → 必答项是否完成</text><text x="34" y="546" font-size="15" fill="#52665d" font-weight="400">时间 / 局点 / 客户 / 现象</text><rect x="20" y="610" width="320" height="146" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="34" y="638" font-size="18" fill="#243633" font-weight="600">具体引用片段</text><text x="34" y="672" font-size="17" fill="#243633" font-weight="400">对照回答 → 引用是否支持结论</text><text x="34" y="716" font-size="15" fill="#52665d" font-weight="400">同一对象, 同一事实关系</text></g></svg>