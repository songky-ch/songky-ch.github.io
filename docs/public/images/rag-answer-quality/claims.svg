<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-label="四条断言的证据账目"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="680" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">四条断言的证据账目</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">固定拆分口径 · 不用平均分掩盖失败</text><text x="30" y="108" font-size="18" fill="#243633" font-weight="600">回答断言</text><text x="315" y="108" font-size="18" fill="#243633" font-weight="600">上下文</text><text x="470" y="108" font-size="18" fill="#243633" font-weight="600">对应引用</text><rect x="20" y="130" width="716" height="73" fill="#e6f4ee" stroke="#d6e1da" rx="6"/><text x="32" y="173" font-size="17" fill="#243633" font-weight="400">时间: 10-20 14:30</text><text x="315" y="173" font-size="18" fill="#243633" font-weight="600">支持</text><text x="470" y="173" font-size="16" fill="#243633" font-weight="400">C102 支持</text><rect x="20" y="221" width="716" height="73" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="32" y="264" font-size="17" fill="#243633" font-weight="400">局点: SITE-A</text><text x="315" y="264" font-size="18" fill="#243633" font-weight="600">支持</text><text x="470" y="264" font-size="16" fill="#243633" font-weight="400">C101 不能证明 C102</text><rect x="20" y="312" width="716" height="73" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="32" y="355" font-size="17" fill="#243633" font-weight="400">客户: CUSTOMER-X</text><text x="315" y="355" font-size="18" fill="#243633" font-weight="600">支持</text><text x="470" y="355" font-size="16" fill="#243633" font-weight="400">没有引用</text><rect x="20" y="403" width="716" height="73" fill="#fff0ea" stroke="#d6e1da" rx="6"/><text x="32" y="446" font-size="17" fill="#243633" font-weight="400">根因: 已确认连接器故障</text><text x="315" y="446" font-size="18" fill="#243633" font-weight="600">不支持</text><text x="470" y="446" font-size="16" fill="#243633" font-weight="400">C102 不支持已确认结论</text><rect x="20" y="520" width="716" height="130" fill="#ffffff" stroke="#d6e1da" rx="6"/><text x="36" y="551" font-size="17" fill="#243633" font-weight="400">必答项完成 3/4, 缺少“复测告警”; 支持比例同样为 3/4.</text><text x="36" y="590" font-size="17" fill="#243633" font-weight="400">引用可解析 3/3, 真正支持 1/3; 有效引用覆盖 1/4.</text><text x="36" y="627" font-size="18" fill="#243633" font-weight="600">结论: 失败. 根因状态、必答项与引用分别留证据.</text></g></svg>