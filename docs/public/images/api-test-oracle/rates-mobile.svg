<svg xmlns="http://www.w3.org/2000/svg" width="360" height="609" viewBox="0 0 360 609" role="img" aria-label="98% 和 97.5%, 分母不同"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="609" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">98% 和 97.5%, 分母不同</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">模拟 100 次执行 · 不是生产成功率</text><rect x="20" y="88" width="320" height="115" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">80 次合法请求</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">78 次结果正确</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">2 次错误保存 → 测试失败</text><rect x="20" y="223" width="320" height="92" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="251" font-size="17" fill="#243633" font-weight="600">20 次预期拒绝请求</text><text x="34" y="277" font-size="14" fill="#52665d" font-weight="400">20 次正确拒绝且没有写入</text><rect x="20" y="400" width="320" height="173" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="428" font-size="17" fill="#243633" font-weight="600">用哪个分母, 就回答哪个问题</text><text x="34" y="454" font-size="14" fill="#52665d" font-weight="400">测试通过率 = (78 + 20) / 100</text><text x="34" y="478" font-size="14" fill="#52665d" font-weight="400">= 98%</text><text x="34" y="502" font-size="14" fill="#52665d" font-weight="400">合法请求完成率 = 78 / 80</text><text x="34" y="526" font-size="14" fill="#52665d" font-weight="400">= 97.5%</text><text x="20" y="345" font-size="13" fill="#243633" font-weight="400">78 次通过 | 2 次失败 | 20 次正确拒绝</text><rect x="20" y="355" width="249.60000000000002" height="20" fill="#73a893"/><rect x="269.6" y="355" width="6.4" height="20" fill="#b85336"/><rect x="276.0" y="355" width="64.0" height="20" fill="#a9d4c2"/></g></svg>