<svg xmlns="http://www.w3.org/2000/svg" width="360" height="506" viewBox="0 0 360 506" role="img" aria-label="三个独立请求, 三组预期"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="506" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">三个独立请求, 三组预期</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">固定其他条件, 一次改变一个因素</text><rect x="20" y="90" width="320" height="114" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">合法输入 + 有权限</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">201 / OK</text><text x="34" y="168" font-size="14" fill="#52665d" font-weight="400">只新增 1 条, 字段正确</text><rect x="20" y="222" width="320" height="114" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="250" font-size="17" fill="#243633" font-weight="600">标题为 201 个 A</text><text x="34" y="276" font-size="14" fill="#52665d" font-weight="400">422 / INVALID_TITLE_LENGTH</text><text x="34" y="300" font-size="14" fill="#52665d" font-weight="400">不新增记录</text><rect x="20" y="354" width="320" height="114" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="382" font-size="17" fill="#243633" font-weight="600">合法输入 + 无创建权限</text><text x="34" y="408" font-size="14" fill="#52665d" font-weight="400">403 / FORBIDDEN</text><text x="34" y="432" font-size="14" fill="#52665d" font-weight="400">不新增记录</text></g></svg>