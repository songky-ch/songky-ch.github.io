<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-label="三个独立请求, 三组预期"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="418" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">三个独立请求, 三组预期</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">固定其他条件, 一次改变一个因素</text><rect x="24" y="90" width="310" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="118" font-size="19" fill="#243633" font-weight="600">合法输入 + 有权限</text><path d="M334 131 L386 131" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="386" y="90" width="350" height="82" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="400" y="118" font-size="19" fill="#243633" font-weight="600">201 / OK</text><text x="400" y="144" font-size="16" fill="#52665d" font-weight="400">只新增 1 条, 字段正确</text><rect x="24" y="194" width="310" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="222" font-size="19" fill="#243633" font-weight="600">标题为 201 个 A</text><path d="M334 235 L386 235" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="386" y="194" width="350" height="82" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="400" y="222" font-size="19" fill="#243633" font-weight="600">422 / INVALID_TITLE_LENGTH</text><text x="400" y="248" font-size="16" fill="#52665d" font-weight="400">不新增记录</text><rect x="24" y="298" width="310" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="326" font-size="19" fill="#243633" font-weight="600">合法输入 + 无创建权限</text><path d="M334 339 L386 339" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="386" y="298" width="350" height="82" rx="9" fill="#fff0ea" strok