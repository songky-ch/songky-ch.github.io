<svg xmlns="http://www.w3.org/2000/svg" width="760" height="361" viewBox="0 0 760 361" role="img" aria-label="断言的依据, 要独立于实际结果"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="361" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">断言的依据, 要独立于实际结果</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">期望来自约定, 实际结果来自观察</text><rect x="24" y="95" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="123" font-size="19" fill="#243633" font-weight="600">业务契约 → 预期</text><text x="38" y="149" font-size="16" fill="#52665d" font-weight="400">输入约束、权限、返回约定</text><text x="38" y="173" font-size="16" fill="#52665d" font-weight="400">保存结果与副作用边界</text><rect x="416" y="95" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="430" y="123" font-size="19" fill="#243633" font-weight="600">请求 → 实际结果</text><text x="430" y="149" font-size="16" fill="#52665d" font-weight="400">状态码、响应体</text><text x="430" y="173" font-size="16" fill="#52665d" font-weight="400">持久化记录、可见范围</text><path d="M184 199 L300 239" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M576 199 L460 239" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="194" y="239" width="372" height="96" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="208" y="267" font-size="19" fill="#243633" font-weight="600">逐项比较, 判定通过或失败</text><text x="208" y="293" font-size="16" fill="#52665d" font-weight="400">不能用实际结果替自己编一个预期.</text></g></svg>