<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-label="98% 和 97.5%, 分母不同"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="455" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">98% 和 97.5%, 分母不同</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">模拟 100 次执行 · 不是生产成功率</text><rect x="24" y="91" width="340" height="118" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="38" y="119" font-size="19" fill="#243633" font-weight="600">80 次合法请求</text><text x="38" y="145" font-size="16" fill="#52665d" font-weight="400">78 次正确 + 2 次错误保存</text><text x="38" y="169" font-size="16" fill="#52665d" font-weight="400">2 次业务错误使测试失败</text><rect x="396" y="91" width="340" height="118" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="410" y="119" font-size="19" fill="#243633" font-weight="600">20 次预期拒绝请求</text><text x="410" y="145" font-size="16" fill="#52665d" font-weight="400">20 次都正确拒绝且没有写入</text><text x="410" y="169" font-size="16" fill="#52665d" font-weight="400">这些拒绝属于测试通过</text><rect x="24" y="293" width="712" height="129" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="321" font-size="19" fill="#243633" font-weight="600">先说明分母, 再解释比例</text><text x="38" y="347" font-size="16" fill="#52665d" font-weight="400">测试通过率 = (78 + 20) / 100 = 98%</text><text x="38" y="371" font-size="16" fill="#52665d" font-weight="400">合法请求完成率 = 78 / 80 = 97.5%</text><text x="38" y="395" font-size="16" fill="#52665d" font-weight="400">错误保存也可能返回 2xx, HTTP 成功不等于业务正确.</text><text x="24" y="234" font-size="16" fill="#243633" font-weight="400">78 次通过 | 2 次失败 | 20 次正确拒绝</text><rect x="24" y="244" width="555.36" height="20" fill="#73a893"/><rect x="579.36" y="244" width="14.24" height="20" fill="#b85336"/><rect x="593.6" y="244" width="142.4" height="20" fill="#a9d4c2"/></g></svg>