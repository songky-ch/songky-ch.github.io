<svg xmlns="http://www.w3.org/2000/svg" width="360" height="554" viewBox="0 0 360 554" role="img" aria-label="断言的依据, 要独立于实际结果"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="554" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">断言的依据, 要独立于实际结果</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">期望来自约定, 实际结果来自观察</text><rect x="20" y="88" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">① 先写业务契约</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">什么输入应该被接受?</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">应该保存什么, 不应改变什么?</text><path d="M180 192 L180 225" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="225" width="320" height="104" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="253" font-size="17" fill="#243633" font-weight="600">② 再发请求并收集结果</text><text x="34" y="279" font-size="14" fill="#52665d" font-weight="400">状态 + 响应内容 + 数据变化</text><text x="34" y="303" font-size="14" fill="#52665d" font-weight="400">不能从响应反推预期</text><path d="M180 329 L180 363" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="363" width="320" height="147" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="391" font-size="17" fill="#243633" font-weight="600">③ 对照后才能判断</text><text x="34" y="417" font-size="14" fill="#52665d" font-weight="400">201 + OK 是协议观察点</text><text x="34" y="441" font-size="14" fill="#52665d" font-weight="400">字段一致、只新增一条是业务结果</text><text x="34" y="465" font-size="14" fill="#52665d" font-weight="400">拒绝输入时, 还要验证没有写入</text></g></svg>