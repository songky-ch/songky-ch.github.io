<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 790" role="img" aria-label="02  测试分类是坐标"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#087e8b"/></marker></defs><rect width="420" height="790" fill="#fbfcfd"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="20" y="34" font-size="22" fill="#17324d" text-anchor="start" font-weight="650">02  测试分类是坐标</text><text x="20" y="63" font-size="15" fill="#17324d" text-anchor="start" font-weight="400">分类回答不同问题, 不互相替代</text><rect x="20" y="88" width="380" height="84" rx="6" fill="#e7f4f0" stroke="#b7cbd9"/><text x="210.0" y="123.0" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">同一个活动可以有多种标签</text><text x="210.0" y="149.0" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">例: 自动回放历史日志并核对宽表</text><rect x="20" y="204" width="380" height="64" fill="#edf5fa"/><text x="34" y="231" font-size="19" fill="#087e8b" text-anchor="start" font-weight="650">范围</text><text x="34" y="256" font-size="17" fill="#17324d" text-anchor="start" font-weight="400">组件 / 集成 / 系统 / 验收</text><rect x="20" y="286" width="380" height="64" fill="#f3f5f7"/><text x="34" y="313" font-size="19" fill="#087e8b" text-anchor="start" font-weight="650">目的</text><text x="34" y="338" font-size="17" fill="#17324d" text-anchor="start" font-weight="400">功能 / 性能 / 安全 / 兼容</text><rect x="20" y="368" width="380" height="64" fill="#edf5fa"/><text x="34" y="395" font-size="19" fill="#087e8b" text-anchor="start" font-weight="650">依据</text><text x="34" y="420" font-size="17" fill="#17324d" text-anchor="start" font-weight="400">黑盒 / 白盒 / 经验驱动</text><rect x="20" y="450" width="380" height="64" fill="#f3f5f7"/><text x="34" y="477" font-size="19" fill="#087e8b" text-anchor="start" font-weight="650">策略</text><text x="34" y="502" font-size="17" fill="#17324d" text-anchor="start" font-weight="400">冒烟 / 回归 / 探索 / 修复确认</text><rect x="20" y="532" width="380" height="64" fill="#edf5fa"/><text x="34" y="559" font-size="19" fill="#087e8b" text-anchor="start" font-weight="650">执行</text><text x="34" y="584" font-size="17" fill="#17324d" text-anchor="start" font-weight="400">人工 / 自动化 / 混合</text><rect x="20" y="635" width="380" height="106" rx="6" fill="#fff4e5" stroke="#b7cbd9"/><text x="210.0" y="668.0" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">不要强行排成单一层级</text><text x="210.0" y="694.0" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">E2E 可与系统测试重叠</text><text x="210.0" y="720.0" font-size="18" fill="#17324d" text-anchor="middle" font-weight="400">回归可在多个阶段反复运行</text><text x="20" y="770" font-size="14" fill="#526879" text-anchor="start" font-weight="400">教学设计 · 合成业务 · 非企业内部架构</text></g></svg>