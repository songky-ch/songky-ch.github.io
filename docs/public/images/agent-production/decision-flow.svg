<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img" aria-labelledby="title"><title id="title">提案通过校验后执行, 未通过阻断, 执行后根据证据判定或对账</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#176b75"/></marker></defs><rect width="680" height="680" fill="#f4f7f9"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#173347"><text x="30" y="38" font-size="23" font-weight="700">业务 Agent: 决策不能替代执行证据</text><text x="30" y="67" font-size="15">教学职责图 · 不代表已经部署的服务</text><g fill="white" stroke="#718b9d"><rect x="40" y="100" width="340" height="65"/><rect x="40" y="210" width="340" height="65"/><rect x="430" y="210" width="220" height="65"/><rect x="40" y="335" width="340" height="65"/><rect x="40" y="460" width="340" height="65"/><rect x="430" y="460" width="220" height="65"/><rect x="40" y="580" width="340" height="65"/></g><g font-size="19"><text x="60" y="127">模型: 根据需求与证据提案</text><text x="60" y="151" font-size="15">工具、参数、剩余计划</text><text x="60" y="239">程序: 授权、语义、审批、预算</text><text x="60" y="262" font-size="15">动作版本变化必须重新检查</text><text x="449" y="238">阻断 / 等待补充</text><text x="449" y="261" font-size="15">新提案重新进入校验</text><text x="60" y="364">执行器: 调用业务工具</text><text x="60" y="389" font-size="15">保存操作 ID、观测与业务回执</text><text x="60" y="489">独立证据: 状态与业务断言</text><text x="60" y="514" font-size="15">不是“模型说成功”</text><text x="447" y="488">效果未知: 查询对账</text><text x="447" y="513" font-size="15">仍不明确 → 人工处理</text><text x="60" y="611">报告: 通过 / 失败及对应证据</text><text x="60" y="636" font-size="15">明确剩余工作与覆盖缺口</text></g><g fill="none" stroke="#176b75" stroke-width="2" marker-end="url(#a)"><path d="M210 165V210"/><path d="M380 242H430"/><path d="M540 210V132H380"/><path d="M210 275V335"/><path d="M210 400V460"/><path d="M380 492H430"/><path d="M210 525V580"/></g><g font-size="15"><text x="389" y="230">未通过</text><text x="224" y="311">通过</text><text x="385" y="477">不足</text><text x="224" y="560">证据充分</text></g></g></svg>