<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1050" role="img" aria-label="业务 Agent 职责与失败出口"><rect width="360" height="1050" fill="#f4f7f9"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#173347"><text x="20" y="34" font-size="23">从需求到可验证结果</text><text x="20" y="64" font-size="16">教学职责图, 不是已部署服务</text><rect x="20" y="90" width="320" height="82" fill="white" stroke="#718b9d"/><text x="34" y="120" font-size="18">1. 模型提出行动方案</text><text x="34" y="149" font-size="18">工具、参数与剩余计划</text><path d="M180 177V210m-7-8 7 8 7-8" fill="none" stroke="#176b75" stroke-width="2"/><rect x="20" y="222" width="320" height="140" fill="white" stroke="#718b9d"/><text x="34" y="252" font-size="18">2. 程序做执行前校验</text><text x="34" y="281" font-size="18">权限、语义、审批和预算</text><text x="34" y="310" font-size="18">未通过: 阻断或等待补充</text><text x="34" y="339" font-size="18">有新信息: 回到 1 生成新提案</text><path d="M180 367V400m-7-8 7 8 7-8" fill="none" stroke="#176b75" stroke-width="2"/><rect x="20" y="412" width="320" height="82" fill="white" stroke="#718b9d"/><text x="34" y="442" font-size="18">3. 校验通过才调用工具</text><text x="34" y="471" font-size="18">保存操作 ID、观测与业务回执</text><path d="M180 499V532m-7-8 7 8 7-8" fill="none" stroke="#176b75" stroke-width="2"/><rect x="20" y="544" width="320" height="140" fill="white" stroke="#718b9d"/><text x="34" y="574" font-size="18">4. 检查业务状态和断言</text><text x="34" y="603" font-size="18">证据不足: 标记效果未知</text><text x="34" y="632" font-size="18">先查询对账, 仍未知则交人工</text><text x="34" y="661" font-size="18">不能从超时推断未发生写入</text><path d="M180 689V722m-7-8 7 8 7-8" fill="none" stroke="#176b75" stroke-width="2"/><rect x="20" y="734" width="320" height="111" fill="white" stroke="#718b9d"/><text x="34" y="764" font-size="18">5. 汇总结果与证据</text><text x="34" y="793" font-size="18">充分: 报告通过或失败</text><text x="34" y="822" font-size="18">未知: 保留待办与覆盖缺口</text></g></svg>