<svg xmlns="http://www.w3.org/2000/svg" width="760" height="383" viewBox="0 0 760 383" role="img" aria-label="替换有时间范围, 不是线程隔离"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="383" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">替换有时间范围, 不是线程隔离</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">同步串行示例 · 正常或异常退出均恢复</text><rect x="24" y="120" width="220" height="122" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="148" font-size="19" fill="#243633" font-weight="600">进入之前</text><text x="38" y="174" font-size="16" fill="#52665d" font-weight="400">使用原绑定</text><path d="M244 181 L270 181" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="120" width="220" height="122" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="284" y="148" font-size="19" fill="#243633" font-weight="600">with 内部</text><text x="284" y="174" font-size="16" fill="#52665d" font-weight="400">配置 → 调用 → 断言</text><path d="M490 181 L516 181" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="516" y="120" width="220" height="122" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="530" y="148" font-size="19" fill="#243633" font-weight="600">退出以后</text><text x="530" y="174" font-size="16" fill="#52665d" font-weight="400">恢复原绑定</text><text x="24" y="297" font-size="18" fill="#243633" font-weight="400">目标调用必须发生在有效范围内.</text><text x="24" y="337" font-size="16" fill="#243633" font-weight="400">同进程并发代码也可能看到该替换; with 不提供线程隔离.</text></g></svg>