<svg xmlns="http://www.w3.org/2000/svg" width="360" height="678" viewBox="0 0 360 678" role="img" aria-label="定义处和使用处是两个绑定"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="678" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">定义处和使用处是两个绑定</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">前提: summary 已完成 from 导入</text><rect x="20" y="88" width="320" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">导入后: 两个名字</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">gateway.fetch_issues</text><text x="34" y="166" font-size="14" fill="#52665d" font-weight="400">summary.fetch_issues</text><path d="M180 180 L180 217" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="217" width="320" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="245" font-size="17" fill="#243633" font-weight="600">都指向同一个原函数</text><text x="22" y="341" font-size="17" fill="#243633" font-weight="600">只替换 gateway 的名字以后:</text><rect x="20" y="363" width="320" height="102" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="391" font-size="17" fill="#243633" font-weight="600">gateway.fetch_issues</text><text x="34" y="417" font-size="14" fill="#52665d" font-weight="400">→ Mock 替身</text><rect x="20" y="487" width="320" height="102" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="515" font-size="17" fill="#243633" font-weight="600">summary.fetch_issues</text><text x="34" y="541" font-size="14" fill="#52665d" font-weight="400">→ 原函数仍在这里</text><text x="22" y="635" font-size="14" fill="#243633" font-weight="400">摘要查 summary 的名字, 因而没被替换.</text></g></svg>