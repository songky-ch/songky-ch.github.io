<svg xmlns="http://www.w3.org/2000/svg" width="760" height="477" viewBox="0 0 760 477" role="img" aria-label="顺着调用表达式确定位置"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="477" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">顺着调用表达式确定位置</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">两个替代版本, 不叠加执行</text><rect x="24" y="94" width="712" height="113" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="122" font-size="19" fill="#243633" font-weight="600">from issue_gateway import fetch_issues</text><text x="38" y="148" font-size="16" fill="#52665d" font-weight="400">摘要直接查自己的 fetch_issues → patch issue_summary.fetch_issues</text><rect x="24" y="258" width="712" height="113" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="286" font-size="19" fill="#243633" font-weight="600">import issue_gateway</text><text x="38" y="312" font-size="16" fill="#52665d" font-weight="400">摘要先取模块, 再取函数 → patch issue_gateway.fetch_issues</text><text x="24" y="239" font-size="16" fill="#52665d" font-weight="400">另一个独立版本:</text><text x="24" y="425" font-size="18" fill="#243633" font-weight="400">不是永远替换定义处, 也不是永远替换当前文件.</text></g></svg>