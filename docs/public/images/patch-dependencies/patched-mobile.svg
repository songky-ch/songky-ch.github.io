<svg xmlns="http://www.w3.org/2000/svg" width="360" height="612" viewBox="0 0 360 612" role="img" aria-label="真正替换摘要查找的名字"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="612" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">真正替换摘要查找的名字</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">patch(&quot;issue_summary.fetch_issues&quot;)</text><rect x="20" y="90" width="320" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">进入 with</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">summary 的名字暂时指向替身</text><path d="M180 178 L180 215" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="215" width="320" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="243" font-size="17" fill="#243633" font-weight="600">执行真实 build_summary</text><text x="34" y="269" font-size="14" fill="#52665d" font-weight="400">从替身获得 total=2 和两个编号</text><path d="M180 303 L180 340" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="340" width="320" height="88" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="368" font-size="17" fill="#243633" font-weight="600">两类证据分别检查</text><text x="34" y="394" font-size="14" fill="#52665d" font-weight="400">输出符合预期; 参数、次数正确</text><path d="M180 428 L180 465" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="465" width="320" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="493" font-size="17" fill="#243633" font-weight="600">退出 with</text><text x="34" y="519" font-size="14" fill="#52665d" font-weight="400">恢复该名字原来的绑定</text></g></svg>