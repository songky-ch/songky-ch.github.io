<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-label="替换有时间范围, 不是线程隔离"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="560" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">替换有时间范围, 不是线程隔离</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">同步串行示例 · 正常或异常退出均恢复</text><rect x="20" y="88" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">进入之前</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">原绑定 → 原依赖</text><path d="M180 182 L180 220" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="220" width="320" height="94" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="248" font-size="17" fill="#243633" font-weight="600">with 内部</text><text x="34" y="274" font-size="14" fill="#52665d" font-weight="400">配置替身 → 调用目标 → 断言</text><path d="M180 314 L180 352" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="352" width="320" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="380" font-size="17" fill="#243633" font-weight="600">退出以后</text><text x="34" y="406" font-size="14" fill="#52665d" font-weight="400">原绑定恢复 → 原依赖</text><text x="22" y="516" font-size="14" fill="#243633" font-weight="400">在范围外才调用, 就不会使用这个替身.</text></g></svg>