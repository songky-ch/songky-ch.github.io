<svg xmlns="http://www.w3.org/2000/svg" width="760" height="571" viewBox="0 0 760 571" role="img" aria-label="主检查和清理都要有出口"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="571" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">主检查和清理都要有出口</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">只清理已确认属于本次执行的数据</text><rect x="20" y="88" width="420" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="19" fill="#243633" font-weight="600">准备条件通过?</text><text x="34" y="142" font-size="16" fill="#52665d" font-weight="400">独占标记, 初始无记录</text><rect x="510" y="88" width="226" height="104" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="524" y="116" font-size="19" fill="#243633" font-weight="600">否</text><text x="524" y="142" font-size="16" fill="#52665d" font-weight="400">未执行</text><text x="524" y="166" font-size="16" fill="#52665d" font-weight="400">不清理</text><path d="M440 129 L510 129" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M230.0 170 L230.0 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="237.0" y="190.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="218" width="716" height="78" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="246" font-size="19" fill="#243633" font-weight="600">执行主检查</text><text x="34" y="272" font-size="16" fill="#52665d" font-weight="400">保留通过或失败的原始证据</text><path d="M180 296 L180 332" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="310.0" font-size="13" fill="#52665d" font-weight="400">通过</text><path d="M575 296 L575 332" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="582.0" y="310.0" font-size="13" fill="#52665d" font-weight="400">失败</text><rect x="20" y="332" width="320" height="65" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="360" font-size="19" fill="#243633" font-weight="600">主检查通过</text><rect x="416" y="332" width="320" height="65" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="430" y="360" font-size="19" fill="#243633" font-weight="600">保留主错误</text><path d="M180 397 L300 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M575 397 L460 442" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="194" y="442" width="372" height="94" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="208" y="470" font-size="19" fill="#243633" font-weight="600">限定范围清理 → 合并报告</text><text x="208" y="496" font-size="16" fill="#52665d" font-weight="400">同时保留主检查与清理结果</text></g></svg>