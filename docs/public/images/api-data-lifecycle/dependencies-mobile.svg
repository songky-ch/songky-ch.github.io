<svg xmlns="http://www.w3.org/2000/svg" width="360" height="662" viewBox="0 0 360 662" role="img" aria-label="场景内部关联, 场景之间隔离"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="662" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">场景内部关联, 场景之间隔离</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">共用准备方法, 每次拥有独立记录</text><text x="22" y="101" font-size="17" fill="#243633" font-weight="600">场景 A: 创建后更新</text><text x="197" y="101" font-size="17" fill="#243633" font-weight="600">场景 B: 权限</text><rect x="20" y="123" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="151" font-size="17" fill="#243633" font-weight="600">独立标记 A</text><rect x="193" y="123" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="207" y="151" font-size="17" fill="#243633" font-weight="600">独立标记 B</text><path d="M93 198 L93 225" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266 198 L266 225" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="225" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="253" font-size="17" fill="#243633" font-weight="600">创建记录 A</text><rect x="193" y="225" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="207" y="253" font-size="17" fill="#243633" font-weight="600">准备记录 B</text><path d="M93 300 L93 327" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266 300 L266 327" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="327" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="355" font-size="17" fill="#243633" font-weight="600">查询 A</text><rect x="193" y="327" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="207" y="355" font-size="17" fill="#243633" font-weight="600">无权更新 B</text><path d="M93 402 L93 429" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266 402 L266 429" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="429" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="457" font-size="17" fill="#243633" font-weight="600">更新并再查 A</text><rect x="193" y="429" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="207" y="457" font-size="17" fill="#243633" font-weight="600">403, B 不变</text><path d="M93 504 L93 531" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M266 504 L266 531" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="531" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="559" font-size="17" fill="#243633" font-weight="600">清理 A</text><rect x="193" y="531" width="147" height="75" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="207" y="559" font-size="17" fill="#243633" font-weight="600">清理 B</text><text x="22" y="648" font-size="14" fill="#243633" font-weight="400">两列之间没有“必须先成功”的箭头.</text></g></svg>