<svg xmlns="http://www.w3.org/2000/svg" width="360" height="608" viewBox="0 0 360 608" role="img" aria-label="关联值与判定依据走两条线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="608" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">关联值与判定依据走两条线</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">动态编号来自响应, 业务预期来自输入</text><rect x="20" y="88" width="320" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">创建响应 → issue_id</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">后续查询、更新都使用这个编号</text><path d="M180 176 L180 213" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="213" width="320" height="87" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="241" font-size="17" fill="#243633" font-weight="600">执行更新 → 再查详情</text><text x="34" y="267" font-size="14" fill="#52665d" font-weight="400">得到当前实际标题</text><path d="M180 300 L180 337" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="337" width="320" height="90" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="365" font-size="17" fill="#243633" font-weight="600">比较实际标题与更新输入</text><text x="34" y="391" font-size="14" fill="#52665d" font-weight="400">不是只比较两个接口的返回值</text><rect x="20" y="482" width="320" height="90" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="510" font-size="17" fill="#243633" font-weight="600">测试侧独立保留 updated.title</text><text x="34" y="536" font-size="14" fill="#52665d" font-weight="400">预期: 产测复测结果异常-已补充证据</text><path d="M180 482 L180 427" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="450.5" font-size="13" fill="#52665d" font-weight="400">提供预期</text></g></svg>