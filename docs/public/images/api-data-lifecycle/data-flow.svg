<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-label="关联值与判定依据走两条线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="432" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">关联值与判定依据走两条线</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">动态编号来自响应, 业务预期来自输入</text><rect x="24" y="90" width="310" height="87" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="118" font-size="19" fill="#243633" font-weight="600">创建响应 → issue_id</text><text x="38" y="144" font-size="16" fill="#52665d" font-weight="400">关联: 后续操作哪条记录</text><rect x="426" y="90" width="310" height="87" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="440" y="118" font-size="19" fill="#243633" font-weight="600">测试侧保留更新输入</text><text x="440" y="144" font-size="16" fill="#52665d" font-weight="400">预期: updated.title</text><path d="M179 177 L179 225" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="225" width="310" height="87" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="253" font-size="19" fill="#243633" font-weight="600">更新 → 再查详情</text><text x="38" y="279" font-size="16" fill="#52665d" font-weight="400">实际: reloaded.title</text><path d="M334 269 L426 269" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M581 177 L581 225" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="588.0" y="197.0" font-size="13" fill="#52665d" font-weight="400">独立预期</text><rect x="426" y="225" width="310" height="87" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="440" y="253" font-size="19" fill="#243633" font-weight="600">比较实际值与预期值</text><text x="24" y="362" font-size="17" fill="#243633" font-weight="400">两个接口可能一致地返回旧标题. 一致不等于符合更新要求.</text><text x="24" y="396" font-size="16" fill="#52665d" font-weight="400">同时核对编号、客户、创建人及记录数量等不变量.</text></g></svg>