<svg xmlns="http://www.w3.org/2000/svg" width="360" height="682" viewBox="0 0 360 682" role="img" aria-label="主检查和清理都要有出口"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="682" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">主检查和清理都要有出口</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">只清理已确认属于本次执行的数据</text><rect x="20" y="88" width="190" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">准备条件通过?</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">独占标记, 初始无记录</text><rect x="236" y="88" width="104" height="104" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="250" y="116" font-size="17" fill="#243633" font-weight="600">否</text><text x="250" y="142" font-size="14" fill="#52665d" font-weight="400">未执行</text><text x="250" y="166" font-size="14" fill="#52665d" font-weight="400">不清理</text><path d="M210 129 L236 129" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M115.0 170 L115.0 218" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="122.0" y="190.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="218" width="320" height="78" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="246" font-size="17" fill="#243633" font-weight="600">执行主检查</text><text x="34" y="272" font-size="14" fill="#52665d" font-weight="400">保留通过或失败的原始证据</text><path d="M100 296 L100 337" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="107.0" y="312.5" font-size="13" fill="#52665d" font-weight="400">通过</text><path d="M260 296 L260 337" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="267.0" y="312.5" font-size="13" fill="#52665d" font-weight="400">失败</text><rect x="20" y="337" width="145" height="65" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="365" font-size="17" fill="#243633" font-weight="600">主检查通过</text><rect x="195" y="337" width="145" height="65" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="209" y="365" font-size="17" fill="#243633" font-weight="600">保留主错误</text><path d="M92 402 L140 444" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M267 402 L220 444" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="444" width="320" height="82" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="472" font-size="17" fill="#243633" font-weight="600">限定标记和所有者清理</text><text x="34" y="498" font-size="14" fill="#52665d" font-weight="400">记录清理成功或残留原因</text><path d="M180 526 L180 564" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="564" width="320" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="592" font-size="17" fill="#243633" font-weight="600">合并报告, 不覆盖原错误</text><text x="34" y="618" font-size="14" fill="#52665d" font-weight="400">主检查结果 + 清理结果</text></g></svg>