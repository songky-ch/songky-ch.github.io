<svg xmlns="http://www.w3.org/2000/svg" width="360" height="532" viewBox="0 0 360 532" role="img" aria-label="两个结果维度, 不能相互抵消"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="532" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">两个结果维度, 不能相互抵消</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">主检查 × 清理 · 示例报告判定</text><rect x="20" y="88" width="320" height="86" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="116" font-size="17" fill="#243633" font-weight="600">主通过 + 清理成功</text><text x="34" y="142" font-size="14" fill="#52665d" font-weight="400">本场景通过</text><rect x="20" y="193" width="320" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="221" font-size="17" fill="#243633" font-weight="600">主失败 + 清理成功</text><text x="34" y="247" font-size="14" fill="#52665d" font-weight="400">业务失败仍然保留</text><rect x="20" y="298" width="320" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="326" font-size="17" fill="#243633" font-weight="600">主通过 + 清理失败</text><text x="34" y="352" font-size="14" fill="#52665d" font-weight="400">报告收尾失败及残留</text><rect x="20" y="403" width="320" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="34" y="431" font-size="17" fill="#243633" font-weight="600">主失败 + 清理失败</text><text x="34" y="457" font-size="14" fill="#52665d" font-weight="400">保留两组错误证据</text></g></svg>