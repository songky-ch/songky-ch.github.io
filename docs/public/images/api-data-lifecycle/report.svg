<svg xmlns="http://www.w3.org/2000/svg" width="760" height="397" viewBox="0 0 760 397" role="img" aria-label="两个结果维度, 不能相互抵消"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="397" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">两个结果维度, 不能相互抵消</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">主检查 × 清理 · 教学报告判定</text><text x="202" y="111" font-size="19" fill="#243633" font-weight="600">清理成功</text><text x="480" y="111" font-size="19" fill="#243633" font-weight="600">清理失败</text><text x="22" y="181" font-size="19" fill="#243633" font-weight="600">主通过</text><text x="22" y="291" font-size="19" fill="#243633" font-weight="600">主失败</text><rect x="162" y="133" width="272" height="92" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="176" y="161" font-size="19" fill="#243633" font-weight="600">本场景通过</text><rect x="458" y="133" width="272" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="472" y="161" font-size="19" fill="#243633" font-weight="600">收尾失败</text><text x="472" y="187" font-size="16" fill="#52665d" font-weight="400">保留残留对象和原因</text><rect x="162" y="249" width="272" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="176" y="277" font-size="19" fill="#243633" font-weight="600">业务失败仍然成立</text><rect x="458" y="249" width="272" height="92" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="472" y="277" font-size="19" fill="#243633" font-weight="600">两项都失败</text><text x="472" y="303" font-size="16" fill="#52665d" font-weight="400">两个错误分别记录</text><text x="24" y="377" font-size="16" fill="#243633" font-weight="400">准备失败单列为未执行, 不混入已执行通过率.</text></g></svg>