<svg xmlns="http://www.w3.org/2000/svg" width="760" height="374" viewBox="0 0 760 374" role="img" aria-label="场景内部关联, 场景之间隔离"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="374" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">场景内部关联, 场景之间隔离</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">共用准备方法, 每次拥有独立记录</text><text x="24" y="96" font-size="18" fill="#243633" font-weight="600">A: 关联</text><rect x="24" y="110" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="138" font-size="19" fill="#243633" font-weight="600">准备 A</text><path d="M152 147 L170 147" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="170" y="110" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="184" y="138" font-size="19" fill="#243633" font-weight="600">创建 A</text><path d="M298 147 L316 147" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="316" y="110" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="330" y="138" font-size="19" fill="#243633" font-weight="600">查询 A</text><path d="M444 147 L462 147" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="462" y="110" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="476" y="138" font-size="19" fill="#243633" font-weight="600">更新 A</text><path d="M590 147 L608 147" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="608" y="110" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="622" y="138" font-size="19" fill="#243633" font-weight="600">再查 A</text><text x="24" y="218" font-size="18" fill="#243633" font-weight="600">B: 权限</text><rect x="24" y="232" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="38" y="260" font-size="19" fill="#243633" font-weight="600">准备 B</text><path d="M152 269 L170 269" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="170" y="232" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="184" y="260" font-size="19" fill="#243633" font-weight="600">创建 B</text><path d="M298 269 L316 269" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="316" y="232" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="330" y="260" font-size="19" fill="#243633" font-weight="600">无权更新</text><path d="M444 269 L462 269" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="462" y="232" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="476" y="260" font-size="19" fill="#243633" font-weight="600">拒绝且不变</text><path d="M590 269 L608 269" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="608" y="232" width="128" height="74" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="622" y="260" font-size="19" fill="#243633" font-weight="600">清理 B</text><text x="24" y="351" font-size="16" fill="#243633" font-weight="400">A 场景也独立清理. B 不读取 A 留下的编号或成功状态.</text></g></svg>