<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1520" role="img" aria-labelledby="title desc"><title id="title">为什么 3/4 仍然不能发布</title><desc id="desc">新版五条任务三通过一失败一未知. 可判定通过率3/4, 证据覆盖4/5. 证据不全走阻断补证据出口, 证据齐全再检查五条是否全过. 有失败则阻断修复, 全过才允许. 两个阻断都回到原始五条重新回放.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1520" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">为什么 3/4 仍然不能发布</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">样本与门禁 / 五条任务始终都在场</text><rect x="48" y="130" width="584" height="142" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><rect x="58" y="152" width="108" height="94" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="112" y="190" font-size="26" fill="#087f73" text-anchor="middle" font-weight="650">通过</text><text x="112" y="229" font-size="23" fill="#20323f" text-anchor="middle" font-weight="400">正常</text><rect x="172" y="152" width="108" height="94" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="226" y="190" font-size="26" fill="#087f73" text-anchor="middle" font-weight="650">通过</text><text x="226" y="229" font-size="23" fill="#20323f" text-anchor="middle" font-weight="400">店已修</text><rect x="286" y="152" width="108" height="94" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="340" y="190" font-size="26" fill="#087f73" text-anchor="middle" font-weight="650">通过</text><text x="340" y="229" font-size="23" fill="#20323f" text-anchor="middle" font-weight="400">同义</text><rect x="400" y="152" width="108" height="94" rx="0" fill="#ffffff" stroke="#96530c" stroke-width="2"/><text x="454" y="190" font-size="26" fill="#96530c" text-anchor="middle" font-weight="650">失败</text><text x="454" y="229" font-size="23" fill="#20323f" text-anchor="middle" font-weight="400">缺报告</text><rect x="514" y="152" width="108" height="94" rx="0" fill="#ffffff" stroke="#5b6871" stroke-width="2"/><text x="568" y="190" font-size="26" fill="#5b6871" text-anchor="middle" font-weight="650">未知</text><text x="568" y="229" font-size="23" fill="#20323f" text-anchor="middle" font-weight="400">缺记录</text><text x="340" y="320" font-size="28" fill="#20323f" text-anchor="middle" font-weight="650">v2: 3 通过 + 1 失败 + 1 未知</text><text x="180" y="399" font-size="52" fill="#087f73" text-anchor="middle" font-weight="700">3/4</text><text x="500" y="399" font-size="52" fill="#385d98" text-anchor="middle" font-weight="700">4/5</text><text x="180" y="444" font-size="25" fill="#20323f" text-anchor="middle" font-weight="400">可判定样本通过率</text><text x="500" y="444" font-size="24" fill="#20323f" text-anchor="middle" font-weight="400">全部样本证据覆盖率</text><path d="M340 478V580" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="356" y="535" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">按示例条件检查</text><polygon points="340,580 530,650 340,720 150,650" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="340" y="659" font-size="25" fill="#20323f" text-anchor="middle" font-weight="600">五条证据都齐全?</text><path d="M530 650H600V790" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="610" y="740" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">否</text><rect x="390" y="790" width="250" height="110" rx="0" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="410" y="830" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">阻断: 补证据</text><text x="410" y="870" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">缺失项仍保留</text><path d="M340 720V760H215V930" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="235" y="839" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">是</text><polygon points="215,930 385,1010 215,1090 45,1010" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="215" y="1019" font-size="25" fill="#20323f" text-anchor="middle" font-weight="600">五条是否全通过?</text><path d="M385 1010H515V1050" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="430" y="998" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">否</text><rect x="390" y="1050" width="250" height="110" rx="0" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="410" y="1090" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">阻断: 修任务</text><text x="410" y="1130" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">报告缺失仍要修</text><path d="M215 1090V1240" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="235" y="1188" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">是</text><rect x="48" y="1240" width="264" height="110" rx="0" fill="#edf6f2" stroke="#087f73" stroke-width="2"/><text x="68" y="1280" font-size="27" fill="#087f73" text-anchor="start" font-weight="650">允许 / ALLOW</text><text x="68" y="1320" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">仅限本例门禁</text><path d="M640 845H665V1200H505V1240" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><path d="M640 1105H665" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7"/><rect x="365" y="1240" width="280" height="110" rx="0" fill="#ffffff" stroke="#96530c" stroke-width="2"/><text x="385" y="1280" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">原始 5 条重新回放</text><text x="385" y="1320" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">补证据或修复之后</text><path d="M505 1350V1390H20V200H48" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="48" y="1445" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">两种阻断都要重跑; 未知不从总体分母消失.</text><text x="48" y="1485" font-size="23" fill="#5b6871" text-anchor="start" font-weight="400">教学条件: 5 条证据齐全且全过; 非通用上线阈值.</text></g></svg>
