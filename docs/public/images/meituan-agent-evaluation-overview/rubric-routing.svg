<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1275" role="img" aria-labelledby="title desc"><title id="title">先补证据, 再分别判断两种错</title><desc id="desc">必要过程证据缺失时未知并补采集, 回到证据检查. 证据齐全后独立判断行为是否出错与旧标准是否误判. 是则分别修系统和标准, 否则保留结论. 两路可同时产生变更, 汇入固定条件回测.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1275" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">先补证据, 再分别判断两种错</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">判定路径 / 行为错误与评分误判不是互斥项</text><rect x="90" y="130" width="500" height="90" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="110" y="170" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">运行记录 + 业务要求</text><path d="M340 220V240" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><polygon points="340,240 530,300 340,360 150,300" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="340" y="309" font-size="25" fill="#20323f" text-anchor="middle" font-weight="600">必要证据齐全?</text><path d="M530 300H650V510H624" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="570" y="284" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">不足</text><rect x="380" y="450" width="244" height="130" rx="0" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="400" y="490" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">未知 / 补采集</text><text x="400" y="530" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">不硬判行为错误</text><text x="400" y="568" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">补齐后重新检查</text><path d="M502 580V610H666V230H340V240" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><path d="M340 360V400H190V450" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="230" y="394" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">齐全</text><rect x="56" y="450" width="268" height="130" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="76" y="490" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">按业务事实复核</text><text x="76" y="530" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">得到业务对错</text><text x="76" y="568" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">再比较旧规则结论</text><path d="M190 580V620H180V650" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M190 620H500V650" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><polygon points="180,650 305,710 180,770 55,710" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="180" y="719" font-size="25" fill="#20323f" text-anchor="middle" font-weight="600">行为出错?</text><polygon points="500,650 625,710 500,770 375,710" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="500" y="719" font-size="25" fill="#20323f" text-anchor="middle" font-weight="600">标准误判?</text><path d="M180 770V820H105V860" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="107" y="813" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">是</text><path d="M305 710H335V820H255V860" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="310" y="807" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">否</text><path d="M500 770V820H425V860" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="427" y="813" font-size="24" fill="#385d98" text-anchor="start" font-weight="400">是</text><path d="M625 710H660V820H575V860" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="622" y="807" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">否</text><rect x="40" y="860" width="130" height="110" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="105" y="905" font-size="24" fill="#087f73" text-anchor="middle" font-weight="650">修系统</text><text x="105" y="946" font-size="24" fill="#20323f" text-anchor="middle" font-weight="400">产生变更</text><rect x="190" y="860" width="130" height="110" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="255" y="905" font-size="24" fill="#20323f" text-anchor="middle" font-weight="650">保留结论</text><text x="255" y="946" font-size="24" fill="#20323f" text-anchor="middle" font-weight="400">无需改动</text><rect x="360" y="860" width="130" height="110" rx="0" fill="#ffffff" stroke="#385d98" stroke-width="2"/><text x="425" y="905" font-size="24" fill="#385d98" text-anchor="middle" font-weight="650">修标准</text><text x="425" y="946" font-size="24" fill="#20323f" text-anchor="middle" font-weight="400">校准规则</text><rect x="510" y="860" width="130" height="110" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="575" y="905" font-size="24" fill="#20323f" text-anchor="middle" font-weight="650">保留规则</text><text x="575" y="946" font-size="24" fill="#20323f" text-anchor="middle" font-weight="400">无需改动</text><path d="M105 970V1030H340" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><path d="M255 970V1030H340" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><path d="M425 970V1030H340" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><path d="M575 970V1030H340" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><path d="M340 1030V1080" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="90" y="1080" width="500" height="116" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="110" y="1120" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">保存结论与修改, 一起回测</text><text x="110" y="1160" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">两路独立, 同一条样本可同时命中</text><text x="40" y="1240" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">美团 4.3 的教学展开; 分支对应配套脚本.</text></g></svg>
