<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 930" role="img" aria-labelledby="title desc">
  <title id="title">多轮任务的证据关联</title>
  <desc id="desc">同一会话中的两轮执行, 通过任务与轮次关联. 第二轮修改日期后, 需要核对新的工具参数、返回数据和最终报告.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#52647e" stroke-width="1.8"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d} .heading{font-size:28px;font-weight:700} .label{font-size:24px;font-weight:600} .body{font-size:22px} .small{font-size:20px;fill:#405574} .line{fill:none;stroke:#52647e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="880" height="930" rx="20" fill="#f4f7fc"/>
  <text x="440" y="53" class="heading" text-anchor="middle">跨轮目标与单次执行分层关联</text>
  <text x="440" y="88" class="small" text-anchor="middle">教学示意, 标识并非遥测协议报文</text>
  <rect x="65" y="120" width="750" height="88" rx="14" fill="#e3ecff" stroke="#5982c4"/>
  <text x="440" y="155" class="label" text-anchor="middle">会话 S1 · 报告任务 T1</text>
  <text x="440" y="189" class="body" text-anchor="middle">保留跨轮约束, 每轮可以有独立 Trace</text>
  <path d="M255 208V247" class="line"/>
  <path d="M625 208V247" class="line"/>
  <rect x="65" y="250" width="360" height="128" rx="14" fill="#fff" stroke="#b9c8de"/>
  <text x="245" y="289" class="label" text-anchor="middle">第 1 轮 · Trace A</text>
  <text x="245" y="329" class="body" text-anchor="middle">“查 A 店上周销售”</text>
  <text x="245" y="360" class="small" text-anchor="middle">初始条件: A 店 + 上周</text>
  <rect x="455" y="250" width="360" height="128" rx="14" fill="#def3e9" stroke="#5e9b81"/>
  <text x="635" y="289" class="label" text-anchor="middle">第 2 轮 · Trace B</text>
  <text x="635" y="329" class="body" text-anchor="middle">“改为本周, 仍看 A 店”</text>
  <text x="635" y="360" class="small" text-anchor="middle">更新条件: A 店 + 本周</text>
  <path d="M635 378V417" class="line"/>
  <rect x="65" y="420" width="750" height="86" rx="14" fill="#fff" stroke="#b9c8de"/>
  <text x="440" y="455" class="label" text-anchor="middle">工具 Span: 核对实际参数</text>
  <text x="440" y="489" class="body" text-anchor="middle">shop=A, period=本周, parent=第 2 轮根操作</text>
  <path d="M440 506V542" class="line"/>
  <rect x="65" y="545" width="750" height="86" rx="14" fill="#fff" stroke="#b9c8de"/>
  <text x="440" y="580" class="label" text-anchor="middle">返回数据: 核对事实和口径</text>
  <text x="440" y="614" class="body" text-anchor="middle">门店、日期、数值、来源版本</text>
  <path d="M440 631V667" class="line"/>
  <rect x="65" y="670" width="750" height="86" rx="14" fill="#fff" stroke="#b9c8de"/>
  <text x="440" y="705" class="label" text-anchor="middle">报告产物: 独立验证交付状态</text>
  <text x="440" y="739" class="body" text-anchor="middle">报告存在, 内容仍为 A 店 + 本周</text>
  <path d="M440 756V792" class="line"/>
  <rect x="65" y="795" width="750" height="91" rx="14" fill="#fff3dc" stroke="#c49843"/>
  <text x="440" y="832" class="label" text-anchor="middle">沿证据定位偏差, 再验证根因</text>
  <text x="440" y="868" class="body" text-anchor="middle">状态更新? 参数构造? 工具处理? 报告生成?</text>
</svg>
