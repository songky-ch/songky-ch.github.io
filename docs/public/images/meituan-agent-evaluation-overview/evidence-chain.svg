<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1495" role="img" aria-labelledby="title desc"><title id="title">第二轮改了要求, 错在哪一步</title><desc id="desc">会话中第一轮要求上周, 第二轮改成本周仍看A店. 第二轮执行向工具传参数, 接收数据, 保存并读取报告. 操作属于同次追踪. 异常表指出参数、数据、产物出错时各应回查的证据, 不把异常直接当根因.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1495" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">第二轮改了要求, 错在哪一步</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">时序 / 业务会话与单次追踪分开关联</text><rect x="48" y="130" width="584" height="102" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="72" y="172" font-size="28" fill="#20323f" text-anchor="start" font-weight="650">会话 S1 · 同一个报告任务 T1</text><text x="72" y="212" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">应用层把两轮要求关联起来</text><text x="48" y="290" font-size="26" fill="#385d98" text-anchor="start" font-weight="650">第 1 轮 / Trace A</text><text x="48" y="332" font-size="26" fill="#20323f" text-anchor="start" font-weight="400">“查 A 店上周销售” → A 店 + 上周</text><path d="M340 352V380" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="48" y="390" width="584" height="105" rx="0" fill="#edf6f2" stroke="#087f73" stroke-width="2"/><text x="72" y="432" font-size="28" fill="#087f73" text-anchor="start" font-weight="650">第 2 轮 / Trace B</text><text x="72" y="475" font-size="25" fill="#20323f" text-anchor="start" font-weight="400">“改为本周, 仍看 A 店” → A 店 + 本周</text><text x="130" y="555" font-size="27" fill="#20323f" text-anchor="middle" font-weight="650">这一轮执行</text><text x="550" y="555" font-size="27" fill="#20323f" text-anchor="middle" font-weight="650">工具与产物</text><path d="M130 585V1030" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7"/><path d="M550 585V1030" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7"/><rect x="155" y="593" width="370" height="40" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><text x="340" y="625" font-size="25" fill="#20323f" text-anchor="middle" font-weight="400">查询: A 店 + 本周</text><path d="M130 650H550" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="155" y="723" width="370" height="40" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><text x="340" y="755" font-size="25" fill="#20323f" text-anchor="middle" font-weight="400">返回: 门店、周期与数值</text><path d="M550 780H130" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="155" y="848" width="370" height="40" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><text x="340" y="880" font-size="25" fill="#20323f" text-anchor="middle" font-weight="400">生成并保存报告</text><path d="M130 905H550" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="155" y="953" width="370" height="40" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><text x="340" y="985" font-size="25" fill="#20323f" text-anchor="middle" font-weight="400">读取报告: A 店 + 本周</text><path d="M550 1010H130" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="48" y="1080" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">追踪内各操作有跨度与父子关联.</text><rect x="48" y="1120" width="584" height="260" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="68" y="1162" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">异常出现后, 回查哪一段证据?</text><text x="68" y="1220" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">参数仍是上周</text><path d="M315 1212H360" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="380" y="1220" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">查状态更新 / 选参</text><text x="68" y="1280" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">参数对, 返回错</text><path d="M315 1272H360" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="380" y="1280" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">查工具处理</text><text x="68" y="1340" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">数据对, 报告错</text><path d="M315 1332H360" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="380" y="1340" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">查产物生成</text><text x="48" y="1420" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">异常是线索, 仍需复现验证根因.</text><text x="48" y="1460" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">美团第五节 + OpenTelemetry; 关联为教学设计.</text></g></svg>
