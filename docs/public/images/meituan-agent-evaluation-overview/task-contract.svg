<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1235" role="img" aria-labelledby="title desc"><title id="title">怎样把一句需求变成检查项</title><desc id="desc">任务固定A店和销售快照. 交付与过程从同一任务独立取证, 不互为前置. 最后按明确任务条件组合结论. 报告通过但过程缺证据时保留各项状态, 本例联合结论为未知.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1235" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">怎样把一句需求变成检查项</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">任务契约 / 一份固定输入, 两种证据</text><rect x="48" y="135" width="584" height="250" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><path d="M570 135V190H632" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><text x="74" y="180" font-size="28" fill="#20323f" text-anchor="start" font-weight="650">01 先把要求与事实固定下来</text><text x="74" y="230" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">任务: 为 A 店生成销售报告</text><text x="74" y="275" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">固定数据: A=100, B=9</text><text x="74" y="320" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">目标: 报告存在, A 店销售额为 100</text><text x="74" y="360" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">实际业务还要固定日期、口径与来源</text><path d="M340 385V445H185V465" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M340 445H495V465" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="48" y="425" font-size="26" fill="#20323f" text-anchor="start" font-weight="650">02 分别取证检查</text><rect x="48" y="465" width="274" height="350" rx="0" fill="#edf6f2" stroke="#087f73" stroke-width="2"/><rect x="358" y="465" width="274" height="350" rx="0" fill="#eef2fa" stroke="#385d98" stroke-width="2"/><text x="70" y="510" font-size="29" fill="#087f73" text-anchor="start" font-weight="650">最终交付</text><text x="70" y="555" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">证据: 读取实际报告</text><text x="70" y="605" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">报告存在?</text><text x="70" y="650" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">A 店, 销售额 100?</text><text x="70" y="710" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">端到端检查</text><text x="70" y="765" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">结果单独保存</text><text x="380" y="510" font-size="29" fill="#385d98" text-anchor="start" font-weight="650">执行过程</text><text x="380" y="555" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">证据: 工具调用记录</text><text x="380" y="605" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">参数 shop=A?</text><text x="380" y="650" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">结果与口径可核对?</text><text x="380" y="710" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">必要过程约束</text><text x="380" y="765" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">过程结论单独保存</text><path d="M185 815V855H340V900" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M495 815V855H340" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round"/><rect x="48" y="900" width="584" height="218" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="68" y="940" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">03 按任务要求组合结论</text><text x="68" y="980" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">例: 报告独立可验且正确 → 结果通过</text><text x="68" y="1018" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">工具记录缺失 → 过程未知</text><text x="68" y="1056" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">本例要求两路都有证据且通过</text><text x="68" y="1094" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">联合结论为未知, 不能直接放行</text><text x="48" y="1160" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">两路独立取证, 不强制唯一工具顺序.</text><text x="48" y="1200" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">美团 2.1.1、2.1.2; 字段与数据均为教学示例.</text></g></svg>
