<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1275" role="img" aria-labelledby="title desc"><title id="title">把“换尺子”和“修系统”分开</title><desc id="desc">矩阵行是系统v1和v2, 列是旧规则r1和新规则r2. 固定v1横向比较规则得到3/4与2/4. 固定r2纵向比较系统得到2/4与3/4. 四条完整证据为分母, 另一条未知保留并另报覆盖率.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1275" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">把“换尺子”和“修系统”分开</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">对照矩阵 / 不从左上角直接跳到右下角</text><text x="48" y="150" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">固定同一批任务、数据与环境</text><text x="270" y="205" font-size="27" fill="#5b6871" text-anchor="middle" font-weight="650">旧标准 r1</text><text x="510" y="205" font-size="27" fill="#087f73" text-anchor="middle" font-weight="650">新标准 r2</text><rect x="150" y="230" width="480" height="400" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><path d="M390 230V630" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><path d="M150 430H630" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round"/><text x="55" y="300" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">旧版</text><text x="55" y="500" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">新版</text><text x="55" y="341" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">v1</text><text x="55" y="541" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">v2</text><text x="270" y="320" font-size="52" fill="#5b6871" text-anchor="middle" font-weight="700">3/4</text><text x="510" y="320" font-size="52" fill="#087f73" text-anchor="middle" font-weight="700">2/4</text><text x="270" y="520" font-size="52" fill="#5b6871" text-anchor="middle" font-weight="700">3/4</text><text x="510" y="520" font-size="52" fill="#087f73" text-anchor="middle" font-weight="700">3/4</text><path d="M307 363H465" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="390" y="404" font-size="24" fill="#385d98" text-anchor="middle" font-weight="650">① 换标准</text><path d="M600 360V480" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="582" y="404" width="36" height="44" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="600" y="435" font-size="26" fill="#087f73" text-anchor="middle" font-weight="650">②</text><rect x="48" y="690" width="584" height="154" rx="0" fill="#ffffff" stroke="#385d98" stroke-width="2"/><text x="68" y="730" font-size="27" fill="#385d98" text-anchor="start" font-weight="650">① 横向: 先看尺子怎样改变结果</text><text x="68" y="770" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">同一批 v1 记录, 旧规则 3/4 → 新规则 2/4</text><text x="68" y="808" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">差异来自评判, 不能说系统退化了</text><rect x="48" y="885" width="584" height="154" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="68" y="925" font-size="27" fill="#087f73" text-anchor="start" font-weight="650">② 纵向: 固定新尺子再比较版本</text><text x="68" y="965" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">同一 r2, v1 为 2/4 → v2 为 3/4</text><text x="68" y="1003" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">门店选参修好了; 其他失败与未知仍保留</text><rect x="48" y="1080" width="584" height="114" rx="0" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="72" y="1126" font-size="26" fill="#20323f" text-anchor="start" font-weight="600">分母始终是 4 条证据完整记录.</text><text x="72" y="1167" font-size="25" fill="#20323f" text-anchor="start" font-weight="400">另 1 条未知另报: 证据覆盖率 4/5.</text><text x="48" y="1238" font-size="23" fill="#5b6871" text-anchor="start" font-weight="400">美团第二节 + Langfuse 数据版本; 数值为教学回放.</text></g></svg>
