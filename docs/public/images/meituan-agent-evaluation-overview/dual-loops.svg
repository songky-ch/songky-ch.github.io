<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1555" role="img" aria-labelledby="title desc"><title id="title">一个问题怎样推动两路改进</title><desc id="desc">在线线索进入样本归集. 证据不足先补采集并回到证据检查. 复核后分别修系统和评测, 汇入共享资产与固定条件回测. 不满足发布条件回到复核, 满足则受控上线并将新线索回流.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#5b6871" stroke-width="1.6"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="680" height="1555" rx="0" fill="#fbfaf6" stroke="#fbfaf6" stroke-width="2"/><rect x="32" y="32" width="7" height="58" rx="0" fill="#087f73" stroke="#087f73" stroke-width="2"/><text x="55" y="57" font-size="32" fill="#20323f" text-anchor="start" font-weight="700">一个问题怎样推动两路改进</text><text x="55" y="94" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">全景 / 从 ① 开始, 观察失败与回流出口</text><rect x="104" y="130" width="472" height="132" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="124" y="170" font-size="27" fill="#087f73" text-anchor="start" font-weight="650">① 在线判断与监控</text><text x="124" y="210" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">运行记录 + 用户反馈 + 抽样</text><text x="124" y="248" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">观测留证据, 在线工作给线索</text><path d="M340 262V310" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="356" y="294" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">关联到同一任务</text><rect x="104" y="310" width="472" height="110" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="124" y="350" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">② 样本归集与证据检查</text><text x="124" y="390" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">输入 · 参数 · 结果 · 产物 · 版本</text><path d="M250 420V450H174V480" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="55" y="456" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">证据不足</text><path d="M430 420V450H506V480" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="535" y="456" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">证据齐全</text><rect x="44" y="480" width="260" height="120" rx="0" fill="#fff4e2" stroke="#96530c" stroke-width="2"/><text x="64" y="520" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">补采集</text><text x="64" y="560" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">该项先记未知</text><path d="M44 540H24V365H104" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><rect x="376" y="480" width="260" height="120" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="396" y="520" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">③ 按事实复核</text><text x="396" y="560" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">行为与标准分开看</text><path d="M506 600V690H184V735" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M506 690V735" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="45" y="655" font-size="26" fill="#20323f" text-anchor="start" font-weight="600">④ 两路可同时修改, 不互相等待</text><rect x="44" y="735" width="280" height="172" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="64" y="775" font-size="27" fill="#087f73" text-anchor="start" font-weight="650">系统能力</text><text x="64" y="815" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">业务错 → 修系统</text><text x="64" y="853" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">业务对 → 保留结论</text><rect x="356" y="735" width="280" height="172" rx="0" fill="#ffffff" stroke="#385d98" stroke-width="2"/><text x="376" y="775" font-size="27" fill="#385d98" text-anchor="start" font-weight="650">评测体系</text><text x="376" y="815" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">判错 / 缺覆盖</text><text x="376" y="853" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">→ 补标准与样本</text><text x="376" y="891" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">规则合理 → 保留结论</text><path d="M184 907V945H340V980" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M496 907V945H340" fill="none" stroke="#385d98" stroke-width="2.5" stroke-linejoin="round"/><rect x="104" y="980" width="472" height="108" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="124" y="1020" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">共享评测资产</text><text x="124" y="1060" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">复核样本 + 对应版本 + 原因</text><path d="M340 1088V1130" fill="none" stroke="#5b6871" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="104" y="1130" width="472" height="110" rx="0" fill="#ffffff" stroke="#20323f" stroke-width="2"/><text x="124" y="1170" font-size="27" fill="#20323f" text-anchor="start" font-weight="650">⑤ 固定条件回测</text><text x="124" y="1210" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">数据、标准、环境固定, 比较版本</text><path d="M235 1240V1275H174V1320" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="44" y="1267" font-size="24" fill="#96530c" text-anchor="start" font-weight="400">未满足发布条件</text><path d="M445 1240V1275H506V1320" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="535" y="1298" font-size="24" fill="#087f73" text-anchor="start" font-weight="400">满足条件</text><rect x="44" y="1320" width="260" height="110" rx="0" fill="#ffffff" stroke="#96530c" stroke-width="2"/><text x="64" y="1360" font-size="27" fill="#96530c" text-anchor="start" font-weight="650">继续复核与修复</text><text x="64" y="1400" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">回到 ③</text><path d="M44 1375H16V620H360V540H376" fill="none" stroke="#96530c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><rect x="376" y="1320" width="260" height="110" rx="0" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="396" y="1360" font-size="27" fill="#087f73" text-anchor="start" font-weight="650">⑥ 受控线上验证</text><text x="396" y="1400" font-size="24" fill="#20323f" text-anchor="start" font-weight="400">新线索 → 回到 ②</text><path d="M636 1375H660V365H576" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="44" y="1480" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">实线: 数据与处理; 虚线: 反馈回流</text><text x="44" y="1518" font-size="24" fill="#5b6871" text-anchor="start" font-weight="400">依据美团 1.2、1.4、4.3; 实施细节为教学映射</text></g></svg>
