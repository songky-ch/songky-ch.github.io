<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1510" role="img" aria-labelledby="title desc"><title id="title">同一句“可以”, 要看待办</title><desc id="desc">教学状态图, 未运行真实多轮状态引擎.|实线: 新用户事件; 虚线: 陈旧响应.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="360" height="1510" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="18" y="35" font-size="21" font-weight="700" fill="#173042" text-anchor="start">同一句“可以”, 要看待办</text><text x="18" y="65" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">教学状态图, 未运行真实多轮状态引擎.</text><text x="18" y="87" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">实线: 新用户事件; 虚线: 陈旧响应.</text><rect x="20" y="120" width="320" height="125" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="148" font-size="15" font-weight="700" fill="#173042" text-anchor="start">待确认: A 单退款 25 元</text><text x="32" y="174" font-size="14" font-weight="400" fill="#173042" text-anchor="start">状态版本 7, 还没有本次有效确认</text><text x="32" y="197" font-size="14" font-weight="400" fill="#173042" text-anchor="start">待办只针对这一任务和具体操作</text><rect x="45" y="315" width="295" height="125" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="57" y="343" font-size="15" font-weight="700" fill="#173042" text-anchor="start">用户: “可以”</text><text x="57" y="369" font-size="14" font-weight="400" fill="#173042" text-anchor="start">生成本次绑定确认</text><text x="57" y="392" font-size="14" font-weight="400" fill="#173042" text-anchor="start">重验业务条件后进入退款准备</text><polyline points="20,165 10,165 10,377 45,377" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="298" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">独立分支</text><rect x="45" y="535" width="295" height="125" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="57" y="563" font-size="15" font-weight="700" fill="#173042" text-anchor="start">用户: “换 B 单”</text><text x="57" y="589" font-size="14" font-weight="400" fill="#173042" text-anchor="start">A 单确认失效</text><text x="57" y="612" font-size="14" font-weight="400" fill="#173042" text-anchor="start">重查 B 单资格与金额, 再确认</text><polyline points="20,190 10,190 10,597 45,597" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="518" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">独立分支</text><rect x="45" y="755" width="295" height="125" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="57" y="783" font-size="15" font-weight="700" fill="#173042" text-anchor="start">用户: “算了, 我要发票”</text><text x="57" y="809" font-size="14" font-weight="400" fill="#173042" text-anchor="start">取消 / 挂起旧退款待办</text><text x="57" y="832" font-size="14" font-weight="400" fill="#173042" text-anchor="start">作废旧确认, 转发票任务</text><polyline points="20,215 10,215 10,817 45,817" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="738" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">独立分支</text><rect x="45" y="985" width="295" height="85" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="57" y="1013" font-size="15" font-weight="700" fill="#173042" text-anchor="start">另一事件: 旧退款响应晚到</text><text x="57" y="1039" font-size="14" font-weight="400" fill="#173042" text-anchor="start">响应携带生成时的状态版本</text><polygon points="180.0,1130 290,1180.0 180.0,1230 70,1180.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="180.0" y="1174.0" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">响应版本仍是</text><text x="180.0" y="1197.0" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">当前版本吗?</text><polyline points="192,1070 192,1100 180,1100 180,1130" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="45" y="1107" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">旧轮次响应</text><polyline points="340,817 350,817 350,1180 290,1180" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="955" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">当前任务状态</text><rect x="20" y="1290" width="145" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="1318" font-size="15" font-weight="700" fill="#173042" text-anchor="start">否: 拒绝旧更新</text><text x="32" y="1344" font-size="14" font-weight="400" fill="#173042" text-anchor="start">保留发票任务</text><text x="32" y="1367" font-size="14" font-weight="400" fill="#173042" text-anchor="start">不恢复旧退款</text><rect x="195" y="1290" width="145" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="1318" font-size="15" font-weight="700" fill="#173042" text-anchor="start">是: 继续校验</text><text x="207" y="1344" font-size="14" font-weight="400" fill="#173042" text-anchor="start">按当前任务处理</text><text x="207" y="1367" font-size="14" font-weight="400" fill="#173042" text-anchor="start">仍不能绕过权限</text><polyline points="70,1180 55,1180 55,1250 92,1250 92,1290" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="20" y="1240" font-size="13" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="290,1180 305,1180 305,1250 267,1250 267,1290" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="315" y="1240" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">是</text><text x="18" y="1475" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">“可以”确认的内容来自上一步, 不是永久授权.</text><text x="18" y="1493" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">修改资源、撤销目标或版本过期都要处理确认失效.</text></g></svg>