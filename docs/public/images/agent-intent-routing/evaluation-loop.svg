<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">出错后, 回到哪一步重评?</title><desc id="desc">教学验证闭环, 不是企业内部平台复刻.|虚线回流只指向会被修改或重新测试的环节.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1220" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">出错后, 回到哪一步重评?</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">教学验证闭环, 不是企业内部平台复刻.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">虚线回流只指向会被修改或重新测试的环节.</text><rect x="40" y="120" width="640" height="106" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">准备独立真值和可回放输入</text><text x="52" y="174" font-size="17" font-weight="400" fill="#173042" text-anchor="start">按会话 / 时间划分, 保留封存测试集</text><text x="52" y="200" font-size="17" font-weight="400" fill="#173042" text-anchor="start">失败样例另存, 不直接污染测试集</text><rect x="40" y="290" width="640" height="145" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="318" font-size="18" font-weight="700" fill="#173042" text-anchor="start">分层检查, 留下最早偏差</text><text x="52" y="344" font-size="17" font-weight="400" fill="#173042" text-anchor="start">候选错→识别 / 上下文</text><text x="52" y="370" font-size="17" font-weight="400" fill="#173042" text-anchor="start">路线错→策略 / 状态</text><text x="52" y="396" font-size="17" font-weight="400" fill="#173042" text-anchor="start">业务终态错→工具 / 执行</text><polyline points="360.0,226 360.0,290" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="263" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">同一批输入比较</text><polygon points="360.0,495 540,545.0 360.0,595 180,545.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="360.0" y="550.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">关键约束和质量门槛通过?</text><polyline points="360.0,435 360.0,495" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="650" width="250" height="135" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="678" font-size="18" font-weight="700" fill="#173042" text-anchor="start">否: 修改最早出错的层</text><text x="52" y="704" font-size="17" font-weight="400" fill="#173042" text-anchor="start">模型 / 上下文、策略 / 状态</text><text x="52" y="730" font-size="17" font-weight="400" fill="#173042" text-anchor="start">或工具 / 执行; 保留错误证据</text><rect x="400" y="650" width="280" height="135" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="412" y="678" font-size="18" font-weight="700" fill="#173042" text-anchor="start">是: 进入影子检查</text><text x="412" y="704" font-size="17" font-weight="400" fill="#173042" text-anchor="start">只算决策, 禁止真实写入</text><text x="412" y="730" font-size="17" font-weight="400" fill="#173042" text-anchor="start">抽样独立标注并核对运行情况</text><polyline points="180,545 165,545 165,650" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="135" y="616" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="540,545 540,650" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="616" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><polyline points="40,717 15,717 15,365 40,365" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="25" y="470" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">修改后重评</text><polyline points="400,745 290,745" fill="none" stroke="#995507" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#risk)"/><text x="305" y="729" font-size="15" font-weight="400" fill="#995507" text-anchor="start">未通过</text><rect x="400" y="850" width="280" height="105" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="412" y="878" font-size="18" font-weight="700" fill="#173042" text-anchor="start">检查合格后进入灰度 / 实验</text><text x="412" y="904" font-size="17" font-weight="400" fill="#173042" text-anchor="start">按用户固定分组, 观察业务与护栏</text><polyline points="540,785 540,850" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="820" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">合格</text><polygon points="165.0,850 290,902.5 165.0,955 40,902.5" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="165.0" y="907.5" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">线上护栏仍合格?</text><polyline points="400,903 290,903" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="302" y="887" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">观察结果</text><rect x="40" y="1030" width="250" height="85" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="1058" font-size="18" font-weight="700" fill="#173042" text-anchor="start">否: 回退已知版本</text><text x="52" y="1084" font-size="17" font-weight="400" fill="#173042" text-anchor="start">带错误证据回到对应层修改</text><rect x="400" y="1030" width="280" height="85" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="412" y="1058" font-size="18" font-weight="700" fill="#173042" text-anchor="start">是: 保持观察 / 决定扩量</text><text x="412" y="1084" font-size="17" font-weight="400" fill="#173042" text-anchor="start">等待任务结果与观察窗成熟</text><polyline points="165,955 165,1030" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="175" y="1000" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="165,955 345,955 345,1072 400,1072" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="350" y="1010" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><polyline points="40,1072 15,1072 15,717 40,717" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="28" y="1185" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">线上发现的新样例进入下一轮开发, 封存集保持独立.</text><text x="28" y="1203" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">通过回归不等于自动满足生产安全和体验要求.</text></g></svg>