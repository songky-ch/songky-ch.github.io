<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc"><title id="title">如何知道路由真的变好了?</title><desc id="desc">按层定位, 用同一批输入配对比较; 测试通过不等于生产指标已达标.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#456174"/></marker></defs><rect width="1080" height="850" fill="#f4f7fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#182e40"><text x="40" y="52" font-size="29" font-weight="700">如何知道路由真的变好了?</text><text x="40" y="88" font-size="17" fill="#506578">按层定位, 用同一批输入配对比较; 测试通过不等于生产指标已达标.</text><rect x="40" y="125" width="450" height="140" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="157" font-size="21" font-weight="600">A. 数据与真值</text><text x="60" y="187" font-size="17">按会话/时间划分, 去除近重复</text><text x="60" y="213" font-size="17">分别标注意图、期望路线和业务终态</text><text x="60" y="239" font-size="17">真实脱敏样本 + 人工边界样本</text><rect x="580" y="125" width="450" height="140" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="600" y="157" font-size="21" font-weight="600">B. 离线分层测试</text><text x="600" y="187" font-size="17">识别: 分类别召回、范围外拒判</text><text x="600" y="213" font-size="17">策略: 原因码、状态、权限、确认</text><text x="600" y="239" font-size="17">执行: 工具参数、终态、重复副作用</text><rect x="580" y="335" width="450" height="140" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="600" y="367" font-size="21" font-weight="600">C. 影子与受控实验</text><text x="600" y="397" font-size="17">影子只计算决策, 禁止真实副作用</text><text x="600" y="423" font-size="17">按用户/会话固定实验分组</text><text x="600" y="449" font-size="17">记录覆盖率、错误代价与体验护栏</text><rect x="40" y="335" width="450" height="140" rx="12" fill="#fff1d9" stroke="#adbfce"/><text x="60" y="367" font-size="21" font-weight="600">D. 发布与回退</text><text x="60" y="397" font-size="17">模型、提示词、标签、策略一起版本化</text><text x="60" y="423" font-size="17">检查时间窗、分层劣化和业务损失</text><text x="60" y="449" font-size="17">不合格版本停止扩大流量</text><rect x="40" y="545" width="990" height="140" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="577" font-size="21" font-weight="600">E. 归因并补回归样本</text><text x="60" y="607" font-size="17">业务结果差 → 查工具执行; 路线错 → 查策略和状态; 候选错 → 查识别与上下文</text><text x="60" y="633" font-size="17">保留随机抽样, 防止只看失败样本而扭曲真实分布</text><text x="60" y="659" font-size="17">新增样本进入下一版训练或开发集, 封存测试集保持独立</text><rect x="40" y="740" width="990" height="70" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="60" y="772" font-size="21" font-weight="600">贯穿全部阶段: 可复现的 trace_id、证据、版本与明确分母</text><polyline points="490,195 580,195" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="805,265 805,335" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="580,405 490,405" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="265,475 265,545" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="805,475 805,545" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="40,610 20,610 20,195 40,195" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/></g></svg>