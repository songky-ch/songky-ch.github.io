<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1430" role="img" aria-labelledby="title desc"><title id="title">谁理解, 谁决定, 谁执行?</title><desc id="desc">教学架构, 不代表企业内部系统.|绿色实线: 处理路径; 虚线: 回合或观测记录.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="360" height="1430" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="18" y="35" font-size="21" font-weight="700" fill="#173042" text-anchor="start">谁理解, 谁决定, 谁执行?</text><text x="18" y="65" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">教学架构, 不代表企业内部系统.</text><text x="18" y="87" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">绿色实线: 处理路径; 虚线: 回合或观测记录.</text><rect x="20" y="120" width="320" height="82" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="148" font-size="15" font-weight="700" fill="#173042" text-anchor="start">用户消息: 待分析数据</text><text x="32" y="174" font-size="14" font-weight="400" fill="#173042" text-anchor="start">“A 单给我退款”</text><rect x="20" y="225" width="320" height="106" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="253" font-size="15" font-weight="700" fill="#173042" text-anchor="start">服务端上下文: 可信依据</text><text x="32" y="279" font-size="14" font-weight="400" fill="#173042" text-anchor="start">身份、订单归属、业务快照</text><text x="32" y="302" font-size="14" font-weight="400" fill="#173042" text-anchor="start">当前任务、确认和版本</text><rect x="20" y="385" width="320" height="110" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="413" font-size="15" font-weight="700" fill="#173042" text-anchor="start">01 理解用户目标</text><text x="32" y="439" font-size="14" font-weight="400" fill="#173042" text-anchor="start">输出领域、意图、参数与证据</text><text x="32" y="462" font-size="14" font-weight="400" fill="#173042" text-anchor="start">不输出业务授权</text><polyline points="20,161 9,161 9,438 20,438" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,331 180,385" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="190" y="362" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">提供上下文</text><rect x="20" y="550" width="320" height="110" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="578" font-size="15" font-weight="700" fill="#173042" text-anchor="start">02 决定当前下一步</text><text x="32" y="604" font-size="14" font-weight="400" fill="#173042" text-anchor="start">结合候选、任务状态、权限和风险</text><text x="32" y="627" font-size="14" font-weight="400" fill="#173042" text-anchor="start">输出注册路线、原因码与允许动作</text><polyline points="180.0,495 180.0,550" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="190.0" y="535" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">候选和证据</text><rect x="20" y="720" width="150" height="108" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="748" font-size="15" font-weight="700" fill="#173042" text-anchor="start">交互处理</text><text x="32" y="774" font-size="14" font-weight="400" fill="#173042" text-anchor="start">澄清 / 收参</text><text x="32" y="797" font-size="14" font-weight="400" fill="#173042" text-anchor="start">人工 / 范围外</text><rect x="190" y="720" width="150" height="108" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="202" y="748" font-size="15" font-weight="700" fill="#173042" text-anchor="start">专用工作流</text><text x="202" y="774" font-size="14" font-weight="400" fill="#173042" text-anchor="start">问答 / 查询</text><text x="202" y="797" font-size="14" font-weight="400" fill="#173042" text-anchor="start">退款准备</text><polyline points="95.0,660 95.0,720" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="28" y="704" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">需补信息</text><polyline points="265.0,660 265.0,720" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="198" y="704" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">进入任务</text><rect x="20" y="890" width="320" height="118" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="918" font-size="15" font-weight="700" fill="#173042" text-anchor="start">03 业务服务处理请求</text><text x="32" y="944" font-size="14" font-weight="400" fill="#173042" text-anchor="start">写入前重验权限、状态和具体确认</text><text x="32" y="967" font-size="14" font-weight="400" fill="#173042" text-anchor="start">使用幂等键; 超时先查操作状态</text><polyline points="265.0,828 265.0,890" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="190" y="876" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">受控服务调用</text><rect x="20" y="1060" width="150" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="1088" font-size="15" font-weight="700" fill="#173042" text-anchor="start">未通过校验</text><text x="32" y="1114" font-size="14" font-weight="400" fill="#173042" text-anchor="start">拒绝或重查</text><text x="32" y="1137" font-size="14" font-weight="400" fill="#173042" text-anchor="start">未提交新写入</text><rect x="190" y="1060" width="150" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="202" y="1088" font-size="15" font-weight="700" fill="#173042" text-anchor="start">返回真实结果</text><text x="202" y="1114" font-size="14" font-weight="400" fill="#173042" text-anchor="start">成功 / 处理中</text><text x="202" y="1137" font-size="14" font-weight="400" fill="#173042" text-anchor="start">业务失败</text><polyline points="95.0,1008 95.0,1060" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="20" y="1048" font-size="13" font-weight="400" fill="#995507" text-anchor="start">不满足条件</text><polyline points="265.0,1008 265.0,1060" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="186" y="1048" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">符合服务契约</text><rect x="20" y="1210" width="320" height="100" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="1238" font-size="15" font-weight="700" fill="#173042" text-anchor="start">贯穿三层: 留下可回放记录</text><text x="32" y="1264" font-size="14" font-weight="400" fill="#173042" text-anchor="start">候选、路线、版本</text><text x="32" y="1287" font-size="14" font-weight="400" fill="#173042" text-anchor="start">工具结果和业务终态</text><polyline points="265.0,1160 265.0,1210" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="95.0,1160 95.0,1210" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="340,440 354,440 354,1260 340,1260" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="340,605 354,605 354,1260 340,1260" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="340,949 354,949 354,1260 340,1260" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="20,790 14,790 14,1260 20,1260" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="20,774 6,774 6,105 40,105 40,120" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="10" y="665" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">下一轮</text><text x="18" y="1395" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">问答和只读查询也需遵守对应数据权限.</text><text x="18" y="1413" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">本图不展开所有退款判断, 详见退款检查图.</text></g></svg>