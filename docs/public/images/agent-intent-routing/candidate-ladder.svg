<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc"><title id="title">先找业务, 再辨别目标</title><desc id="desc">教学案例: “我要退款”来自综合入口.|橙色表示信息不足或被提前排除的候选.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1050" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">先找业务, 再辨别目标</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">教学案例: “我要退款”来自综合入口.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">橙色表示信息不足或被提前排除的候选.</text><rect x="40" y="115" width="640" height="90" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="143" font-size="18" font-weight="700" fill="#173042" text-anchor="start">输入不止一句话</text><text x="52" y="169" font-size="17" font-weight="400" fill="#173042" text-anchor="start">用户文本 + 入口 + 可用订单信息</text><polygon points="360.0,245 540,292.5 360.0,340 180,292.5" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="360.0" y="297.5" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">业务领域能确定吗?</text><polyline points="360.0,205 360.0,245" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="390" width="250" height="105" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="418" font-size="18" font-weight="700" fill="#173042" text-anchor="start">否: 先澄清业务 / 订单</text><text x="52" y="444" font-size="17" font-weight="400" fill="#173042" text-anchor="start">本轮不自动执行</text><text x="52" y="470" font-size="17" font-weight="400" fill="#173042" text-anchor="start">用户答复后重新识别领域</text><rect x="380" y="390" width="300" height="105" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="418" font-size="18" font-weight="700" fill="#173042" text-anchor="start">是: 保留合理候选领域</text><text x="392" y="444" font-size="17" font-weight="400" fill="#173042" text-anchor="start">外卖 / 酒店 / 零售</text><text x="392" y="470" font-size="17" font-weight="400" fill="#173042" text-anchor="start">在对应范围内找用户目标</text><polyline points="180,292 165,292 165,390" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="138" y="350" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="540,292 555,292 555,365 530,365 530,390" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="565" y="350" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="380" y="550" width="300" height="110" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="578" font-size="18" font-weight="700" fill="#173042" text-anchor="start">候选意图需区分目标</text><text x="392" y="604" font-size="17" font-weight="400" fill="#173042" text-anchor="start">申请退款 ≠ 查询退款进度</text><text x="392" y="630" font-size="17" font-weight="400" fill="#173042" text-anchor="start">否认退款 ≠ 发起退款</text><polyline points="530,495 530,550" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="530.0,710 680,757.5 530.0,805 380,757.5" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="530.0" y="762.5" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">目标清楚且受支持?</text><polyline points="530,660 530,710" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="710" width="250" height="105" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="738" font-size="18" font-weight="700" fill="#173042" text-anchor="start">否: 分清不能办理的原因</text><text x="52" y="764" font-size="17" font-weight="400" fill="#173042" text-anchor="start">歧义→澄清</text><text x="52" y="790" font-size="17" font-weight="400" fill="#173042" text-anchor="start">范围外→说明</text><polyline points="380,757 290,757" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="320" y="744" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><rect x="380" y="850" width="300" height="90" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="878" font-size="18" font-weight="700" fill="#173042" text-anchor="start">是: 交给路由策略</text><polyline points="530,805 530,850" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="540" y="832" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="40" y="550" width="250" height="115" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="53" y="578" font-size="18" font-weight="700" fill="#173042" text-anchor="start">先筛选错, 后排序救不回</text><text x="53" y="609" font-size="16" font-weight="400" fill="#995507" text-anchor="start">“酒店”没进候选范围,</text><text x="53" y="633" font-size="16" font-weight="400" fill="#995507" text-anchor="start">酒店退款意图就无法被选中.</text><polyline points="40,440 15,440 15,160 40,160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="42" y="230" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">新答复</text><text x="28" y="1015" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">简化展示领域与意图筛选关系, 不给出企业阈值.</text><text x="28" y="1033" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">澄清后从输入重新开始, 不是默认选最高分.</text></g></svg>