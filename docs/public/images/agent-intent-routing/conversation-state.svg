<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc"><title id="title">同一句“可以”, 为什么会走不同路线?</title><desc id="desc">教学多轮案例. 确认只绑定具体操作; 切换订单或任务必须重新检查.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#456174"/></marker></defs><rect width="1080" height="850" fill="#f4f7fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#182e40"><text x="40" y="52" font-size="29" font-weight="700">同一句“可以”, 为什么会走不同路线?</text><text x="40" y="88" font-size="17" fill="#506578">教学多轮案例. 确认只绑定具体操作; 切换订单或任务必须重新检查.</text><rect x="40" y="130" width="450" height="130" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="162" font-size="21" font-weight="600">轮 1: “这单不要了”</text><text x="60" y="192" font-size="17">状态: 未确定订单与取消/退款目标</text><text x="60" y="218" font-size="17">决策: 收集订单并澄清目标</text><rect x="580" y="130" width="450" height="130" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="600" y="162" font-size="21" font-weight="600">轮 2: “是 A 单, 退 25 元”</text><text x="600" y="192" font-size="17">状态: 核验本人订单、资格、金额</text><text x="600" y="218" font-size="17">决策: 展示退款操作并请求确认</text><rect x="580" y="330" width="450" height="130" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="600" y="362" font-size="21" font-weight="600">分支 A: “可以”</text><text x="600" y="392" font-size="17">待确认 = A 单 / 25 元 / 状态版本 7</text><text x="600" y="418" font-size="17">决策: 校验确认后进入退款准备</text><rect x="40" y="330" width="450" height="130" rx="12" fill="#fff1d9" stroke="#adbfce"/><text x="60" y="362" font-size="21" font-weight="600">分支 B: “换成 B 单吧”</text><text x="60" y="392" font-size="17">失效: A 单的金额、资格和确认</text><text x="60" y="418" font-size="17">决策: 重查 B 单, 重新确认</text><rect x="40" y="540" width="450" height="130" rx="12" fill="#fff1d9" stroke="#adbfce"/><text x="60" y="572" font-size="21" font-weight="600">分支 C: “算了, 我要发票”</text><text x="60" y="602" font-size="17">失效: 退款待办与确认</text><text x="60" y="628" font-size="17">决策: 取消待执行退款, 切到发票任务</text><rect x="580" y="540" width="450" height="130" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="600" y="572" font-size="21" font-weight="600">执行前的最后一道检查</text><text x="600" y="602" font-size="17">比较订单版本, 提交绑定的幂等键</text><text x="600" y="628" font-size="17">写入超时先查结果, 禁止盲目重复退款</text><rect x="40" y="730" width="990" height="80" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="762" font-size="21" font-weight="600">测试断言</text><text x="60" y="792" font-size="17">检查每轮状态、目标和允许动作; 不仅检查最后一句回复是否礼貌.</text><polyline points="490,195 580,195" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="805,260 805,330" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="580,260 265,260 265,330" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="580,260 535,260 535,505 265,505 265,540" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="805,460 805,540" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/></g></svg>