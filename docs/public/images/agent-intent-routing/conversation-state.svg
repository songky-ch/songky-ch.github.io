<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">同一句“可以”, 要看待办</title><desc id="desc">教学状态图, 未运行真实多轮状态引擎.|实线: 新用户事件; 虚线: 陈旧响应.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1100" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">同一句“可以”, 要看待办</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">教学状态图, 未运行真实多轮状态引擎.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">实线: 新用户事件; 虚线: 陈旧响应.</text><rect x="40" y="120" width="640" height="125" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">待确认: A 单退款 25 元</text><text x="52" y="174" font-size="17" font-weight="400" fill="#173042" text-anchor="start">状态版本 7, 还没有本次有效确认</text><text x="52" y="200" font-size="17" font-weight="400" fill="#173042" text-anchor="start">待办只针对这一任务和具体操作</text><rect x="40" y="370" width="180" height="160" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="398" font-size="18" font-weight="700" fill="#173042" text-anchor="start">“可以”</text><text x="52" y="424" font-size="17" font-weight="400" fill="#173042" text-anchor="start">生成本次绑定确认</text><text x="52" y="450" font-size="17" font-weight="400" fill="#173042" text-anchor="start">重验后退款准备</text><polyline points="130,245 130,370" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="40" y="330" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">用户的新回复</text><rect x="270" y="370" width="180" height="160" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="282" y="398" font-size="18" font-weight="700" fill="#173042" text-anchor="start">“换 B 单”</text><text x="282" y="424" font-size="17" font-weight="400" fill="#173042" text-anchor="start">A 单确认失效</text><text x="282" y="450" font-size="17" font-weight="400" fill="#173042" text-anchor="start">重查 B 单, 再确认</text><polyline points="360,245 360,370" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270" y="330" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">用户的新回复</text><rect x="500" y="370" width="180" height="160" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="512" y="398" font-size="18" font-weight="700" fill="#173042" text-anchor="start">“我要发票”</text><text x="512" y="424" font-size="17" font-weight="400" fill="#173042" text-anchor="start">取消或挂起旧退款</text><text x="512" y="450" font-size="17" font-weight="400" fill="#173042" text-anchor="start">作废旧确认</text><text x="512" y="476" font-size="17" font-weight="400" fill="#173042" text-anchor="start">转入发票任务</text><polyline points="590,245 590,370" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="330" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">用户的新回复</text><rect x="270" y="610" width="410" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="282" y="638" font-size="18" font-weight="700" fill="#173042" text-anchor="start">已保存新任务状态与版本</text><text x="282" y="664" font-size="17" font-weight="400" fill="#173042" text-anchor="start">旧响应不能覆盖最新用户目标</text><polyline points="360,530 360,610" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,530 590,610" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="610" width="180" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="638" font-size="18" font-weight="700" fill="#173042" text-anchor="start">旧退款响应晚到</text><text x="52" y="664" font-size="17" font-weight="400" fill="#173042" text-anchor="start">携带旧的状态版本</text><polygon points="360.0,780 540,827.5 360.0,875 180,827.5" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="360.0" y="832.5" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">响应版本仍是当前版本吗?</text><polyline points="130,710 130,827 180,827" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="475,710 475,750 360,750 360,780" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="480" y="756" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">读取当前版本</text><rect x="40" y="920" width="270" height="60" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="948" font-size="18" font-weight="700" fill="#173042" text-anchor="start">否: 拒绝陈旧更新</text><rect x="410" y="920" width="270" height="60" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="422" y="948" font-size="18" font-weight="700" fill="#173042" text-anchor="start">是: 按当前任务继续校验</text><polyline points="360,875 270,900 175,900 175,920" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="200" y="897" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="360,875 450,900 545,900 545,920" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="510" y="897" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><text x="28" y="1065" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">“可以”确认的内容来自上一步, 不是永久授权.</text><text x="28" y="1083" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">修改资源、撤销目标或版本过期都要处理确认失效.</text></g></svg>