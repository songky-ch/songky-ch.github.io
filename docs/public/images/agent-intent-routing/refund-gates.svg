<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">选中了退款, 也要逐项检查</title><desc id="desc">局部图: 已通过候选、领域与多目标检查.|按现有 router.py 的退款分支顺序绘制.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1320" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">选中了退款, 也要逐项检查</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">局部图: 已通过候选、领域与多目标检查.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">按现有 router.py 的退款分支顺序绘制.</text><rect x="40" y="120" width="340" height="78" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">已选中退款分支</text><polygon points="210.0,245 380,290.0 210.0,335 40,290.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="210.0" y="295.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">订单已绑定?</text><polyline points="210.0,198 210.0,245" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="440" y="242" width="240" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="452" y="270" font-size="18" font-weight="700" fill="#173042" text-anchor="start">收集订单</text><text x="452" y="296" font-size="17" font-weight="400" fill="#173042" text-anchor="start">后续项未检查</text><polyline points="380,290 440,290" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="385" y="278" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polygon points="210.0,420 380,465.0 210.0,510 40,465.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="210.0" y="470.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">身份已认证?</text><polyline points="210.0,335 210.0,420" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="218.0" y="408" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="440" y="417" width="240" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="452" y="445" font-size="18" font-weight="700" fill="#173042" text-anchor="start">先认证</text><text x="452" y="471" font-size="17" font-weight="400" fill="#173042" text-anchor="start">后续项未检查</text><polyline points="380,465 440,465" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="385" y="453" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polygon points="210.0,595 380,640.0 210.0,685 40,640.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="210.0" y="645.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">是本人的订单?</text><polyline points="210.0,510 210.0,595" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="218.0" y="583" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="440" y="592" width="240" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="452" y="620" font-size="18" font-weight="700" fill="#173042" text-anchor="start">拒绝访问</text><text x="452" y="646" font-size="17" font-weight="400" fill="#173042" text-anchor="start">后续项未检查</text><polyline points="380,640 440,640" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="385" y="628" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polygon points="210.0,770 380,815.0 210.0,860 40,815.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="210.0" y="820.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">符合退款资格?</text><polyline points="210.0,685 210.0,770" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="218.0" y="758" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="440" y="767" width="240" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="452" y="795" font-size="18" font-weight="700" fill="#173042" text-anchor="start">说明不符资格</text><text x="452" y="821" font-size="17" font-weight="400" fill="#173042" text-anchor="start">未检查确认</text><polyline points="380,815 440,815" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="385" y="803" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><polygon points="210.0,945 380,990.0 210.0,1035 40,990.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="210.0" y="995.0" font-size="18" font-weight="700" fill="#173042" text-anchor="middle">具体确认有效?</text><polyline points="210.0,860 210.0,945" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="218.0" y="933" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="440" y="942" width="240" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="452" y="970" font-size="18" font-weight="700" fill="#173042" text-anchor="start">重新确认操作</text><text x="452" y="996" font-size="17" font-weight="400" fill="#173042" text-anchor="start">不提交退款</text><polyline points="380,990 440,990" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="385" y="978" font-size="15" font-weight="400" fill="#995507" text-anchor="start">否</text><rect x="40" y="1120" width="340" height="90" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="1148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">进入退款准备</text><text x="52" y="1174" font-size="17" font-weight="400" fill="#173042" text-anchor="start">还不是实际退款成功</text><polyline points="210.0,1035 210.0,1120" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="218.0" y="1108" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">是</text><text x="440" y="1142" font-size="17" font-weight="400" fill="#4d6373" text-anchor="start">确认绑定:</text><text x="440" y="1166" font-size="17" font-weight="400" fill="#4d6373" text-anchor="start">订单、金额、币种、</text><text x="440" y="1190" font-size="17" font-weight="400" fill="#4d6373" text-anchor="start">状态版本和有效期</text><text x="28" y="1285" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">任何一个早期出口都不能被画成已完成后续检查.</text><text x="28" y="1303" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">高置信语义错误仍可能走到准备, 见失败证据图.</text></g></svg>