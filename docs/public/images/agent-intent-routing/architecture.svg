<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1340" role="img" aria-labelledby="title desc"><title id="title">谁理解, 谁决定, 谁执行?</title><desc id="desc">教学架构, 不代表企业内部系统.|绿色实线: 处理路径; 虚线: 回合或观测记录.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1340" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">谁理解, 谁决定, 谁执行?</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">教学架构, 不代表企业内部系统.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">绿色实线: 处理路径; 虚线: 回合或观测记录.</text><rect x="40" y="120" width="300" height="110" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">用户消息: 待分析数据</text><text x="52" y="174" font-size="17" font-weight="400" fill="#173042" text-anchor="start">“A 单给我退款”</text><text x="52" y="200" font-size="17" font-weight="400" fill="#173042" text-anchor="start">用户文字不能授予权限</text><rect x="380" y="120" width="300" height="110" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="148" font-size="18" font-weight="700" fill="#173042" text-anchor="start">服务端上下文: 可信依据</text><text x="392" y="174" font-size="17" font-weight="400" fill="#173042" text-anchor="start">身份、资源归属、订单快照</text><text x="392" y="200" font-size="17" font-weight="400" fill="#173042" text-anchor="start">任务、确认和状态版本</text><rect x="40" y="290" width="640" height="110" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="318" font-size="18" font-weight="700" fill="#173042" text-anchor="start">01 理解用户目标</text><text x="52" y="344" font-size="17" font-weight="400" fill="#173042" text-anchor="start">识别器输出: 领域 / 意图候选、参数、简短证据</text><text x="52" y="370" font-size="17" font-weight="400" fill="#173042" text-anchor="start">提示词和输出结构有约束, 不代替业务授权</text><polyline points="190,230 190,260 290,260 290,290" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="530,230 530,260 440,260 440,290" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="450" width="640" height="110" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="478" font-size="18" font-weight="700" fill="#173042" text-anchor="start">02 决定当前下一步</text><text x="52" y="504" font-size="17" font-weight="400" fill="#173042" text-anchor="start">结合候选、任务状态、权限和风险</text><text x="52" y="530" font-size="17" font-weight="400" fill="#173042" text-anchor="start">输出注册路线、原因码与允许动作</text><polyline points="360.0,400 360.0,450" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="370.0" y="435" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">候选和证据</text><rect x="40" y="620" width="300" height="108" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="648" font-size="18" font-weight="700" fill="#173042" text-anchor="start">交互处理</text><text x="52" y="674" font-size="17" font-weight="400" fill="#173042" text-anchor="start">澄清 / 收参</text><text x="52" y="700" font-size="17" font-weight="400" fill="#173042" text-anchor="start">人工 / 范围外</text><rect x="380" y="620" width="300" height="108" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="648" font-size="18" font-weight="700" fill="#173042" text-anchor="start">专用工作流</text><text x="392" y="674" font-size="17" font-weight="400" fill="#173042" text-anchor="start">问答 / 查询</text><text x="392" y="700" font-size="17" font-weight="400" fill="#173042" text-anchor="start">退款准备</text><polyline points="190.0,560 190.0,620" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="48" y="604" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">需补信息</text><polyline points="530.0,560 530.0,620" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="388" y="604" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">进入任务</text><rect x="40" y="790" width="640" height="118" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="818" font-size="18" font-weight="700" fill="#173042" text-anchor="start">03 业务服务处理请求</text><text x="52" y="844" font-size="17" font-weight="400" fill="#173042" text-anchor="start">写入前重验权限、状态和具体确认</text><text x="52" y="870" font-size="17" font-weight="400" fill="#173042" text-anchor="start">使用幂等键; 超时先查操作状态</text><polyline points="530.0,728 530.0,790" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="776" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">受控服务调用</text><rect x="40" y="960" width="300" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="988" font-size="18" font-weight="700" fill="#173042" text-anchor="start">未通过校验</text><text x="52" y="1014" font-size="17" font-weight="400" fill="#173042" text-anchor="start">拒绝或重查</text><text x="52" y="1040" font-size="17" font-weight="400" fill="#173042" text-anchor="start">未提交新写入</text><rect x="380" y="960" width="300" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="988" font-size="18" font-weight="700" fill="#173042" text-anchor="start">返回真实结果</text><text x="392" y="1014" font-size="17" font-weight="400" fill="#173042" text-anchor="start">成功 / 处理中</text><text x="392" y="1040" font-size="17" font-weight="400" fill="#173042" text-anchor="start">业务失败</text><polyline points="190.0,908 190.0,960" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="40" y="948" font-size="15" font-weight="400" fill="#995507" text-anchor="start">不满足条件</text><polyline points="530.0,908 530.0,960" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="376" y="948" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">符合服务契约</text><rect x="40" y="1110" width="640" height="100" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="1138" font-size="18" font-weight="700" fill="#173042" text-anchor="start">贯穿三层: 留下可回放记录</text><text x="52" y="1164" font-size="17" font-weight="400" fill="#173042" text-anchor="start">候选、路线、版本、工具结果和业务终态</text><polyline points="530.0,1060 530.0,1110" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="190.0,1060 190.0,1110" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="680,345 714,345 714,1160 680,1160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="680,505 714,505 714,1160 680,1160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="680,849 714,849 714,1160 680,1160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="40,690 34,690 34,1160 40,1160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="40,674 6,674 6,105 60,105 60,120" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="10" y="565" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">下一轮</text><text x="28" y="1305" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">问答和只读查询也需遵守对应数据权限.</text><text x="28" y="1323" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">本图不展开所有退款判断, 详见退款检查图.</text></g></svg>