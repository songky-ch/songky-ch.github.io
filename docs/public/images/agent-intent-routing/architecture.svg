<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1060" role="img" aria-labelledby="title desc"><title id="title">意图识别与路由: 从输入到受控执行</title><desc id="desc">教学设计. 识别输出是候选, 路由负责决策, 执行端再次校验.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#456174"/></marker></defs><rect width="960" height="1060" fill="#f4f7fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#182e40"><text x="40" y="52" font-size="29" font-weight="700">意图识别与路由: 从输入到受控执行</text><text x="40" y="88" font-size="17" fill="#506578">教学设计. 识别输出是候选, 路由负责决策, 执行端再次校验.</text><rect x="40" y="120" width="880" height="98" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="152" font-size="21" font-weight="600">1. 输入与可信上下文</text><text x="60" y="182" font-size="17">用户消息 + 最近对话 + 入口领域 + 订单快照 + 身份/权限</text><rect x="40" y="255" width="880" height="125" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="287" font-size="21" font-weight="600">2. 分层识别</text><text x="60" y="317" font-size="17">领域候选 → 意图候选 → 参数与证据 → 不确定性</text><text x="60" y="343" font-size="17">可用小模型/检索/大模型; 候选必须受标签和结构约束</text><rect x="40" y="420" width="880" height="125" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="60" y="452" font-size="21" font-weight="600">3. 确定性路由策略</text><text x="60" y="482" font-size="17">硬边界 → 人工诉求 → 领域/意图歧义 → 参数 → 业务资格</text><text x="60" y="508" font-size="17">输出 route_id、原因码、状态版本、候选版本、允许的动作</text><rect x="40" y="590" width="420" height="125" rx="12" fill="#fff1d9" stroke="#adbfce"/><text x="60" y="622" font-size="21" font-weight="600">4A. 信息不足或不能自动处理</text><text x="60" y="652" font-size="17">澄清 / 收集参数 / 转人工</text><text x="60" y="678" font-size="17">明确区分主动拒判与基础设施故障</text><rect x="500" y="590" width="420" height="125" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="520" y="622" font-size="21" font-weight="600">4B. 专用工作流</text><text x="520" y="652" font-size="17">知识回答 / 订单查询 / 退款准备</text><text x="520" y="678" font-size="17">变更操作须绑定本次具体确认</text><rect x="500" y="765" width="420" height="125" rx="12" fill="#dff4ef" stroke="#adbfce"/><text x="520" y="797" font-size="21" font-weight="600">5. 业务服务提交前复核</text><text x="520" y="827" font-size="17">权限、余额、状态版本、幂等键</text><text x="520" y="853" font-size="17">成功以业务状态为准, 不以话术为准</text><rect x="40" y="940" width="880" height="80" rx="12" fill="#e8f0ff" stroke="#adbfce"/><text x="60" y="972" font-size="21" font-weight="600">6. 全链路可回放记录</text><text x="60" y="1002" font-size="17">候选、原因码、状态变更、工具结果、最终业务结果与发布版本</text><polyline points="480,218 480,255" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="480,380 480,420" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="250,545 250,590" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="710,545 710,590" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="710,715 710,765" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="250,715 250,915 480,915 480,940" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/><polyline points="710,890 710,915 480,915" fill="none" stroke="#456174" stroke-width="2.3" marker-end="url(#a)"/></g></svg>