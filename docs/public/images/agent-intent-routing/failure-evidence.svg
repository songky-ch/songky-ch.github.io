<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" role="img" aria-labelledby="title desc"><title id="title">同一批结果, 两个分母</title><desc id="desc">2026-10-18 历史实测, 固定合成候选.|来源: results.json. 没有真实退款写入.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="720" height="1010" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="28" y="42" font-size="28" font-weight="700" fill="#173042" text-anchor="start">同一批结果, 两个分母</text><text x="28" y="77" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">2026-10-18 历史实测, 固定合成候选.</text><text x="28" y="101" font-size="16" font-weight="400" fill="#4d6373" text-anchor="start">来源: results.json. 没有真实退款写入.</text><rect x="40" y="120" width="640" height="145" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="55" y="155" font-size="18" font-weight="700" fill="#173042" text-anchor="start">全体 30 条路由样例</text><text x="55" y="210" font-size="36" font-weight="700" fill="#087f73" text-anchor="start">29 / 30 = 96.67%</text><text x="55" y="243" font-size="18" font-weight="400" fill="#173042" text-anchor="start">这是总体路线准确率, 不是模型准确率.</text><rect x="40" y="330" width="640" height="170" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="55" y="364" font-size="18" font-weight="700" fill="#173042" text-anchor="start">其中 2 条进入“退款准备”</text><text x="55" y="421" font-size="36" font-weight="700" fill="#995507" text-anchor="start">1 / 2 = 50% 错误</text><text x="55" y="463" font-size="18" font-weight="400" fill="#173042" text-anchor="start">1 条正确准备, 1 条不该准备.</text><polyline points="360.0,265 360.0,330" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="55" y="306" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">只看退款准备这一部分</text><rect x="40" y="560" width="640" height="170" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="588" font-size="18" font-weight="700" fill="#173042" text-anchor="start">错误那一条发生了什么?</text><text x="52" y="614" font-size="17" font-weight="400" fill="#173042" text-anchor="start">用户: “不是退款, 我要发票”</text><text x="52" y="640" font-size="17" font-weight="400" fill="#173042" text-anchor="start">注入候选: refund, 0.99</text><text x="52" y="666" font-size="17" font-weight="400" fill="#173042" text-anchor="start">旧退款确认仍在, 字段检查未拦住</text><polyline points="360.0,500 360.0,560" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="55" y="536" font-size="15" font-weight="400" fill="#995507" text-anchor="start">展开唯一错误</text><rect x="40" y="795" width="300" height="115" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="52" y="823" font-size="18" font-weight="700" fill="#173042" text-anchor="start">先识别并保存目标纠正</text><text x="52" y="849" font-size="17" font-weight="400" fill="#173042" text-anchor="start">撤销旧退款待办, 作废旧确认</text><text x="52" y="875" font-size="17" font-weight="400" fill="#173042" text-anchor="start">再进入发票任务</text><rect x="380" y="795" width="300" height="115" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="392" y="823" font-size="18" font-weight="700" fill="#173042" text-anchor="start">不能靠提高阈值掩盖</text><text x="392" y="849" font-size="17" font-weight="400" fill="#173042" text-anchor="start">错误候选本来就有 0.99 分</text><text x="392" y="875" font-size="17" font-weight="400" fill="#173042" text-anchor="start">策略不重新理解用户原文</text><polyline points="190,730 190,795" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="765" font-size="15" font-weight="400" fill="#087f73" text-anchor="start">需要修复的环节</text><polyline points="530,730 530,795" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="445" y="765" font-size="15" font-weight="400" fill="#995507" text-anchor="start">本例的限制</text><text x="28" y="975" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">7 个测试方法含已知失败断言, 不代表安全门禁通过.</text><text x="28" y="993" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">人工挑选样例与分数均不能外推到生产流量.</text></g></svg>