<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc"><title id="title">同一批结果, 两个分母</title><desc id="desc">2026-10-18 历史实测, 固定合成候选.|来源: results.json. 没有真实退款写入.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="360" height="1040" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="18" y="35" font-size="21" font-weight="700" fill="#173042" text-anchor="start">同一批结果, 两个分母</text><text x="18" y="65" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">2026-10-18 历史实测, 固定合成候选.</text><text x="18" y="87" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">来源: results.json. 没有真实退款写入.</text><rect x="20" y="120" width="320" height="145" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="35" y="155" font-size="15" font-weight="700" fill="#173042" text-anchor="start">全体 30 条路由样例</text><text x="35" y="210" font-size="25" font-weight="700" fill="#087f73" text-anchor="start">29 / 30 = 96.67%</text><text x="35" y="243" font-size="14" font-weight="400" fill="#173042" text-anchor="start">这是总体路线准确率, 不是模型准确率.</text><rect x="20" y="330" width="320" height="170" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="35" y="364" font-size="15" font-weight="700" fill="#173042" text-anchor="start">其中 2 条进入“退款准备”</text><text x="35" y="421" font-size="25" font-weight="700" fill="#995507" text-anchor="start">1 / 2 = 50% 错误</text><text x="35" y="463" font-size="15" font-weight="400" fill="#173042" text-anchor="start">1 条正确准备, 1 条不该准备.</text><polyline points="180.0,265 180.0,330" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="35" y="306" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">只看退款准备这一部分</text><rect x="20" y="560" width="320" height="170" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="588" font-size="15" font-weight="700" fill="#173042" text-anchor="start">错误那一条发生了什么?</text><text x="32" y="614" font-size="14" font-weight="400" fill="#173042" text-anchor="start">用户: “不是退款, 我要发票”</text><text x="32" y="637" font-size="14" font-weight="400" fill="#173042" text-anchor="start">注入候选: refund, 0.99</text><text x="32" y="660" font-size="14" font-weight="400" fill="#173042" text-anchor="start">旧退款确认仍在, 字段检查未拦住</text><polyline points="180.0,500 180.0,560" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="35" y="536" font-size="13" font-weight="400" fill="#995507" text-anchor="start">展开唯一错误</text><rect x="20" y="795" width="320" height="110" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="823" font-size="15" font-weight="700" fill="#173042" text-anchor="start">理解与状态必须配合</text><text x="32" y="849" font-size="14" font-weight="400" fill="#173042" text-anchor="start">识别目标纠正, 撤销旧退款待办</text><text x="32" y="872" font-size="14" font-weight="400" fill="#173042" text-anchor="start">作废旧确认, 再进入发票任务</text><polyline points="180,730 180,795" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="24" y="766" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">需要修复的环节, 未在本次执行</text><text x="18" y="1005" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">7 个测试方法含已知失败断言, 不代表安全门禁通过.</text><text x="18" y="1023" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">人工挑选样例与分数均不能外推到生产流量.</text></g></svg>