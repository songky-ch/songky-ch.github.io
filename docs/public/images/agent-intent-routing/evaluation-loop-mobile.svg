<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1450" role="img" aria-labelledby="title desc"><title id="title">出错后, 回到哪一步重评?</title><desc id="desc">教学验证闭环, 不是企业内部平台复刻.|虚线回流只指向会被修改或重新测试的环节.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="360" height="1450" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="18" y="35" font-size="21" font-weight="700" fill="#173042" text-anchor="start">出错后, 回到哪一步重评?</text><text x="18" y="65" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">教学验证闭环, 不是企业内部平台复刻.</text><text x="18" y="87" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">虚线回流只指向会被修改或重新测试的环节.</text><rect x="20" y="120" width="320" height="106" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="148" font-size="15" font-weight="700" fill="#173042" text-anchor="start">准备独立真值和可回放输入</text><text x="32" y="174" font-size="14" font-weight="400" fill="#173042" text-anchor="start">按会话 / 时间划分, 保留封存测试集</text><text x="32" y="197" font-size="14" font-weight="400" fill="#173042" text-anchor="start">失败样例另存, 不直接污染测试集</text><rect x="20" y="290" width="320" height="145" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="318" font-size="15" font-weight="700" fill="#173042" text-anchor="start">分层检查, 留下最早偏差</text><text x="32" y="344" font-size="14" font-weight="400" fill="#173042" text-anchor="start">候选错→识别 / 上下文</text><text x="32" y="367" font-size="14" font-weight="400" fill="#173042" text-anchor="start">路线错→策略 / 状态</text><text x="32" y="390" font-size="14" font-weight="400" fill="#173042" text-anchor="start">业务终态错→工具 / 执行</text><polyline points="180.0,226 180.0,290" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="90.0" y="263" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">同一批输入比较</text><polygon points="180.0,495 300,545.0 180.0,595 60,545.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="180.0" y="550.0" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">关键约束和质量门槛通过?</text><polyline points="180.0,435 180.0,495" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="650" width="145" height="140" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="678" font-size="15" font-weight="700" fill="#173042" text-anchor="start">否: 对应层修改</text><text x="32" y="704" font-size="14" font-weight="400" fill="#173042" text-anchor="start">修识别或上下文</text><text x="32" y="727" font-size="14" font-weight="400" fill="#173042" text-anchor="start">修策略或状态</text><text x="32" y="750" font-size="14" font-weight="400" fill="#173042" text-anchor="start">修工具或执行</text><rect x="195" y="650" width="145" height="140" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="678" font-size="15" font-weight="700" fill="#173042" text-anchor="start">是: 影子检查</text><text x="207" y="704" font-size="14" font-weight="400" fill="#173042" text-anchor="start">只算决策</text><text x="207" y="727" font-size="14" font-weight="400" fill="#173042" text-anchor="start">禁止真实写入</text><text x="207" y="750" font-size="14" font-weight="400" fill="#173042" text-anchor="start">抽样独立标注</text><polyline points="60,545 48,545 48,625 92,625 92,650" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="22" y="600" font-size="13" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="300,545 312,545 312,625 267,625 267,650" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="322" y="600" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">是</text><polyline points="20,720 8,720 8,365 20,365" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="23" y="470" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">重评</text><rect x="195" y="865" width="145" height="110" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="893" font-size="15" font-weight="700" fill="#173042" text-anchor="start">灰度 / 对照实验</text><text x="207" y="919" font-size="14" font-weight="400" fill="#173042" text-anchor="start">按用户固定分组</text><text x="207" y="942" font-size="14" font-weight="400" fill="#173042" text-anchor="start">观察业务与护栏</text><polyline points="267,790 267,865" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="210" y="836" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">检查合格后</text><polygon points="180.0,1030 295,1080.0 180.0,1130 65,1080.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="180.0" y="1085.0" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">线上护栏仍符合要求?</text><polyline points="267,975 267,1005 180,1005 180,1030" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="1185" width="145" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="1213" font-size="15" font-weight="700" fill="#173042" text-anchor="start">否: 回退已知版</text><text x="32" y="1239" font-size="14" font-weight="400" fill="#173042" text-anchor="start">记录最早偏差</text><text x="32" y="1262" font-size="14" font-weight="400" fill="#173042" text-anchor="start">再修复 / 重评</text><rect x="195" y="1185" width="145" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="1213" font-size="15" font-weight="700" fill="#173042" text-anchor="start">是: 保持观察</text><text x="207" y="1239" font-size="14" font-weight="400" fill="#173042" text-anchor="start">成熟观察窗</text><text x="207" y="1262" font-size="14" font-weight="400" fill="#173042" text-anchor="start">决定是否扩量</text><polyline points="65,1080 48,1080 48,1155 92,1155 92,1185" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="50" y="1150" font-size="13" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="295,1080 312,1080 312,1155 267,1155 267,1185" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="278" y="1150" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">是</text><polyline points="20,1235 8,1235 8,720 20,720" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="24" y="978" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">故障证据</text><text x="20" y="1345" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">影子不合格也回到“对应层修改”,</text><text x="20" y="1367" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">不能绕过检查直接扩量.</text><polyline points="230,790 230,820 92,820 92,790" fill="none" stroke="#995507" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#risk)"/><text x="123" y="810" font-size="13" font-weight="400" fill="#995507" text-anchor="start">未通过</text><text x="18" y="1415" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">线上发现的新样例进入下一轮开发, 封存集保持独立.</text><text x="18" y="1433" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">通过回归不等于自动满足生产安全和体验要求.</text></g></svg>