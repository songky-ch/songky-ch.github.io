<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1130" role="img" aria-labelledby="title desc"><title id="title">先找业务, 再辨别目标</title><desc id="desc">教学案例: “我要退款”来自综合入口.|橙色表示信息不足或被提前排除的候选.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#087f73"/></marker><marker id="risk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#995507"/></marker></defs><rect width="360" height="1130" fill="#ffffff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173042"><text x="18" y="35" font-size="21" font-weight="700" fill="#173042" text-anchor="start">先找业务, 再辨别目标</text><text x="18" y="65" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">教学案例: “我要退款”来自综合入口.</text><text x="18" y="87" font-size="14" font-weight="400" fill="#4d6373" text-anchor="start">橙色表示信息不足或被提前排除的候选.</text><rect x="20" y="115" width="320" height="90" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="143" font-size="15" font-weight="700" fill="#173042" text-anchor="start">输入不止一句话</text><text x="32" y="169" font-size="14" font-weight="400" fill="#173042" text-anchor="start">用户文本 + 入口 + 可用订单信息</text><polygon points="180.0,245 290,292.5 180.0,340 70,292.5" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="180.0" y="297.5" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">业务领域能确定吗?</text><polyline points="180.0,205 180.0,245" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="390" width="145" height="100" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="418" font-size="15" font-weight="700" fill="#173042" text-anchor="start">不能确定</text><text x="32" y="444" font-size="14" font-weight="400" fill="#173042" text-anchor="start">问业务或订单</text><text x="32" y="467" font-size="14" font-weight="400" fill="#173042" text-anchor="start">本轮不执行</text><rect x="195" y="390" width="145" height="100" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="418" font-size="15" font-weight="700" fill="#173042" text-anchor="start">可以确定</text><text x="207" y="444" font-size="14" font-weight="400" fill="#173042" text-anchor="start">保留合理领域</text><text x="207" y="467" font-size="14" font-weight="400" fill="#173042" text-anchor="start">再选意图</text><polyline points="70,292 55,292 55,365 92,365 92,390" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="25" y="350" font-size="13" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="290,292 305,292 305,365 267,365 267,390" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="315" y="350" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">是</text><rect x="20" y="550" width="320" height="120" fill="#eef3f9" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="578" font-size="15" font-weight="700" fill="#173042" text-anchor="start">候选意图保持必要区分</text><text x="32" y="604" font-size="14" font-weight="400" fill="#173042" text-anchor="start">申请退款 / 查询退款进度</text><text x="32" y="627" font-size="14" font-weight="400" fill="#173042" text-anchor="start">“不是退款”不能只匹配退款一词</text><polyline points="267,490 267,525 180,525 180,550" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="180.0,715 290,765.0 180.0,815 70,765.0" fill="#e8f4f1" stroke="#087f73" stroke-width="1.5"/><text x="180.0" y="770.0" font-size="14" font-weight="700" fill="#173042" text-anchor="middle">目标是否清楚且受支持?</text><polyline points="180,670 180,715" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="865" width="145" height="105" fill="#fff3df" stroke="#b6c6cf" stroke-width="1.3"/><text x="32" y="893" font-size="15" font-weight="700" fill="#173042" text-anchor="start">否: 区分原因</text><text x="32" y="919" font-size="14" font-weight="400" fill="#173042" text-anchor="start">歧义→澄清</text><text x="32" y="942" font-size="14" font-weight="400" fill="#173042" text-anchor="start">范围外→说明</text><rect x="195" y="865" width="145" height="105" fill="#e8f4f1" stroke="#b6c6cf" stroke-width="1.3"/><text x="207" y="893" font-size="15" font-weight="700" fill="#173042" text-anchor="start">是: 交给策略</text><text x="207" y="919" font-size="14" font-weight="400" fill="#173042" text-anchor="start">标签 + 参数</text><text x="207" y="942" font-size="14" font-weight="400" fill="#173042" text-anchor="start">证据 + 状态</text><polyline points="70,765 55,765 55,840 92,840 92,865" fill="none" stroke="#995507" stroke-width="1.8" marker-end="url(#risk)"/><text x="24" y="817" font-size="13" font-weight="400" fill="#995507" text-anchor="start">否</text><polyline points="290,765 305,765 305,840 267,840 267,865" fill="none" stroke="#087f73" stroke-width="1.8" marker-end="url(#arrow)"/><text x="315" y="817" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">是</text><text x="20" y="1020" font-size="15" font-weight="400" fill="#995507" text-anchor="start">入口把“酒店”误排除后,</text><text x="20" y="1043" font-size="15" font-weight="400" fill="#995507" text-anchor="start">后面的精排无法选回缺席的酒店意图.</text><polyline points="20,440 6,440 6,160 20,160" fill="none" stroke="#087f73" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="22" y="230" font-size="13" font-weight="400" fill="#087f73" text-anchor="start">新答复</text><text x="18" y="1095" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">简化展示领域与意图筛选关系, 不给出企业阈值.</text><text x="18" y="1113" font-size="13" font-weight="400" fill="#4d6373" text-anchor="start">澄清后从输入重新开始, 不是默认选最高分.</text></g></svg>