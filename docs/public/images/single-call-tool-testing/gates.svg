<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-label="有完整证据, 才能判断结果"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="530" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">有完整证据, 才能判断结果</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">每条用例预先定义允许行为</text><rect x="20" y="90" width="420" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">轨迹完整?</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">且请求已经结束</text><rect x="510" y="90" width="226" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="524" y="118" font-size="19" fill="#243633" font-weight="600">待复核</text><text x="524" y="144" font-size="16" fill="#52665d" font-weight="400">证据缺失</text><path d="M440 130 L510 130" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="482.0" y="126.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M230 176 L230 226" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="237.0" y="197.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="226" width="716" height="112" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="254" font-size="19" fill="#243633" font-weight="600">按本条任务的允许行为核对</text><text x="34" y="280" font-size="16" fill="#52665d" font-weight="400">应调用: 工具、参数、次数、回答与业务状态</text><text x="34" y="304" font-size="16" fill="#52665d" font-weight="400">零调用: 正确澄清/拒绝/回答、零派发、无不应有的副作用</text><path d="M190 338 L190 394" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="197.0" y="362.0" font-size="13" fill="#52665d" font-weight="400">全部符合</text><path d="M563 338 L563 394" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="570.0" y="362.0" font-size="13" fill="#52665d" font-weight="400">任一不符</text><rect x="20" y="394" width="346" height="84" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="422" font-size="19" fill="#243633" font-weight="600">通过</text><rect x="390" y="394" width="346" height="84" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="404" y="422" font-size="19" fill="#243633" font-weight="600">失败</text><text x="24" y="515" font-size="17" fill="#243633" font-weight="400">正确拒绝可以通过; 缺失证据不能自动算通过.</text></g></svg>