<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-label="参数来源和授权来源分开"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="760" height="550" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="24" fill="#243633" font-weight="600">参数来源和授权来源分开</text><text x="22" y="61" font-size="16" fill="#52665d" font-weight="400">示例时钟: 10 月 22 日 10:00, 上海</text><rect x="20" y="90" width="328" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="19" fill="#243633" font-weight="600">用户明确提供</text><text x="34" y="144" font-size="16" fill="#52665d" font-weight="400">SITE-A / CUSTOMER-X</text><rect x="408" y="90" width="328" height="108" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="422" y="118" font-size="19" fill="#243633" font-weight="600">可信时钟 + 日期约定</text><text x="422" y="144" font-size="16" fill="#52665d" font-weight="400">昨天: 21 日 00:00 到 22 日 00:00</text><path d="M184 198 L280 250" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="239.0" y="220.0" font-size="13" fill="#52665d" font-weight="400">对象</text><path d="M572 198 L480 250" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="533.0" y="220.0" font-size="13" fill="#52665d" font-weight="400">时间</text><rect x="196" y="250" width="368" height="92" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="210" y="278" font-size="19" fill="#243633" font-weight="600">执行器: 参数与授权检查</text><rect x="196" y="402" width="368" height="88" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="210" y="430" font-size="19" fill="#243633" font-weight="600">服务端认证上下文</text><text x="210" y="456" font-size="16" fill="#52665d" font-weight="400">账号权限, 不由模型参数声明</text><path d="M380 402 L380 342" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="387.0" y="368.0" font-size="13" fill="#52665d" font-weight="400">权限依据</text><text x="24" y="516" font-size="17" fill="#243633" font-weight="400">结构合法、语义正确、权限允许, 是三个不同检查.</text></g></svg>