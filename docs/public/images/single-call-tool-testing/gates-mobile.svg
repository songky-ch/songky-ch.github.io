<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690" role="img" aria-label="有完整证据, 才能判断结果"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="690" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">有完整证据, 才能判断结果</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">每条用例预先定义允许行为</text><rect x="20" y="90" width="200" height="86" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">轨迹完整?</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">且请求已经结束</text><rect x="246" y="90" width="94" height="86" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="260" y="118" font-size="17" fill="#243633" font-weight="600">待复核</text><text x="260" y="144" font-size="14" fill="#52665d" font-weight="400">证据缺失</text><path d="M220 130 L246 130" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240.0" y="126.0" font-size="13" fill="#52665d" font-weight="400">否</text><path d="M120 176 L120 226" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="127.0" y="197.0" font-size="13" fill="#52665d" font-weight="400">是</text><rect x="20" y="226" width="320" height="156" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="254" font-size="17" fill="#243633" font-weight="600">按任务分开核对</text><text x="34" y="280" font-size="14" fill="#52665d" font-weight="400">应调用: 名称 / 参数 / 次数</text><text x="34" y="304" font-size="14" fill="#52665d" font-weight="400">零调用: 澄清或拒绝 + 零派发</text><text x="34" y="328" font-size="14" fill="#52665d" font-weight="400">两类都查回答与业务状态</text><path d="M100 382 L100 438" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="107.0" y="406.0" font-size="13" fill="#52665d" font-weight="400">全部符合</text><path d="M266 382 L266 438" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="273.0" y="406.0" font-size="13" fill="#52665d" font-weight="400">任一不符</text><rect x="20" y="438" width="150" height="100" rx="9" fill="#e6f4ee" stroke="#73a893"/><text x="34" y="466" font-size="17" fill="#243633" font-weight="600">通过</text><rect x="194" y="438" width="146" height="100" rx="9" fill="#fff0ea" stroke="#d69a84"/><text x="208" y="466" font-size="17" fill="#243633" font-weight="600">失败</text><rect x="20" y="580" width="320" height="80" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="608" font-size="17" fill="#243633" font-weight="600">正确拒绝也能通过</text><text x="34" y="634" font-size="14" fill="#52665d" font-weight="400">前提是任务就要求拒绝</text></g></svg>