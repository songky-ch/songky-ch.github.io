<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-label="参数来源和授权来源分开"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#738980"/></marker></defs><rect width="360" height="710" rx="14" fill="#f8faf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#243633"><text x="22" y="34" font-size="20" fill="#243633" font-weight="600">参数来源和授权来源分开</text><text x="22" y="61" font-size="13" fill="#52665d" font-weight="400">示例时钟: 10 月 22 日 10:00, 上海</text><rect x="20" y="90" width="320" height="95" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="118" font-size="17" fill="#243633" font-weight="600">用户明确提供</text><text x="34" y="144" font-size="14" fill="#52665d" font-weight="400">SITE-A / CUSTOMER-X</text><path d="M20 140 L8 140 L8 420 L20 420" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="226" width="320" height="112" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="254" font-size="17" fill="#243633" font-weight="600">可信时钟 + “昨天”规则</text><text x="34" y="280" font-size="14" fill="#52665d" font-weight="400">10 月 21 日 00:00 起</text><text x="34" y="304" font-size="14" fill="#52665d" font-weight="400">10 月 22 日 00:00 止, 不含终点</text><path d="M180 338 L180 384" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="357.0" font-size="13" fill="#52665d" font-weight="400">时间参数</text><rect x="20" y="384" width="320" height="95" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="412" font-size="17" fill="#243633" font-weight="600">执行器: 检查参数与权限</text><rect x="20" y="536" width="320" height="106" rx="9" fill="#ffffff" stroke="#d6e1da"/><text x="34" y="564" font-size="17" fill="#243633" font-weight="600">服务端认证上下文</text><text x="34" y="590" font-size="14" fill="#52665d" font-weight="400">账号可访问 SITE-A / CUSTOMER-X</text><text x="34" y="614" font-size="14" fill="#52665d" font-weight="400">身份不接受用户文字覆盖</text><path d="M180 536 L180 479" fill="none" stroke="#738980" stroke-width="1.8" marker-end="url(#arrow)"/><text x="187.0" y="503.5" font-size="13" fill="#52665d" font-weight="400">授权依据</text><text x="24" y="685" font-size="15" fill="#243633" font-weight="400">客户参数正确, 仍需核对允许访问范围.</text></g></svg>