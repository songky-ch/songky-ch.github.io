<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1160" role="img" aria-labelledby="title desc"><title id="title">日级评测: 产出链路与校准闭环</title><desc id="desc">从日志到清洗、推理、完整性检查、聚合, 人工抽检持续校准数据与判定标准.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#748ba5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183047}.title{font-size:30px;font-weight:650}.sub{font-size:17px;fill:#50657b}.label{font-size:23px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#50657b}.arrow{fill:none;stroke:#748ba5;stroke-width:3;marker-end:url(#arrow)}</style><rect width="860" height="1160" fill="#f4f7fb"/><text x="70" y="54" class="title">从线上日志到可信指标</text><text x="70" y="84" class="sub">原文 2 / 3.1 / 3.2 / 3.6 的教学重绘</text><rect x="105" y="120" width="685" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="129" y="156" class="label">01  多源日志与当前轮证据</text><text x="129" y="186" class="body">用户诉求 / 路由 / 工具参数与结果 / 最终回复</text><path class="arrow" d="M447 228 V263"/><rect x="105" y="270" width="685" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="129" y="306" class="label">02  数据仓库: 清洗与输入构造</text><text x="129" y="336" class="body">格式修复 → 语义映射 → 去干扰 → 确定目标集合</text><path class="arrow" d="M447 378 V413"/><rect x="105" y="420" width="685" height="105" rx="16" fill="#eaf3ff" stroke="#dce5ef"/><text x="129" y="456" class="label">03  分域推理工作流</text><text x="129" y="486" class="body">输入证据 + 分域评分规则 → Judge → 结构化结果</text><path class="arrow" d="M447 528 V563"/><rect x="105" y="570" width="685" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="129" y="606" class="label">04  完整性与输出校验</text><text x="129" y="636" class="body">原文: 核对条数; 教学补充: 核对身份、重复、版本</text><path class="arrow" d="M447 678 V713"/><rect x="105" y="720" width="685" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="129" y="756" class="label">05  结果聚合与归因</text><text x="129" y="786" class="body">条件通过率 + 可评覆盖率 + 独立安全发现</text><path class="arrow" d="M447 828 V863"/><rect x="105" y="870" width="685" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="129" y="906" class="label">06  人工抽样与争议复核</text><text x="129" y="936" class="body">定位: 数据 / 提示词 / 评分规则 / Agent 真实缺陷</text><path class="arrow" stroke-dasharray="8 6" d="M105 922 H45 V322 H98"/><rect x="105" y="1020" width="685" height="95" rx="16" fill="#eaf8f1" stroke="#bddfcf"/><text x="129" y="1056" class="label">校准后重评受影响样本</text><text x="129" y="1086" class="body">通过率变化需区分"尺子变化"与"产品变化"</text><path class="arrow" d="M447 978 V1012"/><text x="70" y="1140" class="small">图中为教学抽象, 不代表淘宝公开了完整平台实现.</text></svg>