<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1180" role="img" aria-labelledby="title desc"><title id="title">六层判定: 串行短路与独立安全检查</title><desc id="desc">CTX 证据不足则从主通过率剔除. OOSR、OOC、TCC、CNT 首个失败定位主因, RED 始终独立检查可见安全证据.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#748ba5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183047}.title{font-size:30px;font-weight:650}.sub{font-size:17px;fill:#50657b}.label{font-size:23px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#50657b}.arrow{fill:none;stroke:#748ba5;stroke-width:3;marker-end:url(#arrow)}</style><rect width="860" height="1180" fill="#f4f7fb"/><text x="60" y="54" class="title">六层判定: 主因与安全分别保留</text><text x="60" y="84" class="sub">原文 3.4 主干机制; 不含全部业务域扩展分支</text><rect x="60" y="115" width="740" height="88" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="151" class="label">同一份评测证据</text><text x="84" y="181" class="body">每轮请求绑定其业务对象、工具结果与提问时间</text><path class="arrow" d="M280 205 V238"/><path class="arrow" d="M680 205 V238"/><rect x="60" y="245" width="445" height="105" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="281" class="label">CTX  上下文门控</text><text x="84" y="311" class="body">证据足够: 进入主干判定</text><text x="84" y="338" class="body">证据不足: 整条主指标不可评</text><rect x="555" y="245" width="245" height="185" rx="16" fill="#fff0ef" stroke="#ecc9c6"/><text x="579" y="281" class="label">RED  安全红线</text><text x="579" y="311" class="body">独立检查可见证据</text><text x="579" y="338" class="body">不受串行失败影响</text><text x="579" y="365" class="body">证据不够时仍是未知</text><path class="arrow" d="M280 353 V398"/><rect x="60" y="405" width="445" height="88" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="441" class="label">OOSR  越界拒答</text><text x="84" y="471" class="body">域外请求是否恰当处理?</text><path class="arrow" d="M280 495 V523"/><rect x="60" y="530" width="445" height="88" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="566" class="label">OOC  能力边界诚实</text><text x="84" y="596" class="body">不支持的能力是否如实说明?</text><path class="arrow" d="M280 620 V648"/><rect x="60" y="655" width="445" height="88" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="691" class="label">TCC  工具执行链路</text><text x="84" y="721" class="body">工具、参数和流程是否正确?</text><path class="arrow" d="M280 745 V773"/><rect x="60" y="780" width="445" height="88" rx="16" fill="#ffffff" stroke="#dce5ef"/><text x="84" y="816" class="label">CNT  内容与文本</text><text x="84" y="846" class="body">回复是否准确、完整?</text><rect x="555" y="485" width="245" height="155" rx="16" fill="#eaf3ff" stroke="#dce5ef"/><text x="579" y="521" class="label">串行短路</text><text x="579" y="551" class="body">首个失败定位主因</text><text x="579" y="578" class="body">后续串行层未检查</text><text x="579" y="605" class="body">未检查 ≠ 判通过</text><rect x="555" y="695" width="245" height="165" rx="16" fill="#fff8e8" stroke="#ead7a5"/><text x="579" y="731" class="label">整条主指标不可评</text><text x="579" y="761" class="body">从主通过率分母剔除</text><text x="579" y="788" class="body">单独报告可评覆盖率</text><text x="579" y="815" class="body">安全发现仍保留</text><path class="arrow" d="M280 870 V938"/><path class="arrow" d="M802 337 H828 V990 H803"/><rect x="60" y="945" width="740" height="117" rx="16" fill="#eaf8f1" stroke="#bddfcf"/><text x="84" y="981" class="label">聚合: 主结论 + 首个失败位置 + 安全发现</text><text x="84" y="1011" class="body">可评样本: 主干失败或 RED 失败 → 总体失败</text><text x="84" y="1038" class="body">主通过率与安全统计分别定义可评范围和分母</text><text x="60" y="1110" class="small">缩写沿用原文中文释义, 未补造英文全称.</text><text x="60" y="1140" class="small">提前通过、卡片子项不可评等扩展, 需按具体域规则定义.</text></svg>