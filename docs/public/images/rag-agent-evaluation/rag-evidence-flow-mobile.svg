<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 980" role="img" aria-labelledby="title desc">
<title id="title">02 证据是在哪一步丢的?</title><desc id="desc">A = 7 天窗口, B = 商品未使用. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="980" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">02 证据是在哪一步丢的?</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">A = 7 天窗口, B = 商品未使用</tspan>
</text>
<rect x="40" y="96" width="280" height="62" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="132.44" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">问题需要同时判断 A 和 B</tspan>
</text>
<path d="M180 158 V187" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="194" width="280" height="96" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="58" y="226" font-size="19" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="58" dy="0">1. 解析与切分</tspan>
</text>
<text x="58" y="260" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="58" dy="0">语料保留 A + B</tspan>
</text>
<path d="M180 297 V312" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="319" width="280" height="96" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="58" y="351" font-size="19" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="58" dy="0">2. 召回候选</tspan>
</text>
<text x="58" y="385" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="58" dy="0">候选中有 A + B</tspan>
</text>
<path d="M180 422 V437" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="444" width="280" height="96" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="58" y="476" font-size="19" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="58" dy="0">3. 重排</tspan>
</text>
<text x="58" y="510" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="58" dy="0">排到前面的仍有 A + B</tspan>
</text>
<path d="M180 547 V562" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="569" width="280" height="96" rx="0" fill="#fbeeea" stroke="#a33e39" stroke-width="1.3"/>
<text x="58" y="601" font-size="19" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="58" dy="0">4. 压缩与装配</tspan>
</text>
<text x="58" y="635" font-size="16" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="58" dy="0">实际送给模型的只剩 A</tspan>
</text>
<path d="M180 672 V687" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="40" y="694" width="280" height="96" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="58" y="726" font-size="19" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="58" dy="0">5. 生成答案</tspan>
</text>
<text x="58" y="760" font-size="16" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="58" dy="0">答案只解释 A, 遗漏 B</tspan>
</text>
<rect x="40" y="847" width="280" height="82" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="881.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">定位到第 4 步: 查压缩或截断</tspan>
<tspan x="180.0" dy="24.8">修复后重新装配, 再生成、再评</tspan>
</text>
<path d="M180 791 V840" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M40 887 H18 V617 H34" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="342" y="967" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>