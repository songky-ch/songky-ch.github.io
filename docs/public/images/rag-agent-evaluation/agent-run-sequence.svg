<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 920" role="img" aria-labelledby="title desc">
<title id="title">04 一次正常退款怎样核验?</title><desc id="desc">只画符合条件且确认的路径; 分支见图 05. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="820" height="920" fill="#fcfbf7"/>
<text x="36" y="45" font-size="29" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="36" dy="0">04 一次正常退款怎样核验?</tspan>
</text>
<text x="36" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="36" dy="0">只画符合条件且确认的路径; 分支见图 05</tspan>
</text>
<text x="105" y="127" font-size="22" text-anchor="middle" font-weight="600" style="fill:#24364b">
<tspan x="105" dy="0">用户</tspan>
</text>
<path d="M105 146 V712" fill="none" stroke="#c6cbd0" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="365" y="127" font-size="22" text-anchor="middle" font-weight="600" style="fill:#24364b">
<tspan x="365" dy="0">智能体</tspan>
</text>
<path d="M365 146 V712" fill="none" stroke="#c6cbd0" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="705" y="127" font-size="22" text-anchor="middle" font-weight="600" style="fill:#24364b">
<tspan x="705" dy="0">工具 / 业务库</tspan>
</text>
<path d="M705 146 V712" fill="none" stroke="#c6cbd0" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 5"/>
<path d="M105 200 H365" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="235.0" y="188" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="235.0" dy="0">申请为 O-1 退款</tspan>
</text>
<path d="M365 276 H705" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="535.0" y="264" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="535.0" dy="0">只读查询 O-1</tspan>
</text>
<path d="M705 344 H365" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="535.0" y="332" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="535.0" dy="0">条件满足, 10000 分</tspan>
</text>
<path d="M365 415 H105" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="235.0" y="403" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="235.0" dy="0">确认 O-1, 退款 100 元</tspan>
</text>
<path d="M105 483 H365" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="235.0" y="471" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="235.0" dy="0">确认本次操作</tspan>
</text>
<path d="M365 553 H705" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)"/>
<text x="535.0" y="541" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="535.0" dy="0">退款 O-1, 10000 分</tspan>
</text>
<path d="M705 617 H365" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="535.0" y="605" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="535.0" dy="0">返回实际执行结果</tspan>
</text>
<path d="M365 686 H105" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="235.0" y="674" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="235.0" dy="0">按结果告知用户</tspan>
</text>
<rect x="55" y="758" width="710" height="105" rx="0" fill="#e9f0f5" stroke="#285d86" stroke-width="1.3"/>
<text x="77" y="794" font-size="22" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="77" dy="0">评测器另行查库与事件记录</tspan>
</text>
<text x="77" y="830" font-size="18" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="77" dy="0">O-1 = 10000 分; 其他订单未变; 退款次数 = 1; 确认早于写入</tspan>
</text>
<path d="M410 714 V750" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="802" y="907" text-anchor="end" font-size="14" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>