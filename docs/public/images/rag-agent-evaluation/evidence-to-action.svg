<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" role="img"><title>证据到动作的依赖和判定</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#52627b" stroke-width="1.5"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1b2a42} .h{font-size:30px;font-weight:600}.s{font-size:17px}.t{font-size:20px;font-weight:600}.b{fill:#fff;stroke:#c2ccdc;stroke-width:1.5}.a{stroke:#52627b;stroke-width:2;marker-end:url(#arrow);fill:none}</style></defs>
<rect width="1080" height="720" rx="20" fill="#f5f7fb"/>
<text class="h" x="38" y="54">混合评测: 证据怎样支持动作?</text>
<text class="s" x="38" y="86">检查每条必要依赖, 同时允许满足约束的替代路径</text>
<rect class="b" x="36" y="122" width="292" height="100" rx="12"/>
<text class="t" x="182" y="163" text-anchor="middle">知识证据</text>
<text class="s" x="182" y="197" text-anchor="middle">内容 / 版本 / 生效时间</text>
<rect class="b" x="394" y="122" width="292" height="100" rx="12"/>
<text class="t" x="540" y="163" text-anchor="middle">实时业务状态</text>
<text class="s" x="540" y="197" text-anchor="middle">对象 / 身份 / 订单条件</text>
<rect class="b" x="752" y="122" width="292" height="100" rx="12"/>
<text class="t" x="898" y="163" text-anchor="middle">用户授权</text>
<text class="s" x="898" y="197" text-anchor="middle">范围 / 确认 / 时间</text>
<path class="a" d="M182 224 V252 H470 V278"/>
<path class="a" d="M540 224 V278"/>
<path class="a" d="M898 224 V252 H610 V278"/>
<rect x="342" y="284" width="396" height="94" rx="12" fill="#e7f1ff" stroke="#8cadd5"/>
<text class="t" x="540" y="321" text-anchor="middle">决策: 办理 / 拒绝 / 澄清 / 补查</text>
<text class="s" x="540" y="353" text-anchor="middle">证据充分且适用, 满足前置条件</text>
<path class="a" d="M540 381 V401 H182 V419"/>
<rect class="b" x="36" y="427" width="292" height="105" rx="12"/>
<text class="t" x="182" y="468" text-anchor="middle">构造工具参数</text>
<text class="s" x="182" y="503" text-anchor="middle">正确对象 / 金额 / 币种</text>
<path class="a" d="M332 480 H384"/>
<rect class="b" x="394" y="427" width="292" height="105" rx="12"/>
<text class="t" x="540" y="468" text-anchor="middle">执行与核验状态</text>
<text class="s" x="540" y="503" text-anchor="middle">目标达成 / 无额外副作用</text>
<path class="a" d="M690 480 H742"/>
<rect class="b" x="752" y="427" width="292" height="105" rx="12"/>
<text class="t" x="898" y="468" text-anchor="middle">告知与引用</text>
<text class="s" x="898" y="503" text-anchor="middle">所说结果与实际状态一致</text>
<rect x="36" y="575" width="1008" height="107" rx="14" fill="#fff2df"/>
<text class="t" x="62" y="615">硬条件逐项通过, 才计为严格成功</text>
<text class="s" x="62" y="649">证据不足 → 补查或拒答; 缺关键日志 → 标记不可判定并报告覆盖率</text>
</svg>