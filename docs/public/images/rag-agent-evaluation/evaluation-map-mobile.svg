<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 815" role="img" aria-labelledby="title desc">
<title id="title">01 先分清我们在测什么</title><desc id="desc">三类运行链路, 共用一套评测记录. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="815" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">01 先分清我们在测什么</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">三类运行链路, 共用一套评测记录</tspan>
</text>
<rect x="20" y="105" width="320" height="118" rx="0" fill="#f1f4f3" stroke="none" stroke-width="1.3"/>
<text x="34" y="134" font-size="19" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="34" dy="0">RAG · 找资料并回答</tspan>
</text>
<text x="34" y="169" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="34" dy="0">资料 → 相关片段 → 回答</tspan>
</text>
<text x="34" y="200" font-size="15" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="34" dy="0">检查事实、证据和引用</tspan>
</text>
<rect x="20" y="245" width="320" height="118" rx="0" fill="#f1f4f3" stroke="none" stroke-width="1.3"/>
<text x="34" y="274" font-size="19" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="34" dy="0">Agent · 选择工具办事</tspan>
</text>
<text x="34" y="309" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="34" dy="0">目标 → 工具动作 → 业务状态</tspan>
</text>
<text x="34" y="340" font-size="15" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="34" dy="0">检查参数、约束和实际结果</tspan>
</text>
<rect x="20" y="385" width="320" height="118" rx="0" fill="#f1f4f3" stroke="none" stroke-width="1.3"/>
<text x="34" y="414" font-size="19" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="34" dy="0">混合 · 依据资料采取动作</tspan>
</text>
<text x="34" y="449" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="34" dy="0">规则 + 状态 → 判断 → 执行</tspan>
</text>
<text x="34" y="480" font-size="15" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="34" dy="0">再检查证据是否支持这次动作</tspan>
</text>
<path d="M180 508 V545" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="20" y="548" width="320" height="70" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="576.0300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">同一次运行记录</tspan>
<tspan x="180.0" dy="26.35">片段 / 调用 / 返回 / 最终状态</tspan>
</text>
<rect x="20" y="655" width="320" height="80" rx="0" fill="#e9f0f5" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="688.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">独立评分 → 分组统计 → 再评</tspan>
<tspan x="180.0" dy="24.8">参考事实与目标状态只交给评判器</tspan>
</text>
<path d="M180 620 V650" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="10" y="90" width="340" height="428" rx="0" fill="none" stroke="#98a4ad" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="24" y="771" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="24" dy="0">虚线边界: 真值不进入被测应用</tspan>
</text>
<text x="342" y="802" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>