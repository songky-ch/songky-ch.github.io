<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" role="img" aria-labelledby="title desc">
<title id="title">08 发布需要哪些证据?</title><desc id="desc">已知失败阻断, 缺证据补测, 线上退化回滚. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="900" height="815" fill="#fcfbf7"/>
<text x="36" y="45" font-size="29" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="36" dy="0">08 发布需要哪些证据?</tspan>
</text>
<text x="36" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="36" dy="0">已知失败阻断, 缺证据补测, 线上退化回滚</tspan>
</text>
<rect x="32" y="113" width="220" height="90" rx="0" fill="#e9f0f5" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="142.0" y="150.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="142.0" dy="0">候选版本</tspan>
<tspan x="142.0" dy="27.900000000000002">确定影响与必需任务</tspan>
</text>
<rect x="32" y="270" width="195" height="72" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="129.5" y="298.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="129.5" dy="0">组件</tspan>
<tspan x="129.5" dy="27.900000000000002">MTEB / 模型</tspan>
</text>
<path d="M142 203 V237 H129 V263" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M129 342 V373 H450 V400" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="252" y="270" width="195" height="72" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="349.5" y="298.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="349.5" dy="0">语义</tspan>
<tspan x="349.5" dy="27.900000000000002">Ragas</tspan>
</text>
<path d="M142 203 V237 H349 V263" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M349 342 V373 H450 V400" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="472" y="270" width="195" height="72" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="569.5" y="298.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="569.5" dy="0">状态</tspan>
<tspan x="569.5" dy="27.900000000000002">业务断言</tspan>
</text>
<path d="M142 203 V237 H569 V263" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M569 342 V373 H450 V400" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="692" y="270" width="195" height="72" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="789.5" y="298.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="789.5" dy="0">性能</tspan>
<tspan x="789.5" dy="27.900000000000002">模型 + 应用</tspan>
</text>
<path d="M142 203 V237 H789 V263" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M789 342 V373 H450 V400" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="310" y="407" width="280" height="62" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="450.0" y="444.08" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="450.0" dy="0">汇总当前版本必需报告</tspan>
</text>
<path d="M310 438 H272" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<rect x="32" y="405" width="233" height="66" rx="0" fill="#fbeeea" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.5" y="431.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#a33e39">
<tspan x="148.5" dy="0">有失败 → 修改候选</tspan>
<tspan x="148.5" dy="24.8">无失败但缺证据 → 补测</tspan>
</text>
<path d="M32 438 H22 V218 H142 V210" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="6 4"/>
<path d="M450 469 V513" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="468" y="497" font-size="17" text-anchor="start" font-weight="400" style="fill:#246a55">
<tspan x="468" dy="0">全部满足</tspan>
</text>
<rect x="310" y="520" width="280" height="66" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="450.0" y="545.62" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="450.0" dy="0">受控影子 / 小流量试运行</tspan>
<tspan x="450.0" dy="27.900000000000002">采集成熟业务结果</tspan>
</text>
<path d="M310 553 H272" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<rect x="32" y="520" width="233" height="66" rx="0" fill="#fbeeea" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.5" y="546.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#a33e39">
<tspan x="148.5" dy="0">明确退化 → 回滚</tspan>
<tspan x="148.5" dy="24.8">保留失败, 回到候选修复</tspan>
</text>
<path d="M32 553 H15 V156 H25" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="6 4"/>
<path d="M590 553 H627" fill="none" stroke="#94621e" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#o)"/>
<rect x="634" y="520" width="233" height="66" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="750.5" y="546.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#94621e">
<tspan x="750.5" dy="0">未退化但证据不足</tspan>
<tspan x="750.5" dy="24.8">继续观察或结束试运行</tspan>
</text>
<path d="M751 520 V495 H590 V535" fill="none" stroke="#94621e" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#o)" stroke-dasharray="5 4"/>
<path d="M450 586 V665" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="468" y="628" font-size="17" text-anchor="start" font-weight="400" style="fill:#246a55">
<tspan x="468" dy="0">观测充分</tspan>
<tspan x="468" dy="25">且满足本阶段条件</tspan>
</text>
<rect x="310" y="672" width="280" height="62" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="450.0" y="709.4" font-size="20" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="450.0" dy="0">扩大流量, 持续监测</tspan>
</text>
<text x="32" y="780" font-size="17" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="32" dy="0">版本变化后, 原报告能否复用取决于它覆盖的依赖是否仍相同.</tspan>
</text>
<text x="882" y="802" text-anchor="end" font-size="14" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>