<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc">
<title id="title">06 失败与缺证据怎样合并?</title><desc id="desc">与 evaluate.py 的判定优先级保持一致. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="1000" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">06 失败与缺证据怎样合并?</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">与 evaluate.py 的判定优先级保持一致</tspan>
</text>
<rect x="38" y="105" width="284" height="61" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="141.26" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">同一份合成运行记录</tspan>
</text>
<path d="M180 169 V198" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="18" y="207" width="324" height="167" rx="0" fill="#f0f3f1" stroke="#9aa7a5" stroke-width="1.3"/>
<text x="34" y="234" font-size="16" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="34" dy="0">六项分别检查, 互不作为前置条件</tspan>
</text>
<text x="36" y="274" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="36" dy="0">证据</tspan>
</text>
<text x="191" y="274" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="191" dy="0">决策</tspan>
</text>
<text x="36" y="309" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="36" dy="0">工具参数</tspan>
</text>
<text x="191" y="309" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="191" dy="0">确认与次数</tspan>
</text>
<text x="36" y="344" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="36" dy="0">实际状态</tspan>
</text>
<text x="191" y="344" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="191" dy="0">结果告知</tspan>
</text>
<path d="M180 376 V397 H240 V420" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<polygon points="240,425.0 340.0,475 240,525.0 140.0,475" fill="#f3f1e9" stroke="#73818d" stroke-width="1.4"/>
<text x="240" y="468.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="240" dy="0">有任何一项</tspan>
<tspan x="240" dy="24.8">已知失败?</tspan>
</text>
<path d="M139 475 H124" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<text x="119" y="449" font-size="15" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="119" dy="0">是</tspan>
</text>
<rect x="18" y="436" width="100" height="78" rx="0" fill="#fbeeea" stroke="#a33e39" stroke-width="1.3"/>
<text x="68.0" y="468.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#a33e39">
<tspan x="68.0" dy="0">失败</tspan>
<tspan x="68.0" dy="24.8">保留缺口</tspan>
</text>
<path d="M240 527 V585" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="252" y="562" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="252" dy="0">否</tspan>
</text>
<polygon points="240,590.0 340.0,640 240,690.0 140.0,640" fill="#f3f1e9" stroke="#73818d" stroke-width="1.4"/>
<text x="240" y="633.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="240" dy="0">必需项还有</tspan>
<tspan x="240" dy="24.8">证据缺失?</tspan>
</text>
<path d="M139 640 H124" fill="none" stroke="#94621e" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#o)"/>
<text x="119" y="612" font-size="15" text-anchor="start" font-weight="400" style="fill:#94621e">
<tspan x="119" dy="0">是</tspan>
</text>
<rect x="18" y="601" width="100" height="78" rx="0" fill="#f6f0e3" stroke="#94621e" stroke-width="1.3"/>
<text x="68.0" y="633.44" font-size="16" text-anchor="middle" font-weight="400" style="fill:#94621e">
<tspan x="68.0" dy="0">不可判定</tspan>
<tspan x="68.0" dy="24.8">报告覆盖</tspan>
</text>
<path d="M240 692 V751" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="252" y="727" font-size="16" text-anchor="start" font-weight="400" style="fill:#246a55">
<tspan x="252" dy="0">否</tspan>
</text>
<rect x="164" y="759" width="152" height="63" rx="0" fill="#edf3f0" stroke="#246a55" stroke-width="1.3"/>
<text x="240.0" y="796.9" font-size="20" text-anchor="middle" font-weight="400" style="fill:#246a55">
<tspan x="240.0" dy="0">成功</tspan>
</text>
<text x="26" y="879" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="26" dy="0">7 条记录: 2 成功 / 4 失败 / 1 未知</tspan>
<tspan x="26" dy="29">成功比例 2/7, 判定覆盖率 6/7</tspan>
<tspan x="26" dy="29">可判定样本的成功率为 2/6</tspan>
</text>
<text x="342" y="987" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>