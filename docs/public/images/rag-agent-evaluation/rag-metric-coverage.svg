<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670" role="img" aria-labelledby="title desc">
<title id="title">03 满分为何仍会漏答?</title><desc id="desc">参考答案需要 A、B、C, 系统只回答 A. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="820" height="670" fill="#fcfbf7"/>
<text x="36" y="45" font-size="29" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="36" dy="0">03 满分为何仍会漏答?</tspan>
</text>
<text x="36" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="36" dy="0">参考答案需要 A、B、C, 系统只回答 A</tspan>
</text>
<rect x="44" y="118" width="732" height="88" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="68" y="168" font-size="22" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">参考答案</tspan>
</text>
<path d="M280 133 V191" fill="none" stroke="#d2d6d8" stroke-width="1.7" stroke-linejoin="round"/>
<text x="320" y="172" font-size="30" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="320" dy="0">A     B     C</tspan>
</text>
<rect x="44" y="235" width="732" height="88" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="68" y="285" font-size="22" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">实际上下文</tspan>
</text>
<path d="M280 250 V308" fill="none" stroke="#d2d6d8" stroke-width="1.7" stroke-linejoin="round"/>
<text x="320" y="289" font-size="30" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="320" dy="0">A</tspan>
</text>
<rect x="44" y="352" width="732" height="88" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="68" y="402" font-size="22" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">生成答案</tspan>
</text>
<path d="M280 367 V425" fill="none" stroke="#d2d6d8" stroke-width="1.7" stroke-linejoin="round"/>
<text x="320" y="406" font-size="30" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="320" dy="0">A</tspan>
</text>
<rect x="44" y="476" width="346" height="134" rx="0" fill="#f6f0e3" stroke="none" stroke-width="1.3"/>
<text x="66" y="510" font-size="23" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="66" dy="0">上下文召回</tspan>
</text>
<text x="66" y="552" font-size="31" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="66" dy="0">1 / 3</tspan>
</text>
<text x="66" y="588" font-size="18" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="66" dy="0">分母: 参考答案的 3 个事实</tspan>
</text>
<rect x="430" y="476" width="346" height="134" rx="0" fill="#edf3f0" stroke="none" stroke-width="1.3"/>
<text x="452" y="510" font-size="23" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="452" dy="0">忠实性</tspan>
</text>
<text x="452" y="552" font-size="31" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="452" dy="0">1 / 1</tspan>
</text>
<text x="452" y="588" font-size="18" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="452" dy="0">分母: 生成答案的 1 个事实</tspan>
</text>
<text x="46" y="644" font-size="20" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="46" dy="0">一句话有依据, 不能证明用户需要的三件事都已回答.</tspan>
</text>
<text x="802" y="657" text-anchor="end" font-size="14" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>