<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 730" role="img" aria-labelledby="title desc">
<title id="title">01 先分清我们在测什么</title><desc id="desc">三类运行链路, 共用一套评测记录. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="820" height="730" fill="#fcfbf7"/>
<text x="36" y="45" font-size="29" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="36" dy="0">01 先分清我们在测什么</tspan>
</text>
<text x="36" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="36" dy="0">三类运行链路, 共用一套评测记录</tspan>
</text>
<text x="38" y="121" font-size="18" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="38" dy="0">被测应用: 实际输入、检索和工具</tspan>
</text>
<rect x="36" y="138" width="748" height="324" rx="0" fill="none" stroke="#98a4ad" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="54" y="189" font-size="23" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="54" dy="0">RAG</tspan>
</text>
<text x="184" y="187" font-size="22" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="184" dy="0">资料 → 相关片段 → 回答</tspan>
</text>
<text x="184" y="219" font-size="18" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="184" dy="0">核对事实与引用</tspan>
</text>
<path d="M54 242 H764" fill="none" stroke="#d7dadd" stroke-width="1.7" stroke-linejoin="round"/>
<text x="54" y="292" font-size="23" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="54" dy="0">Agent</tspan>
</text>
<text x="184" y="290" font-size="22" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="184" dy="0">目标 → 工具动作 → 业务状态</tspan>
</text>
<text x="184" y="322" font-size="18" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="184" dy="0">核对动作与结果</tspan>
</text>
<path d="M54 345 H764" fill="none" stroke="#d7dadd" stroke-width="1.7" stroke-linejoin="round"/>
<text x="54" y="395" font-size="23" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="54" dy="0">混合</tspan>
</text>
<text x="184" y="393" font-size="22" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="184" dy="0">规则 + 状态 → 判断 → 执行</tspan>
</text>
<text x="184" y="425" font-size="18" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="184" dy="0">核对证据到动作</tspan>
</text>
<path d="M410 463 V507" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="427" y="491" font-size="17" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="427" dy="0">采集</tspan>
</text>
<rect x="267" y="514" width="286" height="70" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="410.0" y="540.8" font-size="20" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="410.0" dy="0">同一次完整运行记录</tspan>
<tspan x="410.0" dy="31.0">片段 / 调用 / 返回 / 状态</tspan>
</text>
<rect x="36" y="521" width="198" height="63" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="135.0" y="545.5300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="135.0" dy="0">评判器专用真值</tspan>
<tspan x="135.0" dy="26.35">参考事实 / 目标状态</tspan>
</text>
<path d="M135 586 V606 H170 V616" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M410 586 V616" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="134" y="623" width="552" height="66" rx="0" fill="#e9f0f5" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="410.0" y="663.04" font-size="22" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="410.0" dy="0">独立判定 → 按任务分组 → 修改后再评</tspan>
</text>
<text x="802" y="717" text-anchor="end" font-size="14" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>