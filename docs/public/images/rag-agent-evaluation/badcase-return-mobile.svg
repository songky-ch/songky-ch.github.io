</text>
<path d="M180 1258 V1297" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="1304" width="300" height="61" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="1340.26" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
