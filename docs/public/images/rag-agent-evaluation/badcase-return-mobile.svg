</text>
<path d="M30 1334 H12 V130 H23" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="32" y="1421" font-size="15" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="32" dy="0">回归失败: 返回修复.</tspan>
<tspan x="32" dy="30">证据补齐 / 审核完成: 重走对应检查.</tspan>
<tspan x="32" dy="30">留出题不混入调优与训练.</tspan>
</text>
