<tspan x="180.0" dy="26.35">新数据版本 + 相邻反例</tspan>
</text>
<path d="M180 1152 V1190" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
