<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc">
<title id="title">04 一次正常退款怎样核验?</title><desc id="desc">只画符合条件且确认的路径; 分支见图 05. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="1160" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">04 一次正常退款怎样核验?</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">只画符合条件且确认的路径; 分支见图 05</tspan>
</text>
<text x="24" y="130" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">01</tspan>
</text>
<text x="68" y="128" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">用户 → 智能体</tspan>
</text>
<text x="68" y="164" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">申请为订单 O-1 退款</tspan>
</text>
<path d="M35 147 V203" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="235" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">02</tspan>
</text>
<text x="68" y="233" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">智能体 → 业务工具</tspan>
</text>
<text x="68" y="269" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">查询 O-1, 暂不写入</tspan>
</text>
<path d="M35 252 V308" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="340" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">03</tspan>
</text>
<text x="68" y="338" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">业务工具 → 智能体</tspan>
</text>
<text x="68" y="374" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">条件满足, 可退 10000 分</tspan>
</text>
<path d="M35 357 V413" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="445" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">04</tspan>
</text>
<text x="68" y="443" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">智能体 → 用户</tspan>
</text>
<text x="68" y="479" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">请确认 O-1, 退款 100 元</tspan>
</text>
<path d="M35 462 V518" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="550" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">05</tspan>
</text>
<text x="68" y="548" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">用户 → 智能体</tspan>
</text>
<text x="68" y="584" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">确认本次操作</tspan>
</text>
<path d="M35 567 V623" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="655" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">06</tspan>
</text>
<text x="68" y="653" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">智能体 → 业务工具</tspan>
</text>
<text x="68" y="689" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">为 O-1 退款 10000 分</tspan>
</text>
<path d="M35 672 V728" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="760" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">07</tspan>
</text>
<text x="68" y="758" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">业务工具 → 智能体</tspan>
</text>
<text x="68" y="794" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">返回本次实际执行结果</tspan>
</text>
<path d="M35 777 V833" fill="none" stroke="#a2acb1" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="24" y="865" font-size="19" text-anchor="start" font-weight="650" style="fill:#285d86">
<tspan x="24" dy="0">08</tspan>
</text>
<text x="68" y="863" font-size="17" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="68" dy="0">智能体 → 用户</tspan>
</text>
<text x="68" y="899" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="68" dy="0">根据执行结果告知状态</tspan>
</text>
<rect x="22" y="1011" width="316" height="100" rx="0" fill="#e9f0f5" stroke="#285d86" stroke-width="1.3"/>
<text x="38" y="1041" font-size="17" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="38" dy="0">评测器在会话结束后独立查库</tspan>
</text>
<text x="38" y="1073" font-size="15" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="38" dy="0">O-1 = 10000 分, 其他订单未变</tspan>
<tspan x="38" dy="23.25">退款次数 = 1, 且确认早于写入</tspan>
</text>
<path d="M180 947 V1003" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="342" y="1147" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>