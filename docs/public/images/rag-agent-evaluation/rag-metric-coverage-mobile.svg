<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 830" role="img" aria-labelledby="title desc">
<title id="title">03 满分为何仍会漏答?</title><desc id="desc">参考答案需要 A、B、C, 系统只回答 A. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="830" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">03 满分为何仍会漏答?</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">参考答案需要 A、B、C, 系统只回答 A</tspan>
</text>
<rect x="24" y="105" width="312" height="102" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="42" y="136" font-size="18" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="42" dy="0">参考答案</tspan>
</text>
<text x="42" y="178" font-size="25" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="42" dy="0">A     B     C</tspan>
</text>
<rect x="24" y="230" width="312" height="102" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="42" y="261" font-size="18" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="42" dy="0">实际上下文</tspan>
</text>
<text x="42" y="303" font-size="25" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="42" dy="0">A</tspan>
</text>
<rect x="24" y="355" width="312" height="102" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="42" y="386" font-size="18" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="42" dy="0">生成答案</tspan>
</text>
<text x="42" y="428" font-size="25" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="42" dy="0">A</tspan>
</text>
<rect x="24" y="491" width="312" height="111" rx="0" fill="#f6f0e3" stroke="none" stroke-width="1.3"/>
<text x="42" y="523" font-size="21" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="42" dy="0">上下文召回 = 1 / 3</tspan>
</text>
<text x="42" y="558" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="42" dy="0">分母: 参考答案的 3 个事实</tspan>
<tspan x="42" dy="24.8">只找到了其中 1 个</tspan>
</text>
<rect x="24" y="627" width="312" height="111" rx="0" fill="#edf3f0" stroke="none" stroke-width="1.3"/>
<text x="42" y="660" font-size="21" text-anchor="start" font-weight="600" style="fill:#24364b">
<tspan x="42" dy="0">忠实性 = 1 / 1</tspan>
</text>
<text x="42" y="694" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="42" dy="0">分母: 生成答案的 1 个事实</tspan>
<tspan x="42" dy="24.8">这一句话确实有依据</tspan>
</text>
<text x="26" y="784" font-size="17" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="26" dy="0">还缺 B、C, 所以完整性没有通过.</tspan>
</text>
<text x="342" y="817" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>