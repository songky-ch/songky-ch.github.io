<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc">
<title id="title">07 数据怎样转一圈?</title><desc id="desc">先离线验收, 再从线上证据改进. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="360" height="1120" fill="#fcfbf7"/>
<text x="22" y="35" font-size="21" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="22" dy="0">07 数据怎样转一圈?</tspan>
</text>
<text x="22" y="63" font-size="14" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="22" dy="0">先离线验收, 再从线上证据改进</tspan>
</text>
<rect x="35" y="102" width="290" height="58" rx="0" fill="#e9f0f5" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="136.76" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">版本 + 数据 + 环境清单</tspan>
</text>
<path d="M180 160 V183 H95 V198" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M180 183 H265 V198" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="25" y="205" width="140" height="100" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="95.0" y="235.62" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="95.0" dy="0">组件评测</tspan>
<tspan x="95.0" dy="26.35">EvalScope</tspan>
<tspan x="95.0" dy="26.35">MTEB</tspan>
</text>
<rect x="195" y="205" width="140" height="100" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="265.0" y="236.76" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="265.0" dy="0">应用回归</tspan>
<tspan x="265.0" dy="24.8">Ragas</tspan>
<tspan x="265.0" dy="24.8">业务状态检查</tspan>
</text>
<path d="M95 305 V335 H180 V357" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M265 305 V335 H180" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round"/>
<rect x="55" y="364" width="250" height="62" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="401.08" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">发布检查</tspan>
</text>
<path d="M180 426 V468" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="192" y="453" font-size="15" text-anchor="start" font-weight="400" style="fill:#246a55">
<tspan x="192" dy="0">满足条件</tspan>
</text>
<rect x="35" y="475" width="290" height="70" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="503.03" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">在线应用 + Langfuse 记录</tspan>
<tspan x="180.0" dy="26.35">实时权限与工具检查</tspan>
</text>
<path d="M180 545 V580" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="35" y="587" width="290" height="68" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="614.0300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">异步评分 + 独立业务结果</tspan>
<tspan x="180.0" dy="26.35">筛选疑似失败与随机样本</tspan>
</text>
<path d="M180 655 V694" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="35" y="701" width="290" height="65" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="726.94" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">审核证据与数据用途</tspan>
<tspan x="180.0" dy="24.8">未批准 → 等待 / 关闭 / 受限</tspan>
</text>
<path d="M180 766 V804" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="191" y="790" font-size="15" text-anchor="start" font-weight="400" style="fill:#246a55">
<tspan x="191" dy="0">批准回归</tspan>
</text>
<rect x="35" y="811" width="290" height="64" rx="0" fill="#e9f0f5" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="848.76" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">新数据版本 + 根因修复</tspan>
</text>
<path d="M35 843 H12 V132 H28" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="6 4"/>
<path d="M305 395 H345 V943 H180 V982" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<text x="78" y="930" font-size="16" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="78" dy="0">未通过: 返回修改与重评</tspan>
</text>
<rect x="35" y="989" width="290" height="58" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="180.0" y="1023.12" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="180.0" dy="0">回到版本清单, 重跑受影响项</tspan>
</text>
<path d="M35 1018 H12 V843" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="30" y="1080" font-size="14" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="30" dy="0">实线: 执行 / 数据; 虚线: 改进回流</tspan>
</text>
<text x="342" y="1107" text-anchor="end" font-size="12" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>