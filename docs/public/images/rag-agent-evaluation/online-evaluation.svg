<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">09 主请求与异步评分怎样分开</title><desc id="desc">明确评分作用域, 等待迟到证据, 不重复业务写入. 本文教学图解, 非引用项目内部架构.</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#24364b"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#285d86"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#246a55"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a33e39"/></marker>
<marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94621e"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#24364b}path,line,rect,polygon{vector-effect:non-scaling-stroke}</style></defs>
<rect width="900" height="850" fill="#fcfbf7"/>
<text x="36" y="45" font-size="29" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="36" dy="0">09 主请求与异步评分怎样分开</tspan>
</text>
<text x="36" y="77" font-size="18" text-anchor="start" font-weight="400" style="fill:#576575">
<tspan x="36" dy="0">明确评分作用域, 等待迟到证据, 不重复业务写入</tspan>
</text>
<rect x="28" y="109" width="240" height="660" rx="0" fill="#f8f7f2" stroke="none" stroke-width="1.3"/>
<text x="45" y="140" font-size="20" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="45" dy="0">用户与应用</tspan>
</text>
<rect x="300" y="109" width="264" height="660" rx="0" fill="#f0f3f4" stroke="none" stroke-width="1.3"/>
<text x="317" y="140" font-size="20" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="317" dy="0">观测与证据</tspan>
</text>
<rect x="596" y="109" width="276" height="660" rx="0" fill="#f8f7f2" stroke="none" stroke-width="1.3"/>
<text x="613" y="140" font-size="20" text-anchor="start" font-weight="650" style="fill:#24364b">
<tspan x="613" dy="0">异步评分任务</tspan>
</text>
<rect x="45" y="174" width="206" height="58" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.0" y="209.08" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="148.0" dy="0">用户请求</tspan>
</text>
<path d="M148 232 V274" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="45" y="281" width="206" height="90" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.0" y="306.62" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="148.0" dy="0">检索 / 决策 / 工具</tspan>
<tspan x="148.0" dy="26.35">实时权限与确认</tspan>
<tspan x="148.0" dy="26.35">记录实际输入输出</tspan>
</text>
<path d="M148 371 V426" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="45" y="433" width="206" height="58" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.0" y="468.08" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="148.0" dy="0">返回用户</tspan>
</text>
<path d="M251 326 H311" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="6 4"/>
<text x="265" y="308" font-size="15" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="265" dy="0">事件</tspan>
</text>
<rect x="318" y="281" width="228" height="90" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="432.0" y="307.76" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="432.0" dy="0">Langfuse 操作记录</tspan>
<tspan x="432.0" dy="24.8">汇齐目标操作所需上下文</tspan>
<tspan x="432.0" dy="24.8">关联独立业务结果</tspan>
</text>
<path d="M546 326 H606" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)"/>
<rect x="613" y="281" width="242" height="90" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="734.0" y="307.76" font-size="16" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="734.0" dy="0">证据够判?</tspan>
<tspan x="734.0" dy="24.8">足够 → 语义 + 状态评分</tspan>
<tspan x="734.0" dy="24.8">已知违规可直接判失败</tspan>
</text>
<path d="M734 371 V429" fill="none" stroke="#246a55" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="613" y="436" width="242" height="70" rx="0" fill="#eef3f1" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="734.0" y="464.03" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="734.0" dy="0">成功: 写入关联分数</tspan>
<tspan x="734.0" dy="26.35">作业账本记录完成</tspan>
</text>
<path d="M613 358 H579 V442 H553" fill="none" stroke="#94621e" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#o)"/>
<rect x="318" y="412" width="228" height="83" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="432.0" y="446.53" font-size="17" text-anchor="middle" font-weight="400" style="fill:#94621e">
<tspan x="432.0" dy="0">证据不足 → 等待</tspan>
<tspan x="432.0" dy="26.35">超时 → 未知 / 排查</tspan>
</text>
<path d="M432 412 V379" fill="none" stroke="#285d86" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#b)" stroke-dasharray="5 4"/>
<text x="322" y="532" font-size="16" text-anchor="start" font-weight="400" style="fill:#285d86">
<tspan x="322" dy="0">迟到事件: 新证据版本再评</tspan>
</text>
<rect x="318" y="580" width="228" height="70" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="432.0" y="608.0300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#a33e39">
<tspan x="432.0" dy="0">评分异常</tspan>
<tspan x="432.0" dy="26.35">有界重试</tspan>
</text>
<path d="M613 300 H580 V615 H553" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<path d="M432 580 V552 H570 V216 H734 V273" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)" stroke-dasharray="5 4"/>
<text x="589" y="204" font-size="16" text-anchor="start" font-weight="400" style="fill:#a33e39">
<tspan x="589" dy="0">重试返回评分</tspan>
</text>
<rect x="45" y="696" width="206" height="60" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="148.0" y="719.0300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#a33e39">
<tspan x="148.0" dy="0">永久评分失败</tspan>
<tspan x="148.0" dy="26.35">告警与排查</tspan>
</text>
<path d="M318 615 H281 V726 H259" fill="none" stroke="#a33e39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#r)"/>
<path d="M734 506 V594" fill="none" stroke="#24364b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="613" y="601" width="242" height="80" rx="0" fill="white" stroke="#c6cbd0" stroke-width="1.3"/>
<text x="734.0" y="634.0300000000001" font-size="17" text-anchor="middle" font-weight="400" style="fill:#24364b">
<tspan x="734.0" dy="0">疑似失败</tspan>
<tspan x="734.0" dy="26.35">进入审核队列</tspan>
</text>
<text x="45" y="625" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="45" dy="0">主路径不等待模型裁判.</tspan>
<tspan x="45" dy="30">业务授权仍在工具执行前检查.</tspan>
</text>
<text x="318" y="721" font-size="16" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="318" dy="0">评分目标操作不自动包含所有兄弟 / 子操作, 需要显式汇总或取齐.</tspan>
</text>
<text x="45" y="815" font-size="17" text-anchor="start" font-weight="400" style="fill:#24364b">
<tspan x="45" dy="0">实线 = 请求 / 评分数据; 虚线 = 异步事件、补证据或评分重试.</tspan>
</text>
<text x="882" y="837" text-anchor="end" font-size="14" style="fill:#647181">教学示意 · 具体判据以任务约定为准</text>
</svg>